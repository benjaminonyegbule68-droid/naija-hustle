<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0F6B6F"
  >

  <title>Naija Hustle</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #EEF1F0;
      --ink: #14201F;
      --lagoon: #0F6B6F;
      --danfo: #FFC20E;
      --brick: #C2410C;
      --card: #fff;
      --mute: #5C6B6A;
      --line: #D5DCDA;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      line-height: 1.45;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .stripe {
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        var(--danfo) 0 28px,
        #14201F 28px 36px
      );
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 96px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.05;
      margin: 24px 0 8px;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 1.3rem;
      font-weight: 800;
      margin: 0 0 4px;
    }

    p {
      margin: 0 0 12px;
    }

    .mute {
      color: var(--mute);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 12px 0 4px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--danfo);
      outline-offset: 2px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--lagoon);
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      margin-top: 16px;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn.alt {
      background: #fff;
      color: var(--lagoon);
      border: 2px solid var(--lagoon);
      margin-top: 0;
      padding: 10px 4px;
      font-size: 0.95rem;
    }

    .btn.alt small {
      display: block;
      font-weight: 600;
      color: var(--mute);
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .link {
      background: none;
      border: 0;
      color: var(--lagoon);
      font-weight: 600;
      text-decoration: underline;
      padding: 8px 0;
      cursor: pointer;
    }

    .err {
      background: #FDE8E0;
      color: #7A2A08;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 12px;
    }

    .ok {
      background: #E2F3E7;
      color: #1C5B2E;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 12px;
    }

    .bg {
      display: block;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      color: var(--ink);
    }

    .bg[aria-pressed="true"] {
      border-color: var(--lagoon);
      box-shadow: inset 6px 0 0 var(--danfo);
    }

    .bg b {
      font-size: 1.1rem;
    }

    .bg .meta {
      color: var(--lagoon);
      font-weight: 600;
      font-size: 0.9rem;
      margin: 2px 0 4px;
    }

    .top {
      background: var(--lagoon);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .top .in {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 16px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .cash {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--danfo);
    }

    .bar {
      height: 10px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--danfo);
    }

    .sk {
      margin: 10px 0;
    }

    .sk .bar {
      background: var(--line);
      margin-top: 4px;
    }

    .sk .bar i {
      background: var(--lagoon);
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 20;
    }

    .nav button {
      flex: 1;
      padding: 14px 4px;
      border: 0;
      background: none;
      font-weight: 600;
      color: var(--mute);
      cursor: pointer;
      border-top: 4px solid transparent;
    }

    .nav button[aria-current="page"] {
      color: var(--lagoon);
      border-top-color: var(--danfo);
    }

    .lb {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }

    .lb:last-child {
      border: 0;
    }

    .pill {
      display: inline-block;
      background: var(--danfo);
      color: #14201F;
      font-weight: 800;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .lock {
      color: var(--brick);
      font-weight: 600;
      margin-top: 10px;
    }

    .big {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--lagoon);
    }

    .map-card {
      padding: 10px !important;
      overflow: hidden;
    }

    .map-svg {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    .map-pin {
      cursor: pointer;
    }

    .district-card.here {
      border-color: var(--danfo);
      box-shadow: 0 0 0 3px rgba(255, 194, 14, 0.25);
    }

    .bonus {
      display: inline-block;
      background: #E8F5F5;
      color: var(--lagoon);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 3px 9px;
      border-radius: 20px;
      margin-top: 6px;
    }

    /* NEEDS */

    .needs-card {
      position: relative;
    }

    .need-row {
      margin: 14px 0;
    }

    .need-row:last-child {
      margin-bottom: 2px;
    }

    .need-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .need-name {
      font-weight: 700;
    }

    .need-value {
      font-weight: 800;
    }

    .need-bar {
      height: 10px;
      background: var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .need-bar i {
      display: block;
      height: 100%;
      border-radius: 8px;
      transition: width 0.25s ease;
    }

    .need-good {
      background: var(--lagoon);
    }

    .need-mid {
      background: var(--danfo);
    }

    .need-low {
      background: var(--brick);
    }

    .needs-note {
      background: #F7F4EC;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--mute);
      font-size: 0.9rem;
      margin-top: 12px;
    }

    /* REAL NIGERIAN CLOCK */

    .clock-card {
      background: var(--ink);
      color: #fff;
      border: 0;
    }

    .clock-day {
      color: var(--danfo);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .clock-time {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 2px;
    }

    .clock-phase {
      color: rgba(255,255,255,.75);
      font-size: .85rem;
    }

    /* ACTIVITIES */

    .activity-card {
      margin: 10px 0 0;
      background: #F7F9F8;
    }

    .activity-icon {
      font-size: 1.35rem;
      margin-right: 5px;
    }

    .activity-action {
      width: auto;
      margin-top: 0;
      padding: 10px 14px;
      white-space: nowrap;
    }

    /* LOADING */

    .loading {
      text-align: center;
      padding: 24px 12px;
      color: var(--mute);
    }

    /* MOBILE */

    @media (max-width: 380px) {
      .wrap {
        padding-left: 12px;
        padding-right: 12px;
      }

      .top .in {
        padding-left: 12px;
        padding-right: 12px;
      }

      .grid3 {
        grid-template-columns: 1fr;
      }

      .activity-card .row {
        align-items: flex-start;
      }

      .activity-action {
        padding: 9px 10px;
        font-size: .9rem;
      }
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =========================================================
       SUPABASE
       ========================================================= */

    const app = document.getElementById("app");

    const SUPABASE_URL =
      "https://pbqtbwiymlwksdtfsfcb.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_-SK-LvMzEwv-oqn8A5hZOQ_rwyzGxUj";

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ) {
      app.innerHTML = `
        <div class="stripe"></div>
        <div class="wrap">
          <h1>Naija Hustle</h1>

          <div class="err">
            <b>Naija Hustle could not start.</b>
            <br><br>
            The Supabase connection library failed to load.
            Check your internet connection and reload the page.
          </div>
        </div>
      `;

      throw new Error(
        "Supabase JavaScript library failed to load."
      );
    }

    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =========================================================
       APP STATE
       ========================================================= */

    const S = {
      user: null,
      ch: null,
      tab: "home",
      mode: "login",
      msg: null,
      picked: null,
      nameDraft: "",
      busy: false,

      jobs: null,
      jobMsg: null,

      activityMsg: null,

      bizTypes: null,
      biz: null,
      bizLoaded: false,
      bizMsg: null,

      districts: null,
      mapMsg: null
    };


    /* =========================================================
       GAME DATA
       ========================================================= */

    const BG = [
      {
        id: "street_boy",
        name: "Street Boy",
        meta: "Starts in Mushin · ₦5,000",
        d: "No capital, no connections, plenty of hustle. Your only collateral is gist."
      },
      {
        id: "graduate",
        name: "Graduate",
        meta: "Starts in Yaba · ₦20,000",
        d: "First class degree, zero job offers. The CV is strong, the NYSC is done."
      },
      {
        id: "nepo_baby",
        name: "Nepo Baby",
        meta: "Starts in Lekki · ₦500,000",
        d: "Daddy's name opens doors. Now prove the doors were worth opening."
      },
      {
        id: "returnee",
        name: "Returnee",
        meta: "Starts in Ikeja · ₦150,000",
        d: "Came back from abroad with savings and a strong accent. Lagos will humble you."
      }
    ];

    const SK = {
      hustle: "Hustle",
      edu: "Education",
      charm: "Charm",
      tech: "Tech"
    };


    /* =========================================================
       HELPERS
       ========================================================= */

    const bgName = id => {
      const bg = BG.find(item => item.id === id);
      return bg ? bg.name : id;
    };

    const esc = value =>
      String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char])
      );

    const naira = value =>
      "₦" +
      Number(value || 0).toLocaleString("en-NG");

    const cap = value => {
      const str = String(value || "");

      return str
        ? str.charAt(0).toUpperCase() + str.slice(1)
        : "";
    };

    const msgHtml = () => {
      if (!S.msg) {
        return "";
      }

      return `
        <div
          class="${S.msg.ok ? "ok" : "err"}"
          role="alert"
          style="margin:12px 0 0"
        >
          ${esc(S.msg.t)}
        </div>
      `;
    };

    const setMsg = (
      text,
      ok = false
    ) => {
      S.msg = text
        ? {
            t: text,
            ok
          }
        : null;
    };


    /* =========================================================
       REAL NIGERIAN CLOCK
       ========================================================= */

    function realTimeInfo() {

      const now = new Date();

      const timeFormatter =
        new Intl.DateTimeFormat(
          "en-NG",
          {
            timeZone: "Africa/Lagos",
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
          }
        );

      const dateFormatter =
        new Intl.DateTimeFormat(
          "en-NG",
          {
            timeZone: "Africa/Lagos",
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

      const hourFormatter =
        new Intl.DateTimeFormat(
          "en-NG",
          {
            timeZone: "Africa/Lagos",
            hour: "numeric",
            hour12: false
          }
        );

      const hour =
        Number(
          hourFormatter.format(now)
        );

      let phase = "Morning";

      if (
        hour >= 12 &&
        hour < 17
      ) {
        phase = "Afternoon";
      } else if (
        hour >= 17 &&
        hour < 21
      ) {
        phase = "Evening";
      } else if (
        hour >= 21 ||
        hour < 5
      ) {
        phase = "Night";
      }

      const icon =
        phase === "Morning"
          ? "🌅"
          : phase === "Afternoon"
            ? "☀️"
            : phase === "Evening"
              ? "🌆"
              : "🌙";

      return {
        time:
          timeFormatter.format(now),

        date:
          dateFormatter.format(now),

        phase,
        icon
      };
    }


    function gameClockHtml() {

      const info =
        realTimeInfo();

      return `
        <div class="card clock-card">

          <div class="row">

            <div>

              <div
                class="clock-day"
                data-real-date
              >
                ${info.date}
              </div>

              <div
                class="clock-time"
                data-game-clock
              >
                ${info.time}
              </div>

            </div>

            <div style="text-align:right">

              <div
                style="font-size:1.5rem"
                data-game-phase-icon
              >
                ${info.icon}
              </div>

              <div
                class="clock-phase"
                data-game-phase
              >
                ${info.phase}
              </div>

            </div>

          </div>

          <div
            style="
              margin-top:8px;
              font-size:.78rem;
              color:rgba(255,255,255,.6);
            "
          >
            🇳🇬 Nigeria · Live time
          </div>

        </div>
      `;
    }


    function startGameClock() {

      if (
        window.naijaClockTimer
      ) {
        clearInterval(
          window.naijaClockTimer
        );
      }

      const updateClock = () => {

        if (
          !document.querySelector(
            "[data-game-clock]"
          )
        ) {
          return;
        }

        const info =
          realTimeInfo();

        const clock =
          document.querySelector(
            "[data-game-clock]"
          );

        const date =
          document.querySelector(
            "[data-real-date]"
          );

        const phase =
          document.querySelector(
            "[data-game-phase]"
          );

        const icon =
          document.querySelector(
            "[data-game-phase-icon]"
          );

        if (clock) {
          clock.textContent =
            info.time;
        }

        if (date) {
          date.textContent =
            info.date;
        }

        if (phase) {
          phase.textContent =
            info.phase;
        }

        if (icon) {
          icon.textContent =
            info.icon;
        }
      };

      updateClock();

      window.naijaClockTimer =
        setInterval(
          updateClock,
          1000
        );
    }


    /* =========================================================
       NEEDS
       ========================================================= */

    const needPct = value =>
      Math.max(
        0,
        Math.min(
          100,
          Number(value) || 0
        )
      );

    const needClass = value => {

      const pct =
        needPct(value);

      if (pct <= 20) {
        return "need-low";
      }

      if (pct <= 50) {
        return "need-mid";
      }

      return "need-good";
    };


    const needsHtml = c => {

      const needs = [
        ["🍗", "Hunger", c.hunger],
        ["🎮", "Fun", c.fun],
        ["🤝", "Social", c.social],
        ["🧼", "Hygiene", c.hygiene]
      ];

      return `
        <div class="card needs-card">

          <h2>
            Needs
          </h2>

          <p class="mute">
            Keep yourself in good shape while you hustle.
          </p>

          ${needs.map(
            ([icon, name, value]) => {

              const pct =
                needPct(value);

              return `
                <div class="need-row">

                  <div class="need-label">

                    <span class="need-name">
                      ${icon}
                      ${name}
                    </span>

                    <span class="need-value">
                      ${pct}/100
                    </span>

                  </div>

                  <div class="need-bar">

                    <i
                      class="${needClass(pct)}"
                      style="width:${pct}%"
                    ></i>

                  </div>

                </div>
              `;

            }
          ).join("")}

          <div class="needs-note">
            Low needs will matter more as activities,
            time, and daily life are added to the game.
          </div>

        </div>
      `;
    };


    /* =========================================================
       ACTIVITIES
       ========================================================= */

    const activitiesHtml = () => {

      const message =
        S.activityMsg
          ? `
            <div
              class="${
                S.activityMsg.ok
                  ? "ok"
                  : "err"
              }"
              role="alert"
            >
              ${esc(S.activityMsg.t)}
            </div>
          `
          : "";

      const activities = [
        {
          id: "eat",
          icon: "🍲",
          name: "Eat",
          description:
            "Grab a proper meal and restore your hunger.",
          cost: 500,
          energy: 1,
          restore: "+30 Hunger"
        },
        {
          id: "entertainment",
          icon: "🎮",
          name: "Entertainment",
          description:
            "Take a break and clear your head.",
          cost: 300,
          energy: 2,
          restore: "+30 Fun"
        },
        {
          id: "socialize",
          icon: "🤝",
          name: "Socialize",
          description:
            "Link up and strengthen your social game.",
          cost: 200,
          energy: 1,
          restore: "+30 Social"
        },
        {
          id: "freshen_up",
          icon: "🧼",
          name: "Freshen Up",
          description:
            "Clean up and get yourself ready to hustle.",
          cost: 100,
          energy: 1,
          restore: "+30 Hygiene"
        }
      ];

      return `
        <div class="card">

          <h2>
            Activities
          </h2>

          <p class="mute">
            Look after yourself so you can keep chasing the bag.
          </p>

          ${message}

          ${activities.map(
            activity => `
              <div class="card activity-card">

                <div class="row">

                  <div style="flex:1">

                    <h2 style="margin:0">

                      <span class="activity-icon">
                        ${activity.icon}
                      </span>

                      ${activity.name}

                    </h2>

                    <p
                      class="mute"
                      style="
                        margin:4px 0 0;
                        font-size:.9rem;
                      "
                    >
                      ${activity.description}
                    </p>

                  </div>

                  <button
                    class="btn activity-action"
                    type="button"
                    data-activity="${activity.id}"
                  >
                    Do it
                  </button>

                </div>

                <p
                  class="mute"
                  style="
                    margin:10px 0 0;
                    font-size:.9rem;
                  "
                >
                  ${naira(activity.cost)}
                  · ${activity.energy} energy
                  · ${activity.restore}
                </p>

              </div>
            `
          ).join("")}

        </div>
      `;
    };


    /* =========================================================
       AUTH
       ========================================================= */

    function viewAuth() {

      if (window.naijaClockTimer) {
        clearInterval(
          window.naijaClockTimer
        );
      }

      const login =
        S.mode === "login";

      app.innerHTML = `
        <div class="stripe"></div>

        <div class="wrap">

          <h1>Naija Hustle</h1>

          <p class="mute">
            Start from the bottom. Own the block.
          </p>

          <div class="card">

            <h2>
              ${login ? "Log in" : "Create account"}
            </h2>

            <label for="em">
              Email
            </label>

            <input
              id="em"
              type="email"
              autocomplete="email"
              inputmode="email"
            >

            <label for="pw">
              Password
            </label>

            <input
              id="pw"
              type="password"
              autocomplete="${
                login
                  ? "current-password"
                  : "new-password"
              }"
              placeholder="At least 6 characters"
            >

            ${msgHtml()}

            <button
              class="btn"
              id="go"
              type="button"
            >
              ${login ? "Log in" : "Sign up"}
            </button>

            <button
              class="link"
              id="sw"
              type="button"
            >
              ${
                login
                  ? "New here? Create an account"
                  : "Have an account? Log in"
              }
            </button>

          </div>

        </div>
      `;

      document
        .getElementById("sw")
        .onclick = () => {

          S.mode =
            login
              ? "signup"
              : "login";

          setMsg(null);

          viewAuth();
        };

      document
        .getElementById("go")
        .onclick = async event => {

          const email =
            document
              .getElementById("em")
              .value
              .trim();

          const password =
            document
              .getElementById("pw")
              .value;

          if (
            !email ||
            password.length < 6
          ) {

            setMsg(
              "Enter your email and a password of at least 6 characters."
            );

            return viewAuth();
          }

          event.target.disabled = true;

          try {

            if (login) {

              const {
                error
              } =
                await db.auth
                  .signInWithPassword({
                    email,
                    password
                  });

              if (error) {

                setMsg(
                  error.message
                );

                viewAuth();
              }

              return;
            }

            const {
              data,
              error
            } =
              await db.auth.signUp({
                email,
                password
              });

            if (error) {

              setMsg(
                error.message
              );

              return viewAuth();
            }

            if (!data.session) {

              setMsg(
                "Account created. Check your email to confirm, then log in.",
                true
              );

              return viewAuth();
            }

          } catch (error) {

            setMsg(
              error?.message ||
              "Authentication failed."
            );

            viewAuth();
          }
        };
    }

    async function go(tab) {

      S.tab = tab;

      S.jobMsg = null;
      S.activityMsg = null;
      S.bizMsg = null;
      S.mapMsg = null;

      if (tab === "business") {
        S.bizLoaded = false;
      }

      viewGame();

      if (tab === "business") {
        return;
      }

      try {

        const {
          data
        } =
          await db.rpc(
            "get_my_character"
          );

        if (
          data &&
          data.id &&
          S.tab === tab &&
          S.ch &&
          (
            data.energy !== S.ch.energy ||
            data.hunger !== S.ch.hunger ||
            data.fun !== S.ch.fun ||
            data.social !== S.ch.social ||
            data.hygiene !== S.ch.hygiene ||
            data.cash !== S.ch.cash ||
            data.level !== S.ch.level ||
            data.xp !== S.ch.xp ||
            data.reputation !== S.ch.reputation ||
            data.district !== S.ch.district
          )
        ) {

          S.ch = data;

          viewGame();
        }

      } catch (error) {

        console.error(
          "Navigation refresh failed:",
          error
        );
      }
    }

      activity

        return;

      try {

        const {
          data,
          error
        } =
          await db.rpc(
            "do_activity",
            {
              p_activity: activity

        S.busy = false;

        if (error) {

          S.activityMsg = {
            t: error.message,
            ok: false
          };

          return viewGame();
        }

        if (!data) {

          S.activityMsg = {
            t:
              "The activity completed but returned no character data.",
            ok: false
          };

          return viewGame();
        }

        S.ch = data;

        const activityNames = {
          eat: "Meal",
          entertainment: "Entertainment",
          socialize: "Socializing",
          freshen_up: "Freshening up"

        const name =

    function jobCard(
      job,
      character
    ) {

      const needs = [];

      const district =
        (S.districts || []).find(
          item =>
            item.id ===
            character.district
        );

      const bonus =
        district &&
        district.bonus_skill === job.trains
          ? Number(district.bonus_pct) || 0
          : 0;

      if (
        Number(character.level) <
        Number(job.min_level)
      ) {

        needs.push(
          "level " +
          job.min_level
        );
      }

      if (
        job.req_skill &&
        Number(
          character[
            "skill_" +
            job.req_skill
          ]
        ) <
        Number(job.req_skill_level)
      ) {

        needs.push(
          SK[job.req_skill] +
          " " +
          job.req_skill_level
        );
      }

      return `
        <div class="card">

          <div class="row">

            <h2>
              ${esc(job.title)}

            <span class="pill">
              ${job.energy_cost}

            <span>

    async function doJob(id) {

      if (S.busy) {
        return;
      }

      S.busy = true;

      const before = S.ch;

      try {

        const {
          data,
          error
        } =
          await db.rpc(
            "do_job",
            {
              p_job_id: id
            }
          );

        S.busy = false;

        if (error) {

          S.jobMsg = {
            t: error.message,
            ok: false
          };

          return viewGame();
        }

        if (!data) {

          S.jobMsg = {
            t:
              "The job completed but returned no character data.",
            ok: false
          };

          return viewGame();
        }

        const job =
          S.jobs.find(
            item =>
              item.id === id
          );

        if (!job) {

          S.jobMsg = {
            t:
              "Job completed.",
            ok: true
          };

          S.ch = data;

          return viewGame();
        }

        const diff =
          Number(data.cash) -
          Number(before.cash);

        let message =
          `${job.title} done. Cash ` +
          `${diff >= 0 ? "+" : "-"}${naira(
            Math.abs(diff)
          )}, ` +
          `+${job.xp} XP.`;

        if (data.last_event) {

          message +=
            " " +
            data.last_event;
        }

        if (
          Number(data.level) >
          Number(before.level)
        ) {

          message +=
            ` Level up! You're now level ${data.level}.`;
        }

        Object.keys(SK)
          .forEach(key => {

            if (
              Number(
                data["skill_" + key]
              ) >
              Number(
                before["skill_" + key]
              )
            ) {

              message +=
                ` ${SK[key]} went up to ` +
                `${data["skill_" + key]}.`;

            }

          });

        S.ch = data;

        S.jobMsg = {
          t: message,
          ok: true
        };

        viewGame();

      } catch (error) {

        S.busy = false;

        S.jobMsg = {
          t:
            error?.message ||
            "The job could not be completed.",
          ok: false
        };

        viewGame();
      }
    }

            </button>

          </div>

          <div class="card">

            <h2>
              Restock
            </h2>

            <p class="mute">
              Each unit costs
              ${naira(
                type.unit_cost
              )}.
            </p>

            ${
              fill > 0
                ? `
                  <div class="grid3">

                    <button
                      class="btn alt"
                      type="button"
                      data-stock="${Math.min(
                        10,
                        fill
                      )}"
                    >
                      +10

                      <small>
                        ${naira(
                          Math.min(
                            10,
                            fill
                          ) *
                          Number(
                            type.unit_cost
                          )
                        )}
                      </small>

                    </button>

                    <button
                      class="btn alt"
                      type="button"
                      data-stock="${Math.min(
                        50,
                        fill
                      )}"
                    >
                      +50

                      <small>
                        ${naira(
                          Math.min(
                            50,
                            fill
                          ) *
                          Number(
                            type.unit_cost
                          )
                        )}
                      </small>

                    </button>

                    <button
                      class="btn alt"
                      type="button"
                      data-stock="${fill}"
                    >
                      Fill

                      <small>
                        ${naira(
                          fill *
                          Number(
                            type.unit_cost
                          )
                        )}
                      </small>

                    </button>

                  </div>
                `
                : `
                  <p>
                    Your shop is full.
                  </p>
                `
            }

          </div>

          <div class="card">

            <h2>
              Upgrade
            </h2>

            <p class="mute">

              More level means more sales
              per hour and more shelf space.

            </p>

            ${
              Number(business.level) < 5
                ? `
                  <button
                    class="btn alt"
                    id="upgrade"
                    type="button"
                    style="width:100%"
                  >

                    Upgrade to level
                    ${
                      Number(
                        business.level
                      ) + 1
                    }

                    <small>
                      ${naira(
                        upgradeCost
                      )}
                    </small>

                  </button>
                `
                : `
                  <p>
                    Max level reached.
                  </p>
                `
            }

          </div>
        `;

      const collect =
        document.getElementById(
          "collect"
        );

      if (collect) {

        collect.onclick = () => {

          const amount =
            Number(
              business.uncollected
            ) || 0;

          bizAct(
            "collect_earnings",
            {},
            data =>
              `Collected ${naira(amount)}.` +
              (
                data &&
                data.character &&
                data.character.last_event
                  ? " " +
                    data.character.last_event
                  : ""
              )
          );
        };
      }

      main
        .querySelectorAll(
          "[data-stock]"
        )
        .forEach(button => {

          button.onclick = () => {

            const units =
              Number(
                button.dataset.stock
              );

            bizAct(
              "restock_business",
              {
                p_units: units
              },
              () =>
                `Restocked ${units} units for ` +
                `${naira(
                  units *
                  Number(
                    type.unit_cost
                  )
                )}.`
            );
          };

        });

      const upgrade =
        document.getElementById(
          "upgrade"
        );

      if (upgrade) {

        upgrade.onclick = () => {

          bizAct(
            "upgrade_business",
            {},
            () =>
              `Upgraded to level ${
                Number(
                  business.level
                ) + 1
              }.`
          );
        };
      }
    }


    async function bizAct(
      functionName,
      args,
      successText
    ) {

      if (S.busy) {
        return;
      }

      S.busy = true;

      try {

        const {
          data,
          error
        } =
          await db.rpc(
            functionName,
            args
          );

        S.busy = false;

        if (error) {

          S.bizMsg = {
            t: error.message,
            ok: false
          };

          return viewGame();
        }

        if (!data) {

          S.bizMsg = {
            t:
              "The action completed but returned no data.",
            ok: false
          };

          return viewGame();
        }

        const message =
          successText(data);

        if (data.character) {

          S.ch =
            data.character;
        }

        if (
          Object.prototype
            .hasOwnProperty
            .call(
              data,
              "business"
            )
        ) {

          S.biz =
            data.business;
        }

        S.bizLoaded = true;

        S.bizMsg = {
          t: message,
          ok: true
        };

        viewGame();

      } catch (error) {

        S.busy = false;

        S.bizMsg = {
          t:
            error?.message ||
            "Business action failed.",
          ok: false
        };

        viewGame();
      }
    }


    /* =========================================================
       DISTRICTS
       ========================================================= */

    async function loadDistricts() {

      if (S.districts) {
        return S.districts;
      }

      const result =
        await db
          .from("districts")
          .select("*")
          .order("travel_cost");

      if (result.error) {
        return null;
      }

      S.districts =
        result.data || [];

      return S.districts;
    }


    /* =========================================================
       MAP
       ========================================================= */

    function mapSvg(
      currentDistrict
    ) {

      const positions = {
        ikeja: [68, 42],
        mushin: [128, 88],
        yaba: [218, 92],
        victoria_island: [195, 175],
        lekki: [278, 188]
      };

      const labels = {
        ikeja: "Ikeja",
        mushin: "Mushin",
        yaba: "Yaba",
        victoria_island: "VI",
        lekki: "Lekki"
      };

      const links = [
        ["ikeja", "mushin"],
        ["mushin", "yaba"],
        ["yaba", "victoria_island"],
        ["victoria_island", "lekki"]
      ];

      const lines =
        links
          .map(
            ([from, to]) => `
              <line
                x1="${positions[from][0]}"
                y1="${positions[from][1]}"
                x2="${positions[to][0]}"
                y2="${positions[to][1]}"
                stroke="#94A3A2"
                stroke-width="2.5"
                stroke-dasharray="6 5"
                stroke-linecap="round"
              />
            `
          )
          .join("");

      const dots =
        Object.keys(
          positions
        )
          .map(id => {

            const [x, y] =
              positions[id];

            const current =
              id === currentDistrict;

            return `
              <g
                class="map-pin${
                  current
                    ? " current"
                    : ""
                }"
                data-id="${id}"
              >

                <circle
                  cx="${x}"
                  cy="${y}"
                  r="${
                    current
                      ? 13
                      : 9
                  }"
                  fill="${
                    current
                      ? "#FFC20E"
                      : "#fff"
                  }"
                  stroke="${
                    current
                      ? "#14201F"
                      : "#0F6B6F"
                  }"
                  stroke-width="3"
                />

                <text
                  x="${x}"
                  y="${
                    y +
                    (
                      current
                        ? 28
                        : 24
                    )
                  }"
                  text-anchor="middle"
                  font-size="12"
                  font-weight="700"
                  fill="#14201F"
                >
                  ${labels[id]}
                </text>

              </g>
            `;
          })
          .join("");

      return `
        <div class="card map-card">

          <svg
            class="map-svg"
            viewBox="0 0 320 230"
            role="img"
            aria-label="Map of Lagos districts"
          >

            <rect
              width="320"
              height="230"
              rx="12"
              fill="#F7F4EC"
            />

            <path
              d="M0 128 C55 112 125 155 205 132
                 S305 122 320 138
                 L320 162
                 C265 152 200 178 115 162
                 S35 152 0 155 Z"
              fill="#A8D5D5"
              opacity="0.85"
            />

            <text
              x="28"
              y="152"
              font-size="11"
              fill="#0F6B6F"
              font-weight="600"
            >
              Lagos Lagoon
            </text>

            ${lines}
            ${dots}

          </svg>

        </div>
      `;
    }


    async function mapView(main) {

      const head =
        S.mapMsg
          ? `
            <div
              class="${
                S.mapMsg.ok
                  ? "ok"
                  : "err"
              }"
              role="alert"
            >
              ${esc(S.mapMsg.t)}
            </div>
          `
          : "";

      if (!S.districts) {

        main.innerHTML = `
          <div class="card">

            <h2>
              Lagos map
            </h2>

            <p class="mute">
              Checking traffic...
            </p>

          </div>
        `;

        await loadDistricts();

        if (
          S.tab !== "map"
        ) {
          return;
        }

        if (!S.districts) {

          main.innerHTML = `
            <div class="err">
              Could not load the map.
            </div>
          `;

          return;
        }
      }

      const current =
        S.ch.district;

      main.innerHTML =
        head +
        `
          <div
            class="card"
            style="margin-bottom:14px"
          >

            <h2 style="margin:0">
              Lagos Map
            </h2>

            <p
              class="mute"
              style="margin:4px 0 0"
            >
              Tap a district on the map
              or use the buttons below.
            </p>

          </div>

          ${mapSvg(current)}

          ${S.districts
            .map(district => {

              const here =
                district.id ===
                current;

              return `
                <div
                  class="card district-card${
                    here
                      ? " here"
                      : ""
                  }"
                >

                  <div class="row">

                    <h2 style="margin:0">
                      ${esc(
                        district.name
                      )}
                    </h2>

                    ${
                      here
                        ? `
                          <span class="pill">
                            You are here
                          </span>
                        `
                        : `
                          <span class="pill">

                            ${naira(
                              district.travel_cost
                            )}

                            ·

                            ${
                              district.travel_energy
                            }

                            energy

                          </span>
                        `
                    }

                  </div>

                  <p
                    class="mute"
                    style="margin:8px 0 4px"
                  >
                    ${esc(
                      district.description
                    )}
                  </p>

                  <div class="bonus">

                    +${district.bonus_pct}%

                    pay on

                    ${
                      SK[
                        district
                          .bonus_skill
                      ] ||
                      district.bonus_skill
                    }

                    jobs

                  </div>

                  ${
                    here
                      ? ""
                      : `
                        <button
                          class="btn"
                          type="button"
                          data-travel="${esc(
                            district.id
                          )}"
                          style="margin-top:14px"
                        >
                          Travel to
                          ${esc(
                            district.name
                          )}
                        </button>
                      `
                  }

                </div>
              `;
            })
            .join("")}
        `;

      main
        .querySelectorAll(
          ".map-pin"
        )
        .forEach(pin => {

          pin.onclick = () => {

            const id =
              pin.dataset.id;

            if (
              id &&
              id !== current
            ) {

              travel(id);

            }
          };

        });

      main
        .querySelectorAll(
          "[data-travel]"
        )
        .forEach(button => {

          button.onclick = () =>
            travel(
              button.dataset.travel
            );

        });
    }


    async function travel(id) {

      if (S.busy) {
        return;
      }

      const district =
        S.districts.find(
          item =>
            item.id === id
        );

      if (!district) {

        S.mapMsg = {
          t:
            "That district could not be found.",
          ok: false
        };

        return viewGame();
      }

      S.busy = true;

      try {

        const {
          data,
          error
        } =
          await db.rpc(
            "travel",
            {
              p_district: id
            }
          );

        S.busy = false;

        if (error) {

          S.mapMsg = {
            t: error.message,
            ok: false
          };

          return viewGame();
        }

        if (!data) {

          S.mapMsg = {
            t:
              "Travel completed but no character data was returned.",
            ok: false
          };

          return viewGame();
        }

        S.ch = data;

        S.mapMsg = {
          t:
            `You reached ${district.name} after the go-slow. ` +
            `It cost ${naira(
              district.travel_cost
            )} ` +
            `and ${district.travel_energy} energy.`,
          ok: true
        };

        viewGame();

      } catch (error) {

        S.busy = false;

        S.mapMsg = {
          t:
            error?.message ||
            "Travel failed.",
          ok: false
        };

        viewGame();
      }
    }


    /* =========================================================
       LEADERBOARD
       ========================================================= */

    async function boardView(main) {

      main.innerHTML = `
        <div class="card">

          <h2>
            Richest in Lagos
          </h2>

          <p class="mute">
            Loading ranks...
          </p>

        </div>
      `;

      const {
        data,
        error
      } =
        await db
          .from("characters")
          .select(
            "name,background,cash,level"
          )
          .order(
            "cash",
            {
              ascending: false
            }
          )
          .limit(20);

      if (
        S.tab !== "board"
      ) {
        return;
      }

      if (error) {

        main.innerHTML = `
          <div class="err">
            ${esc(error.message)}
          </div>
        `;

        return;
      }

      const players =
        data || [];

      main.innerHTML = `
        <div class="card">

          <h2>
            Richest in Lagos
          </h2>

          ${
            players.length
              ? players
                  .map(
                    (
                      player,
                      index
                    ) => `
                      <div class="lb">

                        <span>

                          ${
                            index + 1
                          }.

                          ${esc(
                            player.name
                          )}

                          <span class="mute">

                            ·

                            ${esc(
                              bgName(
                                player.background
                              )
                            )}

                            · Lvl
                            ${player.level}

                          </span>

                        </span>

                        <b>
                          ${naira(
                            player.cash
                          )}
                        </b>

                      </div>
                    `
                  )
                  .join("")
              : `
                <p class="mute">
                  No players yet.
                  Be the first.
                </p>
              `
          }

        </div>
      `;
    }


    /* =========================================================
       LOAD CURRENT USER / CHARACTER
       ========================================================= */

    async function load() {

      if (!S.user) {

        S.ch = null;

        return viewAuth();
      }

      try {

        const {
          data,
          error
        } =
          await db.rpc(
            "get_my_character"
          );

        if (error) {

          setMsg(
            error.message
          );

          return viewAuth();
        }

        S.ch =
          data &&
          data.id
            ? data
            : null;

        if (S.ch) {

          viewGame();

        } else {

          viewCreate();

        }

      } catch (error) {

        console.error(
          "Load failed:",
          error
        );

        setMsg(
          error?.message ||
          "Could not load the game."
        );

        viewAuth();
      }
    }


    /* =========================================================
       AUTH STATE
       ========================================================= */

    db.auth.onAuthStateChange(
      (event, session) => {

        S.user =
          session
            ? session.user
            : null;

        if (
          event ===
          "INITIAL_SESSION"
        ) {
          return;
        }

        setTimeout(
          () => load(),
          0
        );
      }
    );


    /* =========================================================
       INITIAL STARTUP
       ========================================================= */

    (async function init() {

      try {

        const {
          data,
          error
        } =
          await db.auth.getSession();

        if (error) {
          throw error;
        }

        S.user =
          data &&
          data.session
            ? data.session.user
            : null;

        await load();

      } catch (error) {

        console.error(
          "Naija Hustle startup error:",
          error
        );

        app.innerHTML = `
          <div class="stripe"></div>

          <div class="wrap">

            <h1>
              Naija Hustle
            </h1>

            <div class="err">

              <b>
                Something went wrong while starting the game.
              </b>

              <br><br>

              ${esc(
                error?.message ||
                "Unknown startup error."
              )}

            </div>

          </div>
        `;
      }

    })();
  </script>
