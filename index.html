<style>

#jumpBtn,#runBtn{position:absolute;right:20px;width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:rgba(15,20,19,.84);color:#fff;font-weight:900;pointer-events:auto;touch-action:none}#jumpBtn{bottom:102px}#runBtn{bottom:20px}#runBtn.active{background:var(--gold2);color:#18150a}
#viewerBar{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:none;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;gap:6px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}.viewer #viewerBar{display:flex}.viewerBarTitle{font-size:11px;color:var(--muted);padding:0 5px;text-transform:uppercase;letter-spacing:.08em}.viewerToggle{background:rgba(255,255,255,.04);color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}.viewerToggle.on{border-color:var(--gold2);color:var(--gold2)}
#viewerClose{background:transparent;color:#fff;border:0;cursor:pointer;font-size:18px;padding:5px 7px}

#socialPanel{position:fixed;z-index:50;left:50%;top:50%;width:min(610px,94vw);height:min(650px,82vh);transform:translate(-50%,-48%) scale(.98);background:rgba(12,17,16,.98);border:1px solid var(--line);border-radius:20px;box-shadow:0 28px 90px rgba(0,0,0,.48);display:none;overflow:hidden}#socialPanel.open{display:flex;flex-direction:column;animation:pop .18s ease}@keyframes pop{to{transform:translate(-50%,-50%) scale(1)}}
.socialHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.socialTitle{display:flex;gap:10px;align-items:center}.socialTitleDot{width:10px;height:10px;background:var(--gold2);border-radius:50%;box-shadow:0 0 15px rgba(242,183,5,.5)}.socialTabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}.socialTab{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:#fff;padding:9px;cursor:pointer}.socialTab.active{color:#17130a;background:var(--gold2);border-color:transparent;font-weight:900}.socialBody{flex:1;overflow:auto;padding:14px}.chatHistory{display:flex;flex-direction:column;gap:9px}.msg{max-width:84%;padding:9px 11px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.msg.me{margin-left:auto;background:rgba(242,183,5,.12);border-color:rgba(242,183,5,.25)}.msg .who{font-size:11px;color:var(--muted);margin-bottom:3px}.msg .text{font-size:13px;line-height:1.45}.chatComposer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.chatComposer input{flex:1;min-width:0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;border-radius:11px;padding:10px 12px;outline:none}.chatComposer button{background:var(--gold2);color:#17130a;border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.dialogueIntro{padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:12px}.dialogueName{font-weight:900;color:var(--gold2)}.dialogueChoices{display:grid;gap:8px}.choice{padding:11px 12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;border-radius:12px;text-align:left;cursor:pointer}.choice:hover{border-color:rgba(242,183,5,.55);transform:translateY(-1px)}.smallNote{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}
#loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#0c1110;transition:.35s}.loadingCard{width:min(420px,88vw);padding:28px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03);text-align:center}.loadingTitle{font-weight:950;letter-spacing:.04em;font-size:22px}.loadingSub{color:var(--muted);margin-top:8px;font-size:13px}.loader{margin:20px auto 0;width:170px;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.loader::after{content:"";display:block;width:45%;height:100%;background:var(--gold2);animation:load 1.1s infinite ease-in-out}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(420%)}}#loading.hidden{opacity:0;pointer-events:none}
@media(max-width:799px){#minimapWrap{transform:scale(.78);transform-origin:top right;top:58px;right:8px}.hudRight{top:8px}.hudLeft{top:8px}.pill{padding:6px 9px}.miniBtn{padding:7px 8px}.#socialBtn{}
#socialBtn{left:auto;right:106px}.#customizeBtn{left:auto;right:16px}.#emoteBtn{left:16px}.#backBtn{left:16px;bottom:162px}.#emoteMenu{left:16px;bottom:205px}.#toast{bottom:170px}.#prompt{bottom:132px}.#joystick{bottom:20px}.#jumpBtn{bottom:105px}.#runBtn{bottom:20px}

<body>
<div id="game"></div>

<div id="hud">
  <div class="hudLeft">
    <div class="pill"><strong id="name">Guest</strong></div>
    <div class="pill" id="sub">Lagos</div>
    <div class="pill" id="status">Idle</div>
    <div class="pill" id="clock">12:00 PM</div>
  </div>

  <div class="hudRight">
    <button class="miniBtn" id="cameraBtn">3rd</button>
    <button class="miniBtn" id="qualityBtn">High</button>
    <button class="miniBtn" id="viewBtn">View</button>
  </div>

  <div id="minimapWrap"><canvas id="minimap"></canvas></div>
  <div id="toast"></div>
  <button id="prompt">Enter</button>

  <button id="backBtn">Back</button>
  <button id="emoteBtn">Emotes</button>
  <button id="customizeBtn">Avatar</button>
  <button id="socialBtn">Chat</button>

  <div id="emoteMenu">
    <button class="emote" data-emote="wave">Wave</button>
    <button class="emote" data-emote="dance">Dance</button>
    <button class="emote" data-emote="cheer">Cheer</button>
    <button class="emote" data-emote="none">Stop</button>
  </div>

  <div id="joystick"><div id="stick"></div></div>
  <button id="jumpBtn">JUMP</button>
  <button id="runBtn">RUN</button>

  <div id="viewerBar">
    <span class="viewerBarTitle">Viewer</span>
    <button class="viewerToggle" data-preset="full">Full</button>
    <button class="viewerToggle" data-preset="face">Face</button>
    <button class="viewerToggle" data-preset="back">Back</button>
    <button class="viewerToggle" data-pose="idle">Idle</button>
    <button class="viewerToggle" data-pose="walk">Walk</button>
    <button class="viewerToggle" data-pose="run">Run</button>
    <button class="viewerToggle" data-pose="wave">Wave</button>
    <button class="viewerToggle" data-pose="dance">Dance</button>
    <button class="viewerToggle" id="spinBtn">Spin</button>
    <button id="viewerClose">×</button>
  </div>
</div>

<div id="customizer">
  <div class="custHead">
    <b>Avatar Customizer</b>
    <button class="closeBtn" id="closeCustomizer">×</button>
  </div>
  <div class="custBody" id="sections"></div>
  <div class="custActions">
    <button class="custAction" id="randomBtn">Random</button>
    <button class="custAction primary" id="saveConfig">Save Avatar</button>
  </div>
</div>

<div id="socialPanel">
  <div class="socialHead">
    <div class="socialTitle"><span class="socialTitleDot"></span><b>Naija Hustle Social</b></div>
    <button class="closeBtn" id="socialClose">×</button>
  </div>
  <div class="socialTabs">
    <button class="socialTab active" data-social-tab="conversation">Conversation</button>
    <button class="socialTab" data-social-tab="chat">Hustle Chat</button>
    <button class="socialTab" data-social-tab="opportunities">Opportunities</button>
  </div>
  <div class="socialBody" id="socialBody"></div>
  <div class="chatComposer" id="chatComposer">
    <input id="chatInput" maxlength="240" placeholder="Type a message...">
    <button id="chatSend">Send</button>
  </div>
</div>

<div id="loading">
  <div class="loadingCard">
    <div class="loadingTitle">NAIJA HUSTLE</div>
    <div class="loadingSub">Loading your open world...</div>
    <div class="loader"></div>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://pbqtbwiymlwksdtfsfcb.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const damp = (a,b,k,dt) => lerp(a,b,1-Math.exp(-k*dt));
const smoothstep = (a,b,x) => { const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const angDiff = (a,b) => Math.atan2(Math.sin(b-a),Math.cos(b-a));
const has = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
const rng = seed => { let s=seed>>>0; return () => { s=(s*1664525+1013904223)>>>0; return s/4294967296; }; };

const CFG = {
  walk:3.2, run:6.4, accel:14, decel:18, turn:12,
  jump:5.4, gravity:15, world:190, limit:90, road:12,
  sidewalk:3.2, avatarScale:.82, radius:.42, dayMinutes:8
};

const OPTIONS = {
  skinTone:{label:"Skin Tone",kind:"swatch",values:{light:"#f3c7a5",honey:"#d99a6c",tan:"#b9784e",brown:"#855033",deep:"#60351f",dark:"#351d14"}},
  hairstyle:{label:"Hairstyle",values:{low_cut:"Low Cut",fade:"Fade",high_top:"High Top",afro:"Afro",twists:"Twists",braids:"Braids",locs:"Locs",headwrap:"Headwrap",bald:"Bald"}},
  hairColor:{label:"Hair Color",kind:"swatch",values:{black:"#151313",darkBrown:"#2c1b14",brown:"#4b2c1e",burgundy:"#541d2c",blonde:"#d6ad65",grey:"#8d8d8d"}},
  beard:{label:"Beard",values:{none:"None",stubble:"Stubble",goatee:"Goatee",full:"Full"}},
  outfit:{label:"Outfit",values:{hoodie:"Hoodie",tee:"T-Shirt",jersey:"Jersey",kaftan:"Kaftan",agbada:"Agbada",ankara:"Ankara",suit:"Suit"}},
  outfitColor:{label:"Outfit Color",kind:"swatch",values:{default:"default",red:"#b72f2f",blue:"#285ca8",green:"#24734b",purple:"#6942a8",black:"#171717",white:"#e8e4da",gold:"#b88718"}},
  accessory:{label:"Accessory",values:{none:"None",cap:"Cap",glasses:"Glasses",sunglasses:"Sunglasses",chain:"Chain",headphones:"Headphones"}}
};

const DEFAULT_CFG = {
  skinTone:"brown",hairstyle:"fade",hairColor:"black",beard:"none",
  outfit:"hoodie",outfitColor:"default",accessory:"none"
};

const OUTFITS = {
  hoodie:{top:1.02,bottom:0.52,arm:.19},
  tee:{top:.92,bottom:.52,arm:.17},
  jersey:{top:1,bottom:.54,arm:.18},
  kaftan:{top:1.08,bottom:.62,arm:.18},
  agbada:{top:1.18,bottom:.68,arm:.25},
  ankara:{top:1.03,bottom:.56,arm:.19},
  suit:{top:1.02,bottom:.52,arm:.19}
};

function sanitize(raw){
  const out={...DEFAULT_CFG};
  if(!raw||typeof raw!=="object") return out;
  for(const k of Object.keys(DEFAULT_CFG)){
    if(has(OPTIONS,k)&&has(OPTIONS[k].values,raw[k])) out[k]=raw[k];
  }
  return out;
}

/* ---------- world / player state ---------- */
const PLACES = [
  {name:"Job Centre",tab:"jobs",sx:1,sz:-1,color:"#49b7ff",kind:"career"},
  {name:"Market Plaza",tab:"business",sx:-1,sz:-1,color:"#ff8b3d",kind:"market"},
  {name:"Hall of Fame",tab:"board",sx:1,sz:1,color:"#c76cff",kind:"board"},
  {name:"Home",tab:"home",sx:-1,sz:1,color:"#57d98b",kind:"home"}
];

const SOCIAL_PLACES = [
  {name:"Mama's Kitchen",kind:"restaurant",sx:0,sz:-2,color:"#f08a42"},
  {name:"Pulse Club",kind:"club",sx:2,sz:0,color:"#bb62e8"},
  {name:"City View Hotel",kind:"hotel",sx:-2,sz:0,color:"#55a8ff"},
  {name:"Glow Spa",kind:"spa",sx:0,sz:2,color:"#e56ba9"},
  {name:"Aunty Ada's House",kind:"house",sx:-2,sz:2,color:"#67c98b"},
  {name:"Corner Shop",kind:"shop",sx:2,sz:2,color:"#e7b83e"},
  {name:"Onyx Office",kind:"office",sx:2,sz:-2,color:"#8e9cff"},
  {name:"FitLife Gym",kind:"gym",sx:-2,sz:-2,color:"#55d1c7"}
];

const ALL_PLACES = [...PLACES,...SOCIAL_PLACES];

const state = {
  mode:"play",
  cfg:{...DEFAULT_CFG},
  name:"Guest",
  sub:"Lagos",
  user:null,
  keys:{up:false,down:false,left:false,right:false,shift:false},
  joy:{active:false,x:0,y:0},
  runToggle:false,
  jumpQueued:false,
  emote:null,
  status:"Idle",
  quality:localStorage.getItem("nh_quality")||"high",
  socialMessages:[],
  relationships:{},
  opportunities:[],
  activeNpc:null
};

const cam = {mode:"chase",yaw:Math.PI,pitch:.28,dist:5.5};
const viewer = {preset:"full",pose:"idle",yaw:0,pitch:.08,dist:4.6,userDist:undefined,spin:false,lastDrag:0,shiftX:0,shiftY:0};

const player = {
  pos:new THREE.Vector3(7.8,0,14),
  vel:new THREE.Vector3(),
  vy:0,
  yaw:Math.PI,
  char:null,
  tag:null
};

let renderer,scene,camera,sun,stars;
const sunDir = new THREE.Vector3(-.35,.9,.25).normalize();
const colliders=[],buildingRects=[],markers=[],poiList=[],npcs=[],buses=[];
const wish=new THREE.Vector3(),fwd=new THREE.Vector3(),right=new THREE.Vector3();

const geoCache=new Map(),matCache=new Map(),labelCache=new Map();
function geo(key,make){if(!geoCache.has(key))geoCache.set(key,make());return geoCache.get(key)}
function mat(color,rough=.72,metal=0,opts={}){
  const k=`${color}|${rough}|${metal}|${opts?JSON.stringify(opts):""}`;
  if(matCache.has(k))return matCache.get(k);
  const m=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,...opts});
  matCache.set(k,m);return m;
}
function sphereG(r){return geo(`s${r}`,()=>new THREE.SphereGeometry(r,18,14))}
function capsuleG(r,l){return geo(`c${r}_${l}`,()=>new THREE.CapsuleGeometry(r,l,8,12))}
function cylG(rt,rb,h,s=12){return geo(`y${rt}_${rb}_${h}_${s}`,()=>new THREE.CylinderGeometry(rt,rb,h,s))}
function boxG(x,y,z){return geo(`b${x}_${y}_${z}`,()=>new THREE.BoxGeometry(x,y,z))}
function torusG(r,t,rs=10,ts=20,arc=Math.PI*2){return geo(`t${r}_${t}_${rs}_${ts}_${arc}`,()=>new THREE.TorusGeometry(r,t,rs,ts,arc))}

function labelTexture(text,color="#ffffff"){
  const key=`${text}|${color}`;
  if(labelCache.has(key))return labelCache.get(key);
  const c=document.createElement("canvas");c.width=512;c.height=128;
  const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  x.font="900 42px system-ui";x.textAlign="center";x.textBaseline="middle";
  x.strokeStyle="rgba(0,0,0,.75)";x.lineWidth=12;x.strokeText(text,256,64);
  x.fillStyle=color;x.fillText(text,256,64);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  labelCache.set(key,tex);return tex;
}

function makeLabel(text,color="#fff",scale=1){
  const m=new THREE.SpriteMaterial({map:labelTexture(text,color),transparent:true,depthWrite:false});
  const s=new THREE.Sprite(m);s.scale.set(3.5*scale,.88*scale,1);return s;
}

/* ---------- renderer ---------- */
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
}catch(e){
  document.querySelector(".loadingSub").textContent="WebGL could not be started on this device.";
  throw e;
}
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth,innerHeight);

/* ---------- character system ---------- */
function addHair(root,cfg,headRadius){
  const hc=mat(cfg.hairColor==="black"?"#151313":cfg.hairColor==="darkBrown"?"#2c1b14":cfg.hairColor==="brown"?"#4b2c1e":cfg.hairColor==="burgundy"?"#541d2c":cfg.hairColor==="blonde"?"#d6ad65":"#8d8d8d");
  const style=cfg.hairstyle;
  if(style==="bald")return;
  if(style==="headwrap"){
    const band=new THREE.Mesh(torusG(headRadius*.88,.11,8,24),mat("#d6ad65"));
    band.rotation.x=Math.PI/2;band.position.y=.12;root.add(band);return;
  }
  if(style==="afro"){
    const h=new THREE.Mesh(sphereG(headRadius*1.14),hc);h.scale.y=.8;h.position.y=.17;root.add(h);return;
  }
  if(style==="high_top"){
    const h=new THREE.Mesh(capsuleG(headRadius*.58,.45),hc);h.position.y=.38;root.add(h);return;
  }
  if(style==="twists"||style==="locs"||style==="braids"){
    const count=style==="braids"?9:style==="locs"?12:8;
    for(let i=0;i<count;i++){
      const a=i/count*Math.PI*2;
      const h=new THREE.Mesh(capsuleG(.065,.28+Math.random()*.18),hc);
      h.position.set(Math.cos(a)*headRadius*.72,.25+Math.random()*.1,Math.sin(a)*headRadius*.72);
      h.rotation.z=Math.cos(a)*.3;h.rotation.x=-Math.sin(a)*.3;root.add(h);
    }
    const cap=new THREE.Mesh(sphereG(headRadius*.95),hc);cap.scale.y=.58;cap.position.y=.17;root.add(cap);return;
  }
  const cap=new THREE.Mesh(sphereG(headRadius*1.01),hc);
  cap.scale.y=style==="fade"?.52:.62;
  cap.position.y=.22;root.add(cap);
}

function addBeard(root,cfg,headRadius){
  if(cfg.beard==="none")return;
  const bc=mat(cfg.hairColor==="black"?"#151313":cfg.hairColor==="darkBrown"?"#2c1b14":cfg.hairColor==="brown"?"#4b2c1e":cfg.hairColor==="burgundy"?"#541d2c":cfg.hairColor==="blonde"?"#d6ad65":"#777");
  if(cfg.beard==="stubble"){
    const b=new THREE.Mesh(sphereG(headRadius*.55),bc);b.scale.set(.75,.42,.3);b.position.set(0,-.15,.37);root.add(b);
  }else if(cfg.beard==="goatee"){
    const b=new THREE.Mesh(capsuleG(.11,.2),bc);b.position.set(0,-.28,.42);root.add(b);
  }else{
    const b=new THREE.Mesh(sphereG(headRadius*.62),bc);b.scale.set(.78,.55,.4);b.position.set(0,-.15,.39);root.add(b);
  }
}

function addAccessory(root,cfg,headRadius){
  if(cfg.accessory==="none")return;
  if(cfg.accessory==="cap"){
    const cap=new THREE.Mesh(sphereG(headRadius*1.05),mat("#171717"));
    cap.scale.y=.42;cap.position.y=.3;root.add(cap);
    const brim=new THREE.Mesh(boxG(.72,.05,.3),mat("#171717"));brim.position.set(0,.22,.48);root.add(brim);
  }else if(cfg.accessory==="glasses"||cfg.accessory==="sunglasses"){
    const g=mat(cfg.accessory==="sunglasses"?"#101010":"#333");
    for(const x of [-.16,.16]){
      const lens=new THREE.Mesh(boxG(.2,.11,.025),g);lens.position.set(x,.03,.45);root.add(lens);
    }
    const bridge=new THREE.Mesh(boxG(.12,.035,.025),g);bridge.position.set(0,.03,.45);root.add(bridge);
  }else if(cfg.accessory==="chain"){
    const chain=new THREE.Mesh(torusG(.25,.025,6,20),mat("#d7a928",.3,.75));chain.rotation.x=Math.PI/2;chain.position.set(0,-.5,.42);root.add(chain);
  }else if(cfg.accessory==="headphones"){
    const band=new THREE.Mesh(torusG(headRadius*1.02,.055,8,24,Math.PI),mat("#151515"));band.rotation.z=Math.PI;band.position.y=.12;root.add(band);
    for(const x of [-.5,.5]){const d=new THREE.Mesh(cylG(.12,.12,.12),mat("#222"));d.rotation.z=Math.PI/2;d.position.set(x,.05,0);root.add(d)}
  }
}

function addOutfitDetails(root,cfg,bodyW){
  const color=cfg.outfitColor==="default"?"#315d50":OPTIONS.outfitColor.values[cfg.outfitColor];
  const om=mat(color,.72,0);
  if(cfg.outfit==="hoodie"){
    const hood=new THREE.Mesh(torusG(.3,.08,8,20),om);hood.rotation.x=Math.PI/2;hood.position.set(0,.62,-.16);root.add(hood);
  }else if(cfg.outfit==="jersey"){
    const n=new THREE.Mesh(boxG(bodyW*.42,.22,.025),mat("#f1f1e8"));n.position.set(0,.35,.43);root.add(n);
  }else if(cfg.outfit==="agbada"){
    const trim=new THREE.Mesh(torusG(bodyW*.62,.045,6,24),mat("#d8b447",.45,.2));trim.rotation.x=Math.PI/2;trim.position.y=.2;root.add(trim);
  }else if(cfg.outfit==="ankara"){
    const pattern=new THREE.Mesh(boxG(bodyW*.5,.18,.025),mat("#d5b048"));pattern.position.set(0,.4,.44);root.add(pattern);
  }else if(cfg.outfit==="suit"){
    const lapel=new THREE.Mesh(boxG(.08,.6,.03),mat("#e6e2d8"));lapel.position.set(-.14,.25,.44);lapel.rotation.z=-.35;root.add(lapel);
    const lapel2=lapel.clone();lapel2.position.x=.14;lapel2.rotation.z=.35;root.add(lapel2);
  }
}

function createCharacter(rawCfg,opts={}){
  const cfg=sanitize(rawCfg),root=new THREE.Group();
  const scale=opts.scale??CFG.avatarScale;root.scale.setScalar(scale);
  const skin=mat(OPTIONS.skinTone.values[cfg.skinTone]||"#855033");
  const outfitColor=cfg.outfitColor==="default"?"#315d50":OPTIONS.outfitColor.values[cfg.outfitColor];
  const outfitMat=mat(outfitColor);
  const dark=mat("#1b1b1b");
  const bodyW=.72,headR=.36;

  const hips=new THREE.Group();hips.position.y=1.02;root.add(hips);
  const torso=new THREE.Mesh(capsuleG(.38,.72),outfitMat);torso.scale.set(1,.98,.78);torso.position.y=.42;hips.add(torso);
  const spine=new THREE.Group();spine.position.y=.35;hips.add(spine);

  const neck=new THREE.Mesh(cylG(.12,.12,.18),skin);neck.position.y=.83;spine.add(neck);
  const head=new THREE.Group();head.position.y=1.12;spine.add(head);
  const face=new THREE.Mesh(sphereG(headR),skin);head.add(face);

  const eyeMat=mat("#171717");
  for(const x of [-.125,.125]){
    const eye=new THREE.Mesh(sphereG(.035),eyeMat);eye.scale.z=.25;eye.position.set(x,.03,.345);head.add(eye);
  }

  addHair(head,cfg,headR);addBeard(head,cfg,headR);addAccessory(head,cfg,headR);addOutfitDetails(spine,cfg,bodyW);

  const legs=[];
  for(const x of [-.2,.2]){
    const leg=new THREE.Group();leg.position.set(x,-.02,0);hips.add(leg);
    const thigh=new THREE.Mesh(capsuleG(.13,.55),outfitMat);thigh.position.y=-.32;leg.add(thigh);
    const shoe=new THREE.Mesh(boxG(.27,.13,.48),dark);shoe.position.set(0,-.7,.08);leg.add(shoe);legs.push(leg);
  }

  const arms=[];
  for(const x of [-.47,.47]){
    const arm=new THREE.Group();arm.position.set(x,.54,0);spine.add(arm);
    const upper=new THREE.Mesh(capsuleG(.12,.52),outfitMat);upper.position.y=-.25;arm.add(upper);
    const hand=new THREE.Mesh(sphereG(.13),skin);hand.position.y=-.55;arm.add(hand);arms.push(arm);
  }

  const tag=makeLabel(opts.name||"",opts.tagColor||"#fff",.7);
  tag.position.y=2.12;root.add(tag);

  return {root,hips,spine,head,legs,arms,eyes:[],cfg,phase:Math.random()*Math.PI*2,time:0,blinkT:1,blink:false,pose:"idle",tag};
}

function animateCharacter(c,dt,st){
  c.time+=dt;c.phase+=dt*(1+Math.min(2,st.speed*.35));
  const moving=st.speed>.15,run=st.speed>4.6;
  let stride=moving?Math.sin(c.phase*(run?1.8:1.4))*.65:0;
  if(st.air)stride*=.25;
  c.legs[0].rotation.x=stride;c.legs[1].rotation.x=-stride;
  c.arms[0].rotation.x=-stride*.72;c.arms[1].rotation.x=stride*.72;
  c.spine.rotation.z=moving?Math.sin(c.phase)*.035:0;
  c.hips.position.y=1.02+(moving?Math.abs(Math.sin(c.phase*1.4))*.025:0);

  if(st.emote==="wave"){
    c.arms[1].rotation.z=-1.25;c.arms[1].rotation.x=-.5+Math.sin(c.time*8)*.18;
  }else if(st.emote==="dance"){
    c.spine.rotation.y=Math.sin(c.time*5)*.22;c.arms[0].rotation.z=-.8+Math.sin(c.time*6)*.3;c.arms[1].rotation.z=.8+Math.sin(c.time*6+1)*.3;
  }else if(st.emote==="cheer"){
    c.arms[0].rotation.z=-1.35;c.arms[1].rotation.z=1.35;c.arms[0].rotation.x=-.35;c.arms[1].rotation.x=-.35;
  }
}

function rebuildPlayer(){
  if(player.char)scene.remove(player.char.root);
  player.char=createCharacter(state.cfg,{name:state.name||"Guest",tagColor:"#f2b705"});
  scene.add(player.char.root);
  player.char.root.position.copy(player.pos);
  player.char.root.rotation.y=player.yaw;
  player.char.root.visible=cam.mode!=="first";
  player.tag=player.char.tag;
}

function refreshTag(){
  if(player.char&&player.char.tag){
    player.char.tag.material.map=labelTexture(state.name||"Guest","#f2b705");
    player.char.tag.material.needsUpdate=true;
  }
}

/* ---------- world ---------- */
function addCollider(x0,z0,x1,z1,y1=5,building=true){
  const b={x0,z0,x1,z1,y1,building};colliders.push(b);
  if(building)buildingRects.push(b);return b;
}

function buildBuilding(x,z,w,d,h,color="#c2b49a"){
  const m=new THREE.Mesh(boxG(w,h,d),mat(color,.9,0));
  m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
  addCollider(x-w/2,z-d/2,x+w/2,z+d/2,h,true);
  return m;
}

function addRoad(x,z,w,d){
  const m=new THREE.Mesh(boxG(w,.06,d),mat("#2b2e30",.95,0));
  m.position.set(x,.02,z);m.receiveShadow=true;scene.add(m);
  const lineMat=mat("#d8c77c");
  if(w>d){
    for(let i=-w/2+4;i<w/2;i+=7){
      const line=new THREE.Mesh(boxG(3,.012,.06),lineMat);line.position.set(x+i,.055,z);scene.add(line);
    }
  }else{
    for(let i=-d/2+4;i<d/2;i+=7){
      const line=new THREE.Mesh(boxG(.06,.012,3),lineMat);line.position.set(x,.055,z+i);scene.add(line);
    }
  }
}

function buildPlace(p){
  const size=10,cell=32;
  const x=p.sx*cell,z=p.sz*cell;
  const h=p.kind==="career"?8:p.kind==="board"?11:p.kind==="market"?6:p.kind==="home"?5:6+Math.random()*5;
  const color=p.color;
  const building=buildBuilding(x,z,size,size,h,color);
  building.userData.place=p;

  const ring=new THREE.Mesh(torusG(2.1,.08,8,32),mat("#f2b705",.5,.2));
  ring.rotation.x=Math.PI/2;ring.position.set(x,.08,z);scene.add(ring);
  const beam=new THREE.Mesh(cylG(.08,.28,3),new THREE.MeshBasicMaterial({color:"#f2b705",transparent:true,opacity:.16}));
  beam.position.set(x,h+.4,z);scene.add(beam);

  const label=makeLabel(p.name,p.color,.8);label.position.set(x,h+.9,z);scene.add(label);
  markers.push({ring,label,base:h+.9});
  poiList.push({name:p.name,tab:p.tab||"social",kind:p.kind,x,z,color:p.color,building});
}

function buildSocialPlace(p){
  buildPlace({...p,tab:"social"});
}

function buildWorld(){
  const ground=new THREE.Mesh(boxG(CFG.world*2,.4,CFG.world*2),mat("#355b43"));
  ground.position.y=-.22;ground.receiveShadow=true;scene.add(ground);

  const water=new THREE.Mesh(boxG(38,.08,CFG.world*2),mat("#397c8b",.25,.05));
  water.position.set(-78,-.02,0);scene.add(water);

  addRoad(0,0,CFG.world*2,CFG.road);
  addRoad(0,0,CFG.road,CFG.world*2);

  for(let sx=-2;sx<=2;sx++){
    for(let sz=-2;sz<=2;sz++){
      if(sx===0&&sz===0)continue;
      const px=sx*32,pz=sz*32;
      const key=`${sx}_${sz}`;
      const poi=ALL_PLACES.find(p=>`${p.sx}_${p.sz}`===key);
      if(poi) continue;

      for(let i=0;i<3;i++){
        const ox=(i-1)*8,oz=((i%2)?-5:5);
        const w=6+Math.random()*3,d=6+Math.random()*3,h=4+Math.random()*7;
        buildBuilding(px+ox,pz+oz,w,d,h,["#9c8c78","#b3a28b","#827d75","#a88b73"][Math.floor(Math.random()*4)]);
      }
    }
  }

  for(const p of PLACES)buildPlace(p);
  for(const p of SOCIAL_PLACES)buildSocialPlace(p);

  for(let i=0;i<42;i++){
    const x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;
    if(Math.abs(x)<10||Math.abs(z)<10)continue;
    const trunk=new THREE.Mesh(cylG(.13,.18,1.7),mat("#5b3a25"));
    trunk.position.set(x,.85,z);trunk.castShadow=true;scene.add(trunk);
    const leaf=new THREE.Mesh(sphereG(1.25),mat("#2d7349"));
    leaf.position.set(x,2.1,z);leaf.scale.y=1.15;leaf.castShadow=true;scene.add(leaf);
  }

  for(let i=-80;i<=80;i+=10){
    for(const z of [-7,7]){
      const pole=new THREE.Mesh(cylG(.06,.07,3.2),mat("#343434",.65,.25));
      pole.position.set(i,1.6,z);scene.add(pole);
      const lamp=new THREE.Mesh(sphereG(.13),new THREE.MeshBasicMaterial({color:"#ffe8a2"}));
      lamp.position.set(i,3.15,z);scene.add(lamp);
    }
  }

  const skyline=new THREE.Group();
  for(let i=0;i<32;i++){
    const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;
    if(Math.abs(x)<65&&Math.abs(z)<65)continue;
    const h=10+Math.random()*25,w=3+Math.random()*7,d=3+Math.random()*7;
    const b=new THREE.Mesh(boxG(w,h,d),mat("#53615f"));
    b.position.set(x,h/2,z);skyline.add(b);
  }
  scene.add(skyline);
}

/* ---------- traffic ---------- */
function buildBus(x,z,rot=0){
  const root=new THREE.Group();
  const body=new THREE.Mesh(boxG(2.2,1.25,4.6),mat("#d4a321"));
  body.position.y=.75;body.castShadow=true;root.add(body);
  const roof=new THREE.Mesh(boxG(2.05,.16,4.2),mat("#ece6cf"));roof.position.y=1.42;root.add(roof);
  for(const sx of [-1.13,1.13])for(const sz of [-1.35,1.35]){
    const wh=new THREE.Mesh(cylG(.36,.36,.22),mat("#171717"));wh.rotation.z=Math.PI/2;wh.position.set(sx,.38,sz);root.add(wh);
  }
  root.position.set(x,0,z);root.rotation.y=rot;scene.add(root);
  buses.push({mesh:root,speed:2+Math.random()*2.5,axis:Math.random()<.5?"x":"z",dir:Math.random()<.5?-1:1});
}
function buildTraffic(){
  buildBus(-70,0);buildBus(60,0,Math.PI);buildBus(0,-70,Math.PI/2);buildBus(0,70,-Math.PI/2);
}
function updateTraffic(dt){
  for(const b of buses){
    if(b.axis==="x")b.mesh.position.x+=b.speed*b.dir*dt;
    else b.mesh.position.z+=b.speed*b.dir*dt;
    if(Math.abs(b.mesh.position.x)>94||Math.abs(b.mesh.position.z)>94)b.dir*=-1;
  }
}
function pushOutOfBuses(pos,r=.42){
  for(const b of buses){
    const q=b.mesh.position;
    const dx=pos.x-q.x,dz=pos.z-q.z;
    if(Math.abs(dx)<1.7&&Math.abs(dz)<2.8){
      const l=Math.hypot(dx,dz)||1;
      const push=2.1-l;
      if(push>0){pos.x+=dx/l*push;pos.z+=dz/l*push;}
    }
  }
}

/* ---------- NPCs ---------- */
const NPC_NAMES=["Chinedu","Amaka","Tobi","Zainab","Kelechi","Favour","Emeka","Bola","Ada","Ifeanyi","Mariam","Daniel"];
const NPC_PERSONALITIES=["friendly","ambitious","streetwise","creative","business","career"];
function randomCfg(){
  const c={...DEFAULT_CFG};
  for(const k of Object.keys(c)){
    const vals=Object.keys(OPTIONS[k].values);c[k]=vals[Math.floor(Math.random()*vals.length)];
  }
  return c;
}

function buildNPCs(){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,r=18+Math.random()*58;
    const npc={
      id:`npc_${i+1}`,
      name:NPC_NAMES[i%NPC_NAMES.length],
      personality:NPC_PERSONALITIES[i%NPC_PERSONALITIES.length],
      pos:new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),
      target:new THREE.Vector3(),
      speed:.7+Math.random()*.65,
      wait:Math.random()*3,
      char:createCharacter(randomCfg(),{name:NPC_NAMES[i%NPC_NAMES.length],scale:.74,tagColor:"#ffffff"})
    };
    npc.char.root.position.copy(npc.pos);scene.add(npc.char.root);
    npc.target.copy(npc.pos);
    npcs.push(npc);
  }
}

function chooseNpcTarget(n){
  const a=Math.random()*Math.PI*2,r=8+Math.random()*30;
  n.target.set(clamp(n.pos.x+Math.cos(a)*r,-78,78),0,clamp(n.pos.z+Math.sin(a)*r,-78,78));
}
function updateNPCs(dt){
  for(const n of npcs){
    n.wait-=dt;
    if(n.wait<=0){chooseNpcTarget(n);n.wait=3+Math.random()*6}
    const dx=n.target.x-n.pos.x,dz=n.target.z-n.pos.z,d=Math.hypot(dx,dz);
    if(d>.5){
      n.pos.x+=dx/d*n.speed*dt;n.pos.z+=dz/d*n.speed*dt;
      n.char.root.rotation.y=Math.atan2(dx,dz);
    }
    n.char.root.position.copy(n.pos);
    animateCharacter(n.char,dt,{speed:d>.5?n.speed:0,air:false,emote:null});
  }
}

/* ---------- day / night ---------- */
let gameHour=8;
const SKY={day:"#78a9b8",dusk:"#d18b67",night:"#11182b"};
function updateDayNight(dt){
  gameHour=(gameHour+dt*(24/(CFG.dayMinutes*60)))%24;
  const h=gameHour;
  let sky=SKY.day;
  if(h<6||h>20)sky=SKY.night;
  else if(h<8)sky=SKY.dusk;
  else if(h>18)sky=SKY.dusk;
  scene.background.lerp(new THREE.Color(sky),.04);
  scene.fog.color.copy(scene.background);
  const daylight=clamp(Math.sin((h-6)/12*Math.PI),0,1);
  sun.intensity=.35+daylight*2.2;
  hemi.intensity=.45+daylight*1.2;
  moon.intensity=.12+(1-daylight)*.55;
  sunDir.set(Math.cos((h-12)/24*Math.PI*2),Math.sin((h-6)/12*Math.PI),.25).normalize();
  $("clock").textContent=`${((Math.floor(h)+11)%12)+1}:${String(Math.floor((h%1)*60)).padStart(2,"0")} ${h<12?"AM":"PM"}`;
  stars.visible=daylight<.3;
}

/* ---------- movement ---------- */
function resolveCollisions(pos,r){
  for(const b of colliders){
    if(!b.building||pos.y>b.y1)return;
    const cx=clamp(pos.x,b.x0,b.x1),cz=clamp(pos.z,b.z0,b.z1);
    let dx=pos.x-cx,dz=pos.z-cz,d=Math.hypot(dx,dz);
    if(d<r){
      if(d<.0001){const dl=Math.abs(pos.x-b.x0),dr=Math.abs(pos.x-b.x1),dt=Math.abs(pos.z-b.z0),db=Math.abs(pos.z-b.z1);const m=Math.min(dl,dr,dt,db);if(m===dl)pos.x=b.x0-r;else if(m===dr)pos.x=b.x1+r;else if(m===dt)pos.z=b.z0-r;else pos.z=b.z1+r}
      else{pos.x+=dx/d*(r-d);pos.z+=dz/d*(r-d)}
    }
  }
}

function getInput(){
  let x=0,z=0;
  if(state.keys.left)x-=1;if(state.keys.right)x+=1;
  if(state.keys.up)z+=1;if(state.keys.down)z-=1;
  if(state.joy.active){x=state.joy.x;z=-state.joy.y}
  const mag=clamp(Math.hypot(x,z),0,1);
  return {x,z,mag};
}

function updatePlayer(dt){
  const inp=getInput(),hasInput=inp.mag>.08;
  if(hasInput||state.jumpQueued)state.emote=null;
  const wantRun=state.keys.shift||state.runToggle||(state.joy.active&&inp.mag>.92);
  const top=wantRun?CFG.run:CFG.walk;
  const sp=hasInput?top*(state.joy.active?clamp(inp.mag*1.15,.35,1):1):0;

  fwd.set(-Math.sin(cam.yaw),0,-Math.cos(cam.yaw));
  right.set(Math.cos(cam.yaw),0,-Math.sin(cam.yaw));
  wish.set(0,0,0).addScaledVector(right,inp.x).addScaledVector(fwd,-inp.z);
  if(wish.lengthSq()>0)wish.normalize().multiplyScalar(sp);

  const k=hasInput?CFG.accel:CFG.decel;
  player.vel.x=damp(player.vel.x,wish.x,k,dt);
  player.vel.z=damp(player.vel.z,wish.z,k,dt);
  player.pos.x+=player.vel.x*dt;player.pos.z+=player.vel.z*dt;
  player.pos.x=clamp(player.pos.x,-CFG.limit,CFG.limit);player.pos.z=clamp(player.pos.z,-CFG.limit,CFG.limit);
  resolveCollisions(player.pos,CFG.radius);pushOutOfBuses(player.pos,CFG.radius);

  if(player.pos.y<=.001&&state.jumpQueued)player.vy=CFG.jump;
  state.jumpQueued=false;
  player.vy-=CFG.gravity*dt;player.pos.y+=player.vy*dt;
  if(player.pos.y<0){player.pos.y=0;player.vy=0}

  const spd=Math.hypot(player.vel.x,player.vel.z);
  if(spd>.4)player.yaw+=angDiff(player.yaw,Math.atan2(player.vel.x,player.vel.z))*Math.min(1,CFG.turn*dt);

  const air=player.pos.y>.04;
  state.status=air?"Jumping":state.emote?"Emote":spd>4.6?"Running":spd>.4?"Walking":"Idle";
  player.char.root.position.copy(player.pos);player.char.root.rotation.y=player.yaw;
  animateCharacter(player.char,dt,{speed:spd,air,emote:state.emote});
}

function updateViewerPlayer(dt){
  player.vel.set(0,0,0);
  const pose=viewer.pose,speed=pose==="walk"?2.6:pose==="run"?6.2:0;
  const emote=pose==="wave"||pose==="dance"||pose==="cheer"?pose:null;
  player.char.root.position.copy(player.pos);player.char.root.rotation.y=player.yaw;
  animateCharacter(player.char,dt,{speed,emote});
  state.status="Viewing";
}

    const d=Math.hypot(n.pos.x-player.pos.x,n.pos.z-player.pos.z);

/* ---------- camera ---------- */
const camTarget=new THREE.Vector3(),camDesired=new THREE.Vector3(),camDir=new THREE.Vector3();
const camSmoothTarget=new THREE.Vector3(0,1.5,0),camPos=new THREE.Vector3(0,3,8);
let camInit=false;

function rayHit(ox,oy,oz,dx,dy,dz,maxT,margin){
  let best=maxT;
  for(const b of colliders){
    if(!b.building)continue;
    let tmin=0,tmax=maxT,ok=true;
    for(const ax of [0,1]){
      const o=ax?oz:ox,d=ax?dz:dx,lo=(ax?b.z0:b.x0)-margin,hi=(ax?b.z1:b.x1)+margin;
      if(Math.abs(d)<1e-6){if(o<lo||o>hi){ok=false;break}}
      else{let t1=(lo-o)/d,t2=(hi-o)/d;if(t1>t2){const s=t1;t1=t2;t2=s}tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax){ok=false;break}}
    }
    if(!ok)continue;
    if(oy+dy*tmin>b.y1+margin)continue;
    if(tmin<best)best=tmin;
  }
  return best;
}

function placeOrbitCamera(target,yaw,pitch,dist,dt,followK){
  const cp=Math.cos(pitch);
  camDir.set(Math.sin(yaw)*cp,Math.sin(pitch),Math.cos(yaw)*cp);
  const hit=rayHit(target.x,target.y,target.z,camDir.x,camDir.y,camDir.z,dist,.35);
  const d=Math.max(.9,Math.min(dist,hit-.2));
  camDesired.copy(target).addScaledVector(camDir,d);camDesired.y=Math.max(camDesired.y,.35);
  camPos.lerp(camDesired,1-Math.exp(-followK*dt));
  camSmoothTarget.lerp(target,1-Math.exp(-(followK+4)*dt));
  camera.position.copy(camPos);camera.lookAt(camSmoothTarget);
}

function updateCamera(dt){
  if(!camInit){camPos.set(player.pos.x,3.5,player.pos.z+7);camSmoothTarget.set(player.pos.x,1.5,player.pos.z);camInit=true}
  if(state.mode==="viewer"){
    if(viewer.spin&&performance.now()/1000-viewer.lastDrag>1.5)viewer.yaw+=dt*.55;
    const pr=viewer.preset,wantDist=pr==="face"?1.7:4.6,wantTy=pr==="face"?1.58:1;
    viewer.dist=damp(viewer.dist,viewer.userDist??wantDist,6,dt);viewer.ty=damp(viewer.ty??wantTy,wantTy,6,dt);
    camTarget.set(player.pos.x,player.pos.y+viewer.ty,player.pos.z);
    placeOrbitCamera(camTarget,viewer.yaw,viewer.pitch,viewer.dist,dt,9);
  }else if(cam.mode==="first"){
    const hy=player.pos.y+1.62,cp=Math.cos(cam.pitch);
    camera.position.set(player.pos.x-Math.sin(cam.yaw)*.1,hy,player.pos.z-Math.cos(cam.yaw)*.1);
    camDir.set(-Math.sin(cam.yaw)*cp,-Math.sin(cam.pitch),-Math.cos(cam.yaw)*cp);
    camera.lookAt(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
    camPos.copy(camera.position);camSmoothTarget.set(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
  }else{
    camTarget.set(player.pos.x,player.pos.y+1.45,player.pos.z);
    const d=cam.mode==="far"?cam.dist*1.8:cam.dist;
    placeOrbitCamera(camTarget,cam.yaw,cam.pitch,d,dt,10);
  }

  const open=$("customizer").classList.contains("open"),wide=innerWidth>=800;
  viewer.shiftY=damp(viewer.shiftY,open&&!wide?innerHeight*.2:0,8,dt);
  viewer.shiftX=damp(viewer.shiftX,open&&wide?innerWidth*.15:0,8,dt);
  if(Math.abs(viewer.shiftY)+Math.abs(viewer.shiftX)>.5)camera.setViewOffset(innerWidth,innerHeight,viewer.shiftX,viewer.shiftY,innerWidth,innerHeight);
  else if(camera.view&&camera.view.enabled)camera.clearViewOffset();
}

function updateSun(){
  sun.position.set(player.pos.x+sunDir.x*45,player.pos.y+sunDir.y*45,player.pos.z+sunDir.z*45);

}

/* ---------- minimap ---------- */
const mm=$("minimap"),mx=mm.getContext("2d");mm.width=mm.height=220;
function drawMinimap(){
  const S=2.6,M=220;mx.clearRect(0,0,M,M);mx.save();
  mx.beginPath();mx.arc(M/2,M/2,M/2,0,Math.PI*2);mx.clip();
  mx.fillStyle="#2f5a45";mx.fillRect(0,0,M,M);
  const theta=-Math.PI/2-Math.atan2(-Math.cos(cam.yaw),-Math.sin(cam.yaw));
  mx.save();mx.translate(M/2,M/2);mx.rotate(theta);mx.scale(S,S);mx.translate(-player.pos.x,-player.pos.z);
  mx.fillStyle="#2c3033";mx.fillRect(-6,-100,12,200);mx.fillRect(-100,-6,200,12);
  mx.fillStyle="#b9ab8d";for(const b of buildingRects)mx.fillRect(b.x0,b.z0,b.x1-b.x0,b.z1-b.z0);
  for(const p of poiList){mx.fillStyle=p.color;mx.beginPath();mx.arc(p.x,p.z,2.6,0,7);mx.fill();mx.strokeStyle="#FFC20E";mx.lineWidth=.7;mx.stroke()}
  mx.fillStyle="#fff";for(const n of npcs){mx.beginPath();mx.arc(n.pos.x,n.pos.z,.9,0,7);mx.fill()}
  mx.fillStyle="#f2b705";for(const b of buses)mx.fillRect(b.mesh.position.x-1,b.mesh.position.z-1,2,2);
  mx.restore();
  const ang=Math.atan2(Math.cos(player.yaw),Math.sin(player.yaw))+theta;
  mx.translate(M/2,M/2);mx.rotate(ang);mx.fillStyle="#FFC20E";mx.strokeStyle="#14201F";mx.lineWidth=3;
  mx.beginPath();mx.moveTo(12,0);mx.lineTo(-8,8);mx.lineTo(-4,0);mx.lineTo(-8,-8);mx.closePath();mx.fill();mx.stroke();mx.restore();
}

function relationLevel(id){
  return state.relationships[id]||0;
}

function addRelationship(n,amount){
  state.relationships[n.id]=clamp(relationLevel(n.id)+amount,0,100);
}

function addOpportunity(name){
  if(!name)return;
  if(!state.opportunities.some(o=>o.name===name)){
    state.opportunities.unshift({name,from:state.activeNpc?.name||"Unknown",at:Date.now()});
    if(state.opportunities.length>20)state.opportunities.pop();
    toast(`New opportunity: ${name}`);
  }
}

function openConversation(npc){
  if(!npc)return;
  state.activeNpc=npc;
  $("socialPanel").classList.add("open");
  setSocialTab("conversation");
  renderConversation(npc);
}

function renderConversation(npc){
  const body=$("socialBody");
  const d=DIALOGUES[npc.personality]||DIALOGUES.friendly;
  const level=relationLevel(npc.id);
  body.innerHTML="";
  const intro=document.createElement("div");intro.className="dialogueIntro";
  intro.innerHTML=`<div class="dialogueName">${npc.name}</div><div>${d.intro(npc)}</div><div class="smallNote">Relationship: ${level}/100 · Personality: ${npc.personality}</div>`;
  body.appendChild(intro);
  const choices=document.createElement("div");choices.className="dialogueChoices";
  d.choices.forEach(c=>{
    const b=document.createElement("button");b.className="choice";b.textContent=c.text;
    b.addEventListener("click",()=>{
      addRelationship(npc,c.rel||1);if(c.opp)addOpportunity(c.opp);
      body.innerHTML="";
      const response=document.createElement("div");response.className="dialogueIntro";
      response.innerHTML=`<div class="dialogueName">${npc.name}</div><div>${c.reply}</div><div class="smallNote">Relationship: ${relationLevel(npc.id)}/100</div>`;
      body.appendChild(response);
      const again=document.createElement("button");again.className="choice";again.textContent="Continue talking";

      body.appendChild(again);
      const done=document.createElement("button");done.className="choice";done.textContent="End conversation";

function sendChat(){
  const input=$("chatInput");
  const text=input.value.trim();

  if(!text)return;

  state.socialMessages.push({
    who:state.name||"Guest",
    text,
    time:Date.now()
  });

  /*
   * Local NPC/system response.
   * This keeps the current build functional without inventing
   * a Supabase chat table that does not exist in the supplied code.
   */
  const lower=text.toLowerCase();

  let reply=null;

  if(
    lower.includes("job")||
    lower.includes("work")||
    lower.includes("hire")
  ){
    reply="System: Check the Job Centre for available career opportunities.";
  }else if(
    lower.includes("business")||
    lower.includes("money")||
    lower.includes("customer")
  ){
    reply="System: Talk to people around Market Plaza and business areas. Relationships can reveal useful leads.";
  }else if(
    lower.includes("hello")||
    lower.includes("hi")||
    lower.includes("hey")
  ){
    reply="Chinedu: Welcome to Naija Hustle. Keep moving and keep building.";
  }else{
    reply="System: Keep exploring. Social conversations can unlock jobs, business leads and other opportunities.";
  }

  if(reply){
    setTimeout(()=>{
      state.socialMessages.push({
        who:"Hustle System",
        text:reply,
        time:Date.now()
      });

      saveLocalState();

      if(
        $("socialPanel").classList.contains("open")&&
        document.querySelector(".socialTab.active")?.dataset.socialTab==="chat"
      ){
        renderHustleChat();
      }
    },500);
  }

  input.value="";
  saveLocalState();
  renderHustleChat();
}

/* ---------- joystick + buttons ---------- */

const joy=$("joystick");
const stick=$("stick");

let joyId=null;

function setJoy(cx,cy){
  const r=joy.getBoundingClientRect();
  const ox=r.left+r.width/2;
  const oy=r.top+r.height/2;

  let x=cx-ox;
  let y=cy-oy;

  const rad=r.width*.34;
  const d=Math.hypot(x,y);

  if(d>rad){
    x=x/d*rad;
    y=y/d*rad;
  }

  state.joy.x=x/rad;
  state.joy.y=y/rad;

  stick.style.transform=`translate(${x}px,${y}px)`;
}

function resetJoy(){
  joyId=null;
  state.joy.active=false;
  state.joy.x=0;
  state.joy.y=0;
  stick.style.transform="translate(0,0)";
}

joy.addEventListener("pointerdown",e=>{
  e.preventDefault();

  joyId=e.pointerId;

  try{
    joy.setPointerCapture(e.pointerId);
  }catch{}

  state.joy.active=true;

  setJoy(e.clientX,e.clientY);
});

joy.addEventListener("pointermove",e=>{
  if(e.pointerId===joyId){
    setJoy(e.clientX,e.clientY);
  }
});

joy.addEventListener("pointerup",resetJoy);
joy.addEventListener("pointercancel",resetJoy);

$("jumpBtn").addEventListener("pointerdown",e=>{
  e.preventDefault();

});

$("runBtn").addEventListener("pointerdown",e=>{

  );

/* ---------- camera drag / pinch / wheel ---------- */

const cv=renderer.domElement;
const pointers=new Map();

let pinch=0;

function zoom(d){
  if(state.mode==="viewer"){
    viewer.userDist=clamp(
      (viewer.userDist??viewer.dist)+d,
      1.2,
      8
    );

    viewer.lastDrag=performance.now()/1000;
  }else{
    cam.dist=clamp(
      cam.dist+d,
      2.8,
      10
    );
  }
}

cv.addEventListener("pointerdown",e=>{
  try{
    cv.setPointerCapture(e.pointerId);
  }catch{}

  pointers.set(e.pointerId,{
    x:e.clientX,
    y:e.clientY
  });

  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinch=Math.hypot(
      a.x-b.x,
      a.y-b.y
    );
  }
});

cv.addEventListener("pointermove",e=>{
  const p=pointers.get(e.pointerId);

  if(!p)return;

  const dx=e.clientX-p.x;
  const dy=e.clientY-p.y;

  p.x=e.clientX;
  p.y=e.clientY;

  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(
      a.x-b.x,
      a.y-b.y
    );

    zoom(-(d-pinch)*.02);
    pinch=d;

    return;
  }

  if(state.mode==="viewer"){
    viewer.yaw-=dx*.01;

    viewer.pitch=clamp(
      viewer.pitch+dy*.005,
      -.25,
      1
    );

    viewer.lastDrag=performance.now()/1000;
  }else{
    cam.yaw-=dx*.006;

    cam.pitch=clamp(
      cam.pitch+dy*.004,
      cam.mode==="first"?-1.2:-.05,
      cam.mode==="first"?1.2:1.15
    );
  }
});

const endPointer=e=>{
  pointers.delete(e.pointerId);
};

cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",endPointer);

cv.addEventListener(
  "wheel",
  e=>{
    e.preventDefault();
    zoom(e.deltaY*.005);
  },
  {passive:false}
);

cv.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

const KEYMAP={
  w:"up",
  arrowup:"up",
  s:"down",
  arrowdown:"down",
  a:"left",
  arrowleft:"left",
  d:"right",
  arrowright:"right",
  shift:"shift"
};

addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();

  if(has(KEYMAP,k)){
    state.keys[KEYMAP[k]]=true;
    e.preventDefault();
  }

  if(k===" "){
    state.jumpQueued=true;
    e.preventDefault();
  }

  if(k==="e"){
    enterPlace();
  }

  if(k==="c"){
    $("cameraBtn").click();
  }

  if(k==="v"){
    if(state.mode==="viewer"){
      exitViewer();
    }else{
      enterViewer("full");
    }

  if(k==="escape"){
    if($("socialPanel").classList.contains("open")){

      $("customizer").classList.remove("open");
    }else if(state.mode==="viewer"){
      exitViewer();
    }
  }
});

addEventListener("keyup",e=>{

  if(has(KEYMAP,k)){
    state.keys[KEYMAP[k]]=false;
  }
});

const NH_SOCIAL_KEY = "nh_social_v1";

const NH_SOCIAL_DEFAULTS = {
  reputation: 0,
  relationships: {},
  contacts: {},
  jobs: [],
  missions: [],
  businessLeads: [],
  conversationCount: 0
};

function cloneSocialDefaults(){
  return JSON.parse(
    JSON.stringify(NH_SOCIAL_DEFAULTS)
  );
}

function loadSocialState(){
  try{
    const raw=localStorage.getItem(NH_SOCIAL_KEY);

    if(!raw){
      return cloneSocialDefaults();
    }

    const data=JSON.parse(raw);

    return {
      ...cloneSocialDefaults(),
      ...data,
      relationships:data.relationships||{},
      contacts:data.contacts||{},
      jobs:Array.isArray(data.jobs)?data.jobs:[],
      missions:Array.isArray(data.missions)?data.missions:[],
      businessLeads:Array.isArray(data.businessLeads)
        ?data.businessLeads
        :[]
    };
  }catch{
    return cloneSocialDefaults();
  }
}

state.socialData=loadSocialState();

function saveSocialState(){
  try{
    localStorage.setItem(
      NH_SOCIAL_KEY,
      JSON.stringify(state.socialData)
    );
  }catch{}
}

function socialHash(value){
  let h=0;

  const text=String(value||"");

  for(let i=0;i<text.length;i++){
    h=(h*31+text.charCodeAt(i))>>>0;
  }

  return h;
}

function getNpcSocialId(npc,index){
  return String(
    npc?.id||
    npc?.npcId||
    npc?.name||
    `npc_${index}`
  )
    .toLowerCase()
    .replace(/[^a-z0-9_-]/g,"_");
}

function getNpcProfile(npc,index){
  const id=getNpcSocialId(npc,index);
  const seed=socialHash(id);

  const personality=
    SOCIAL_PERSONALITIES[
      seed%SOCIAL_PERSONALITIES.length
    ];

  return {
    id,
    name:
      npc?.name||
      SOCIAL_NAMES[
        seed%SOCIAL_NAMES.length
      ],
    role:
      npc?.role||
      npc?.job||
      SOCIAL_ROLES[
        seed%SOCIAL_ROLES.length
      ],
    personality
  };
}

/* =========================================================
RELATIONSHIPS
========================================================= */

function getRelationship(id){
  return clamp(
    Number(
      state.socialData.relationships[id]||0
    ),
    -100,
    100
  );
}

function relationshipLabel(score){
  if(score>=75)return "Close Friend";
  if(score>=45)return "Friend";
  if(score>=20)return "Friendly";
  if(score>-20)return "Neutral";
  if(score>-50)return "Cold";
  return "Hostile";
}

function changeRelationship(id,amount){
  const old=getRelationship(id);

  const next=clamp(
    old+Number(amount||0),
    -100,
    100
  );

  state.socialData.relationships[id]=next;

  state.socialData.reputation=clamp(
    Number(
      state.socialData.reputation||0
    )+(Number(amount||0)*0.35),
    -100,
    100
  );

  saveSocialState();

  return next;
}

function getReputation(){
  return Number(
    state.socialData.reputation||0
  );
}

/* =========================================================
SOCIAL LOCATION CHECK
========================================================= */

const SOCIAL_LOCATION_WORDS=[
  "restaurant",
  "food",
  "hotel",
  "spa",
  "house",
  "home",
  "shop",
  "store",
  "market",
  "office",
  "gym",
  "fitness",
  "club",
  "lounge",
  "salon",
  "cafe",
  "business"
];

function isSocialLocation(obj){
  if(!obj)return false;

  if(
    obj.social===true||
    obj.isSocial===true||
    obj.socialZone===true
  ){
    return true;
  }

  const text=[
    obj.name,
    obj.label,
    obj.type,
    obj.kind,
    obj.category,
    obj.tab
  ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  return SOCIAL_LOCATION_WORDS.some(
    word=>text.includes(word)
  );
}

function getNearbySocialLocation(){
  if(
    typeof poiList==="undefined"||
    !Array.isArray(poiList)||
    !player?.pos
  ){
    return null;
  }

  let closest=null;
  let closestDistance=Infinity;

  for(const p of poiList){
    if(!p||!isSocialLocation(p))continue;

    const d=Math.hypot(
      (p.x||0)-player.pos.x,
      (p.z||0)-player.pos.z
    );

    if(d<8&&d<closestDistance){
      closest=p;
      closestDistance=d;
    }
  }

  return closest;
}

/* =========================================================
NEAREST NPC
========================================================= */

function getNearbySocialNpc(maxDistance=3.4){
  if(
    typeof npcs==="undefined"||
    !Array.isArray(npcs)||
    !player?.pos
  ){
    return null;
  }

  let result=null;
  let distance=maxDistance;

  npcs.forEach((npc,index)=>{
    if(!npc?.pos)return;

    const d=Math.hypot(
      (npc.pos.x||0)-player.pos.x,
      (npc.pos.z||0)-player.pos.z
    );

    if(d<distance){
      distance=d;

      result={
        npc,
        index,
        distance,
        profile:getNpcProfile(
          npc,
          index
        )
      };
    }
  });

  return result;
}

let nearbySocialNpc=null;
let nearbySocialLocation=null;

function updateSocialNpcPrompt(){
  if(
    state.mode!=="play"||
    state.activeNpc||
    $("socialPanel").classList.contains("open")
  ){
    return;
  }

  nearbySocialLocation=
    getNearbySocialLocation();

  nearbySocialNpc=
    getNearbySocialNpc();

  /*
   * NPC conversations only become available
   * when the player is near both:
   * 1. a social location
   * 2. an NPC
   */

  if(
    !nearbySocialLocation||
    !nearbySocialNpc
  ){
    return;
  }

  const profile=
    nearbySocialNpc.profile;

  /*
   * Reuse the existing prompt.
   * We do not create another social button.
   */

  const prompt=$("prompt");

  if(!prompt)return;

  prompt.textContent=
    `Talk to ${profile.name}`;

  prompt.classList.add("show");

  prompt.onclick=()=>{
    openNpcConversation(
      nearbySocialNpc
    );
  };
}

/* =========================================================
CONVERSATION DATA
========================================================= */

function getConversationGreeting(profile){
  const relationship=
    getRelationship(profile.id);

  if(relationship>=45){
    return `Good to see you again. How's the hustle going?`;
  }

  if(relationship<=-30){
    return `I didn't expect to see you here.`;
  }

  const greetings=
    profile.personality.greetings;

  return greetings[
    socialHash(
      profile.id+
      state.socialData.conversationCount
    )%greetings.length
  ];
}

function getConversationChoices(profile){
  const relationship=
    getRelationship(profile.id);

  const choices=[
    {
      id:"friendly",
      text:"Ask how things are going",
      change:3
    },
    {
      id:"work",
      text:"Ask about work opportunities",
      change:4
    },
    {
      id:"business",
      text:"Ask about business",
      change:5
    }
  ];

  if(relationship>=20){
    choices.push({
      id:"life",
      text:"Talk about life",
      change:6
    });
  }

  if(relationship>=35){
    choices.push({
      id:"connection",
      text:"Ask if they know anyone useful",
      change:8
    });
  }

  choices.push({
    id:"rude",
    text:"Be disrespectful",
    change:-10
  });

  choices.push({
    id:"leave",
    text:"End the conversation",
    change:0
  });

  return choices;
}

function getConversationReply(profile,choice){
  switch(choice.id){

    case"friendly":
      return {
        player:"How are things going with you?",
        npc:
          "Things dey alright. Just keeping things moving."
      };

    case"work":
      return {
        player:"Do you know anywhere looking for workers?",
        npc:
          "I hear about opportunities from time to time. Build your reputation and keep talking to people."
      };

    case"business":
      return {
        player:"I'm interested in building something of my own.",
        npc:
          "That's good. Business is mostly about solving problems and knowing the right people."
      };

    case"life":
      return {
        player:"How's life treating you?",
        npc:
          "Life no easy, but you learn plenty when you keep moving. Don't forget why you're hustling."
      };

    case"connection":
      return {
        player:"Do you know anyone who could help me grow?",
        npc:
          "Maybe. Keep proving yourself and I can introduce you to somebody."
      };

    case"rude":
      return {

        npc:

      };

    default:
      return {
        player:"",
        npc:"Alright. Take care."
      };
  }
}

/* =========================================================
SOCIAL PANEL RENDERING
========================================================= */

function renderNpcConversation(profile){
  const messages=$("socialMessages");

  if(!messages)return;

  messages.innerHTML="";

  const relationship=
    getRelationship(profile.id);

  const greeting=
    getConversationGreeting(profile);

  messages.innerHTML+=`
    <div class="chatBubble npc">
      <b>${escapeHtml(profile.name)}</b>
      <div>${escapeHtml(greeting)}</div>
    </div>
  `;

  const choices=
    getConversationChoices(profile);

  const choiceBox=
    $("socialChoices");

  if(!choiceBox)return;

  choiceBox.innerHTML="";

  for(const choice of choices){

    const button=
      document.createElement("button");

    button.type="button";

    button.className=
      "socialChoice";

    button.textContent=
      choice.text;

    button.addEventListener(
      "click",
      ()=>{
        chooseNpcResponse(
          profile,
          choice
        );
      }
    );

    choiceBox.appendChild(button);
  }

  const relationText=
    relationshipLabel(
      relationship
    );

  const relationEl=
    $("socialRelationship");

  if(relationEl){
    relationEl.textContent=
      relationText;
  }

  const scoreEl=
    $("socialRelationshipScore");

  if(scoreEl){
    scoreEl.textContent=
      relationship>0
        ?`+${relationship}`
        :String(relationship);
  }
}

/* =========================================================
CONVERSATION OPEN
========================================================= */

function openNpcConversation(target){
  if(!target?.profile)return;

  state.activeNpc={
    npc:target.npc,
    index:target.index,
    profile:target.profile
  };

  state.socialData.conversationCount++;

  saveSocialState();

  $("socialPanel").classList.add("open");

  setSocialTab("conversation");

  renderNpcConversation(
    target.profile
  );

  /*
   * Stop movement while talking.
   */

  if(player?.vel){
    player.vel.set(0,0,0);
  }

  if(state.joy){
    state.joy.active=false;
    state.joy.x=0;
    state.joy.y=0;
  }
}

/* =========================================================
CONVERSATION CHOICE
========================================================= */

function chooseNpcResponse(profile,choice){

  const reply=
    getConversationReply(
      profile,
      choice
    );

  const messages=
    $("socialMessages");

  if(!messages)return;

  if(reply.player){
    messages.innerHTML+=`
      <div class="chatBubble player">
        ${escapeHtml(reply.player)}
      </div>
    `;
  }

  messages.innerHTML+=`
    <div class="chatBubble npc">
      <b>${escapeHtml(profile.name)}</b>
      <div>${escapeHtml(reply.npc)}</div>
    </div>
  `;

  messages.scrollTop=
    messages.scrollHeight;

  /*
   * Leave conversation.
   */

  if(choice.id==="leave"){
    setTimeout(()=>{
      closeSocial();
    },350);

    return;
  }

  const newScore=
    changeRelationship(
      profile.id,
      choice.change
    );

  /*
   * Save contact once relationship
   * becomes meaningful.
   */

  if(newScore>=20){
    state.socialData.contacts[
      profile.id
    ]={
      name:profile.name,
      role:profile.role,
      relationship:newScore,
      updatedAt:Date.now()
    };

    saveSocialState();
  }

  /*
   * Unlock opportunities.
   */

  if(
    choice.id==="work"&&
    newScore>=15
  ){
    createSocialJob(profile);
  }

  if(
    choice.id==="business"&&
    newScore>=20
  ){
    createBusinessLead(profile);
  }

  if(
    choice.id==="connection"&&
    newScore>=30
  ){
    createSocialMission(profile);
  }

  renderNpcConversation(
    profile
  );
}

/* =========================================================
JOBS
========================================================= */

function createSocialJob(profile){

  const existing=
    state.socialData.jobs.find(
      job=>
        job.sourceNpc===profile.id&&
        job.status==="available"
    );

  if(existing)return;

  const jobs=[
    {
      title:"Business Assistant",
      description:
        "Help a local business with basic tasks.",
      reward:2000
    },
    {
      title:"Quick Delivery",
      description:
        "Handle a short delivery for a local contact.",
      reward:1500
    },
    {
      title:"Customer Support Shift",
      description:
        "Help a small business deal with customers.",
      reward:1800
    }
  ];

  const job=
    jobs[
      socialHash(
        profile.id+
        Date.now()
      )%jobs.length
    ];

  const record={
    id:
      `social_job_${Date.now()}`,
    sourceNpc:profile.id,
    title:job.title,
    description:job.description,
    reward:job.reward,
    status:"available",
    createdAt:Date.now()
  };

  state.socialData.jobs.push(
    record
  );

  saveSocialState();

  showSocialOpportunity(
    "JOB OPPORTUNITY",
    job.title,
    job.description,
    `₦${job.reward.toLocaleString()}`
  );
}

    },

      description:

  const mission=

        profile.id+
        getReputation()
      )%missions.length
    ];

  state.socialData.missions.push({
    id:
      `social_mission_${Date.now()}`,
    sourceNpc:profile.id,
    title:mission.title,
    description:mission.description,
    status:"available",
    progress:0,
    createdAt:Date.now()
  });

  saveSocialState();

  showSocialOpportunity(
    "NEW MISSION",
    mission.title,
    mission.description,
    "Build your reputation"
  );
}

/* =========================================================
BUSINESS LEADS
========================================================= */

function createBusinessLead(profile){

  const existing=
    state.socialData.businessLeads.find(
      lead=>
        lead.sourceNpc===profile.id&&
        lead.status==="available"
    );

  if(existing)return;

  const lead={
    id:
      `business_lead_${Date.now()}`,
    sourceNpc:profile.id,
    title:"Business Connection",
    description:
      `${profile.name} has become a useful business contact.`,
    status:"available",
    createdAt:Date.now()
  };

  state.socialData.businessLeads.push(
    lead
  );

  saveSocialState();

  showSocialOpportunity(
    "BUSINESS LEAD",
    lead.title,
    lead.description,
    "Potential business connection"
  );
}

/* =========================================================
OPPORTUNITY NOTIFICATION
========================================================= */

let socialOpportunityTimer=null;

function showSocialOpportunity(
  type,
  title,
  description,
  reward
){

  /*
   * Use existing toast when available.
   * This avoids creating another notification
   * system in B.
   */

  if(typeof toast==="function"){
    toast(
      `${type}: ${title}`
    );
  }

  /*
   * Also store a readable notification
   * in the existing chat system.
   */

  if(Array.isArray(state.socialMessages)){
    state.socialMessages.push({
      who:"Hustle System",
      text:
        `${type}: ${title}. ${description}`+
        (reward?` Reward: ${reward}`:""),
      time:Date.now()
    });

    saveLocalState();
  }

  /*
   * Keep the player's attention without
   * permanently covering the screen.
   */

  clearTimeout(
    socialOpportunityTimer
  );

  socialOpportunityTimer=
    setTimeout(()=>{
      if(
        $("socialPanel")?.classList.contains("open")&&
        document.querySelector(
          ".socialTab.active"
        )?.dataset.socialTab==="chat"
      ){
        renderHustleChat();
      }
    },250);
}

/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
SOCIAL UPDATE LOOP
========================================================= */

let socialUpdateTick=0;

function updateSocialSystem(){

  if(
    state.mode!=="play"||
    state.activeNpc
  ){
    return;
  }

  socialUpdateTick++;

  /*
   * We don't need to calculate every frame.
   */

  if(
    socialUpdateTick%5!==0
  ){
    return;
  }

  updateSocialNpcPrompt();
}

/* =========================================================
KEYBOARD TALK
========================================================= */

addEventListener(
  "keydown",
  e=>{

    if(
      e.repeat||
      state.mode!=="play"
    ){
      return;
    }

    const key=
      e.key.toLowerCase();

    if(key==="t"){

      if(state.activeNpc){
        return;
      }

      const target=
        getNearbySocialNpc();

      const location=
        getNearbySocialLocation();

      if(
        target&&
        location
      ){
        openNpcConversation(
          target
        );

        e.preventDefault();
      }
    }
  }
);

/* =========================================================
SOCIAL CLOSE SAFETY
========================================================= */

const originalCloseSocial=
  typeof closeSocial==="function"
    ?closeSocial
    :null;

function closeSocial(){

  state.activeNpc=null;

  if(
    originalCloseSocial
  ){
    originalCloseSocial();
  }else{
    $("socialPanel")?.classList.remove(
      "open"
    );
  }

  nearbySocialNpc=null;
  nearbySocialLocation=null;

  /*
   * Restore normal place prompt.
   */

  if(typeof updatePlaces==="function"){
    try{
      updatePlaces(
        0,
        performance.now()/1000
      );
    }catch{}
  }
}

/* =========================================================
EXPOSE SOCIAL API
========================================================= */

window.NaijaHustleSocial={

  getReputation,
  getRelationship,
  changeRelationship,

  getJobs(){
    return state.socialData.jobs;
  },

  getMissions(){
    return state.socialData.missions;
  },

  getBusinessLeads(){
    return state.socialData.businessLeads;
  },

  getContacts(){
    return state.socialData.contacts;
  },

  talk(){
    const target=
      getNearbySocialNpc();

    const location=
      getNearbySocialLocation();

    if(
      target&&
      location
    ){
      openNpcConversation(
        target
      );
    }
  }

};

console.log(
  "Naija Hustle C Social System loaded."
);
  
/* =========================================================
PERSISTENCE
========================================================= */

const db=createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const BG_NAMES={
  street_boy:"Street Boy",
  graduate:"Graduate",
  nepo_baby:"Nepo Baby",
  returnee:"Returnee"
};

const cap1=s=>
  s
    ?s.charAt(0).toUpperCase()+s.slice(1).replace(/_/g," ")
    :s;

function setPlayerInfo(){
  $("name").textContent=state.name;
  $("sub").textContent=state.sub;
  refreshTag();
}

async function loadPlayer(){
  loadLocalState();

  try{
    const l=localStorage.getItem("nh_avatar");

    if(l){
      state.cfg=sanitize(
        JSON.parse(l)
      );
    }
  }catch{}

  rebuildPlayer();
  refreshSelected();

  try{
    /*
     * If the supplied Supabase anon key has been restored,
     * the existing character RPC can load the player's account.
     */
    const {
      data:{session}
    }=await db.auth.getSession();

    if(!session){
      setPlayerInfo();
      return;
    }

    const {
      data,
      error
    }=await db.rpc("get_my_character");

    if(
      error||
      !data||
      !data.id
    ){
      setPlayerInfo();
      return;
    }

    state.user=data;
    state.name=data.name;
    state.sub=
      `${cap1(data.district)} · ${BG_NAMES[data.background]||""}`;

    setPlayerInfo();

    if(data.avatar){
      state.cfg=sanitize(data.avatar);

      localStorage.setItem(
        "nh_avatar",
        JSON.stringify(state.cfg)
      );

      rebuildPlayer();
      refreshSelected();
    }
  }catch{
    setPlayerInfo();
  }
}

async function saveAvatar(){
  localStorage.setItem(
    "nh_avatar",
    JSON.stringify(state.cfg)
  );

  if(!state.user){
    toast(
      "Saved on this device. Log in to save it to your account."
    );

    return;
  }

  const {error}=await db.rpc(
    "save_avatar",
    {
      p_avatar:state.cfg
    }
  );

  toast(
    error
      ?"Saved on this device only. Run the avatar SQL in Supabase to save online."
      :"Avatar saved to your account"
  );

  if(error){
    console.warn(error.message);
  }
}

/* =========================================================
RESIZE
========================================================= */

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    state.quality==="high"
      ?Math.min(devicePixelRatio,2)
      :1
  );
});

/* =========================================================
MAIN LOOP
========================================================= */

let last=performance.now();
let mmTick=0;

function frame(now){
  requestAnimationFrame(frame);

  const dt=Math.min(
    .05,
    (now-last)/1000
  );

  last=now;

  if(dt<=0)return;

  const t=now/1000;

  updateDayNight(dt);

  if(state.mode==="play"){
    updatePlayer(dt);
  }else{
    updateViewerPlayer(dt);
  }

  updateNPCs(dt);
  updateTraffic(dt);
  updatePlaces(dt,t);
updateSocialSystem();
updateCamera(dt);
  updateSun();

  $("status").textContent=state.status;

  if(
    (mmTick++&1)===0&&
    state.mode==="play"
  ){
    drawMinimap();
  }

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
START
========================================================= */

buildWorld();
buildTraffic();
buildNPCs();
buildCustomizer();
applyQuality();

loadPlayer().finally(()=>{
  requestAnimationFrame(frame);

  setTimeout(()=>{
    $("loading").classList.add("hidden");
  },450);
});

</script>
