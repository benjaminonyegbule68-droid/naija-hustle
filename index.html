<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14201F">

<title>Naija Hustle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#EEF1F0;
  --ink:#14201F;
  --lagoon:#0F6B6F;
  --danfo:#FFC20E;
  --brick:#C2410C;
  --card:#fff;
  --mute:#5C6B6A;
  --line:#D5DCDA;
  --good:#087443;
  --danger:#B42318;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Bricolage Grotesque",sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

input,
select{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  background:#fff;
  color:var(--ink);
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--lagoon);
  box-shadow:0 0 0 3px rgba(15,107,111,.1);
}

.wrap{
  width:min(100% - 24px,480px);
  margin:0 auto;
  padding-bottom:100px;
}

h1,
h2,
h3,
p{
  margin-top:0;
}

h1{
  font-size:2rem;
  line-height:1.05;
}

h2{
  font-size:1.25rem;
  line-height:1.15;
}

p{
  line-height:1.5;
}

.mute{
  color:var(--mute);
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.grid{
  display:grid;
  gap:12px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 5px 18px rgba(20,32,31,.04);
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  background:var(--lagoon);
  color:#fff;
  padding:13px 15px;
  font-weight:800;
  margin-top:10px;
}

.btn:hover{
  filter:brightness(.96);
}

.btn.alt{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}

.btn.gold{
  background:var(--danfo);
  color:var(--ink);
}

.link{
  border:0;
  background:none;
  color:var(--lagoon);
  font-weight:800;
  padding:10px 0;
}

.err,
.ok{
  border-radius:14px;
  padding:12px 14px;
  margin:10px 0;
  line-height:1.4;
}

.err{
  background:#FDECEC;
  color:var(--danger);
  border:1px solid #F4C7C4;
}

.ok{
  background:#EAF8F0;
  color:var(--good);
  border:1px solid #BEE6CE;
}

.stripe{
  height:7px;
  background:linear-gradient(
    90deg,
    var(--brick) 0 33%,
    #fff 33% 66%,
    var(--good) 66%
  );
}

.top{
  background:var(--ink);
  color:#fff;
  position:sticky;
  top:0;
  z-index:20;
}

.top .in{
  width:min(100% - 24px,480px);
  margin:auto;
  padding:13px 0;
}

.cash{
  color:var(--danfo);
  font-size:1.7rem;
  font-weight:800;
  margin:6px 0;
}

.pill{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  background:#E9F0EF;
  color:var(--ink);
  font-size:.78rem;
  font-weight:800;
}

.top .pill{
  background:rgba(255,255,255,.12);
  color:#fff;
}

.bar{
  height:9px;
  background:var(--line);
  border-radius:999px;
  overflow:hidden;
  margin-top:7px;
}

.bar i{
  display:block;
  height:100%;
  background:var(--lagoon);
  border-radius:inherit;
}

.nav{
  position:fixed;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
}

.nav button{
  border:0;
  background:none;
  color:var(--mute);
  font-size:.68rem;
  font-weight:800;
  padding:8px 2px;
}

.nav button[aria-current="page"]{
  color:var(--lagoon);
}

.auth{
  padding-top:45px;
}

.auth-logo{
  display:inline-flex;
  background:var(--ink);
  color:#fff;
  border-radius:14px;
  padding:8px 12px;
  font-weight:800;
  margin-bottom:12px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:18px 0 10px;
}

.counter{
  color:var(--mute);
  font-size:.8rem;
  font-weight:800;
}

.bg{
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  background:#fff;
  text-align:left;
  width:100%;
}

.bg.selected{
  border:2px solid var(--lagoon);
  background:#F1FAF9;
}

.bg h3{
  margin:0 0 5px;
}

.bg p{
  margin:0;
  color:var(--mute);
  font-size:.86rem;
}

.trait-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.trait{
  position:relative;
  border:1px solid var(--line);
  border-radius:17px;
  padding:13px;
  background:#fff;
  text-align:left;
}

.trait.selected{
  border:2px solid var(--lagoon);
  background:#F1FAF9;
}

.trait-number{
  position:absolute;
  right:9px;
  top:9px;
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--danfo);
  font-size:.7rem;
  font-weight:800;
}

.trait strong{
  display:block;
  padding-right:24px;
  margin-bottom:5px;
}

.trait small{
  color:var(--mute);
  line-height:1.35;
}

.look-preview{
  background:linear-gradient(
    145deg,
    #14201F,
    #0F6B6F
  );
  color:#fff;
  border-radius:22px;
  padding:18px;
  margin:12px 0;
  text-align:center;
}

.look-name{
  font-size:1.25rem;
  font-weight:800;
  margin-top:8px;
}

.look-meta{
  color:rgba(255,255,255,.72);
  font-size:.82rem;
  margin-top:4px;
}

.look-traits{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}

.look-traits .pill{
  background:rgba(255,255,255,.13);
  color:#fff;
}

.choice-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.choice{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:10px;
  font-weight:700;
}

.choice.selected{
  background:#E7F5F4;
  border:2px solid var(--lagoon);
  color:var(--lagoon);
}

.profile-hero{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px;
  margin:12px 0;
  border-radius:22px;
  background:var(--ink);
  color:#fff;
}

.profile-avatar{
  width:72px;
  height:72px;
  flex:0 0 72px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:#fff;
  overflow:hidden;
}

.profile-identity h1{
  margin:2px 0 4px;
  font-size:1.55rem;
}

.profile-identity p{
  margin:0;
  color:rgba(255,255,255,.7);
}

.eyebrow{
  color:var(--danfo);
  font-size:.68rem;
  font-weight:800;
  letter-spacing:.08em;
}

.profile-card-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:13px;
}

.profile-stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.profile-stat{
  background:#F5F7F6;
  border-radius:14px;
  padding:12px;
}

.profile-stat span{
  display:block;
  color:var(--mute);
  font-size:.75rem;
}

.profile-stat strong{
  display:block;
  margin-top:3px;
}

.profile-traits{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.profile-trait{
  background:#E7F5F4;
  color:var(--lagoon);
  padding:7px 10px;
  border-radius:999px;
  font-size:.8rem;
  font-weight:800;
}

.profile-details{
  display:grid;
  gap:9px;
}

.profile-detail{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
}

.profile-detail:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.profile-detail span{
  color:var(--mute);
}

.profile-detail strong{
  text-align:right;
}

.profile-skill{
  margin:13px 0;
}

.profile-skill-head{
  display:flex;
  justify-content:space-between;
  font-size:.9rem;
  margin-bottom:6px;
}

.profile-skill-bar{
  height:8px;
  border-radius:999px;
  background:var(--line);
  overflow:hidden;
}

.profile-skill-bar i{
  display:block;
  height:100%;
  background:var(--lagoon);
}

.profile-status{
  padding:12px;
  border-radius:14px;
  background:#F5F7F6;
}

.need-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.need{
  background:#F5F7F6;
  border-radius:15px;
  padding:11px;
}

.need-head{
  display:flex;
  justify-content:space-between;
  font-size:.8rem;
  margin-bottom:6px;
}

.need .bar{
  height:7px;
  margin:0;
}

.need.low .bar i{
  background:var(--brick);
}

.need.mid .bar i{
  background:var(--danfo);
}

.need.high .bar i{
  background:var(--good);
}

.activity-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.activity{
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  padding:12px;
  text-align:left;
}

.activity strong{
  display:block;
}

.activity small{
  color:var(--mute);
  display:block;
  margin:4px 0;
}

.activity button{
  width:100%;
  border:0;
  border-radius:11px;
  background:var(--lagoon);
  color:#fff;
  padding:9px;
  font-weight:800;
  margin-top:6px;
}

.clock{
  border-radius:18px;
  background:#fff;
  border:1px solid var(--line);
  padding:14px;
  margin:12px 0;
}

.clock-time{
  font-size:1.7rem;
  font-weight:800;
}

.clock-phase{
  color:var(--lagoon);
  font-weight:800;
}

.sk{
  margin:13px 0;
}

.lb{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.lb:last-child{
  border-bottom:0;
}

.lock{
  background:#FFF5D7;
  color:#785500;
  padding:10px;
  border-radius:12px;
  font-size:.84rem;
  margin-top:9px;
}

.bonus{
  display:inline-block;
  background:#E7F5F4;
  color:var(--lagoon);
  border-radius:999px;
  padding:6px 9px;
  font-size:.75rem;
  font-weight:800;
  margin:6px 0;
}

.big{
  font-size:2rem;
  font-weight:800;
  margin:6px 0 12px;
}

.map-card{
  padding:8px;
  overflow:hidden;
}

.map-svg{
  display:block;
  width:100%;
}

.map-pin{
  cursor:pointer;
}

.district-card.here{
  border-color:var(--lagoon);
  background:#F2FAF9;
}

/* =========================================================
AVATAR
========================================================= */

.avatar-stage{
  background:
    radial-gradient(
      circle at 50% 35%,
      #FFFFFF 0%,
      #E6ECEB 58%,
      #CCD7D5 100%
    );
  border:1px solid var(--line);
  border-radius:24px;
  min-height:310px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

.avatar-stage:after{
  content:"";
  position:absolute;
  bottom:15px;
  width:145px;
  height:24px;
  background:rgba(20,32,31,.12);
  border-radius:50%;
  filter:blur(8px);
}

.avatar-stage svg{
  width:245px;
  height:275px;
  position:relative;
  z-index:2;
  filter:drop-shadow(0 12px 12px rgba(20,32,31,.12));
}

.avatar-mini svg{
  width:60px;
  height:72px;
}

.avatar-large svg{
  width:110px;
  height:125px;
}

.avatar-controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.avatar-control{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:9px 4px;
  font-size:.72rem;
  font-weight:800;
}

.avatar-control.active{
  background:var(--ink);
  color:#fff;
}

.avatar-spin{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:9px;
}

.avatar-spin button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 14px;
  font-weight:800;
}

.avatar-spin button:hover{
  background:#F5F7F6;
}

.avatar-note{
  text-align:center;
  color:var(--mute);
  font-size:.75rem;
  margin:8px 0 0;
}

.loading{
  text-align:center;
  padding:35px 10px;
  color:var(--mute);
}

@media(max-width:380px){

  .wrap{
    width:min(100% - 18px,480px);
  }

  .nav button{
    font-size:.6rem;
  }

  .trait-grid{
    grid-template-columns:1fr;
  }

  .avatar-controls{
    grid-template-columns:repeat(3,1fr);
  }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
SUPABASE
========================================================= */

const app =
  document.getElementById("app");

const SUPABASE_URL =
  "https://pbqtbwiymlwksdtfsfcb.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_-SK-LvMzEwv-oqn8A5hZOQ_rwyzGxUj";

if (
  !window.supabase ||
  !window.supabase.createClient
) {

  app.innerHTML = `
    <div class="wrap">
      <div class="stripe"></div>

      <div class="card">
        <h1>Naija Hustle</h1>

        <div class="err">
          Supabase could not be loaded.
          Check your internet connection and refresh.
        </div>
      </div>
    </div>
  `;

  throw new Error(
    "Supabase JS unavailable"
  );

}

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
STATE
========================================================= */

const S = {

  user:null,

  ch:null,

  tab:"home",

  mode:"login",

  msg:null,

  busy:false,

  picked:null,

  nameDraft:"",

  personalityTraits:null,

  personality1:null,

  personality2:null,

  skinTone:"medium",

  hairstyle:"short",

  hairColor:"black",

  outfit:"casual",

  accessory:"none",

  jobs:null,

  jobMsg:null,

  activityMsg:null,

  bizTypes:null,

  biz:null,

  bizLoaded:false,

  bizMsg:null,

  districts:null,

  mapMsg:null,

  avatarRotation:0

};


/* =========================================================
GAME DATA
========================================================= */

const BG = [

  {
    id:"street_boy",
    name:"Street Boy",
    meta:"Starts in Mushin · ₦5,000",
    d:"No capital, no connections, plenty of hustle. Your only collateral is gist."
  },

  {
    id:"graduate",
    name:"Graduate",
    meta:"Starts in Yaba · ₦20,000",
    d:"First class degree, zero job offers. The CV is strong, the NYSC is done."
  },

  {
    id:"nepo_baby",
    name:"Nepo Baby",
    meta:"Starts in Lekki · ₦500,000",
    d:"Daddy's name opens doors. Now prove the doors were worth opening."
  },

  {
    id:"returnee",
    name:"Returnee",
    meta:"Starts in Ikeja · ₦150,000",
    d:"Came back from abroad with savings and a strong accent. Lagos will humble you."
  }

];

const SK = {

  hustle:"Hustle",

  edu:"Education",

  charm:"Charm",

  tech:"Tech"

};


const SKIN_TONES = [

  ["light","Light"],

  ["medium","Medium"],

  ["deep","Deep"]

];

const HAIRSTYLES = [

  ["short","Short"],

  ["low_cut","Low Cut"],

  ["fade","Fade"],

  ["afro","Afro"],

  ["braids","Braids"],

  ["dreads","Dreads"],

  ["natural","Natural"],

  ["long","Long"]

];

const HAIR_COLORS = [

  ["black","Black"],

  ["brown","Brown"],

  ["blonde","Blonde"],

  ["red","Red"]

];

const OUTFITS = [

  ["casual","Casual"],

  ["streetwear","Streetwear"],

  ["formal","Formal"],

  ["traditional","Traditional"],

  ["sport","Sport"],

  ["business","Business"]

];

const ACCESSORIES = [

  ["none","None"],

  ["cap","Cap"],

  ["glasses","Glasses"],

  ["chain","Chain"],

  ["watch","Watch"],

  ["earrings","Earrings"],

  ["headphones","Headphones"]

];


/* =========================================================
HELPERS
========================================================= */

const esc =
  value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        char =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
          }[char])
      );

const naira =
  value =>
    "₦" +
    Number(value || 0)
      .toLocaleString("en-NG");

const cap =
  value => {

    const str =
      String(value || "");

    return str
      ? str.charAt(0).toUpperCase() +
        str.slice(1)
      : "";

  };

const bgName =
  id => {

    const bg =
      BG.find(
        item =>
          item.id === id
      );

    return bg
      ? bg.name
      : id;

  };

const setMsg =
  (
    text,
    ok=false
  ) => {

    S.msg =
      text
        ? {
            t:text,
            ok
          }
        : null;

  };

const msgHtml =
  () => {

    if (!S.msg) {
      return "";
    }

    return `
      <div
        class="${S.msg.ok ? "ok" : "err"}"
        role="alert"
      >
        ${esc(S.msg.t)}
      </div>
    `;

  };

function optionLabel(
  list,
  value
){

  const found =
    list.find(
      item =>
        item[0] === value
    );

  return found
    ? found[1]
    : cap(value);

}


/* =========================================================
AVATAR ENGINE
========================================================= */

const AVATAR_SKIN = {

  light:"#F1C7A8",

  medium:"#C98F6B",

  deep:"#8D573D",

  dark:"#6B3F2D"

};

const AVATAR_HAIR = {

  black:"#171717",

  brown:"#4A2A1B",

  blonde:"#C99A3E",

  red:"#7B2D26"

};

function avatarSkin(value){

  return (
    AVATAR_SKIN[value] ||
    AVATAR_SKIN.medium
  );

}

function avatarHair(value){

  return (
    AVATAR_HAIR[value] ||
    AVATAR_HAIR.black
  );

}

function avatarSvg(
  c,
  size=220
){

  const skin =
    avatarSkin(
      c?.skin_tone
    );

  const hair =
    avatarHair(
      c?.hair_color
    );

  const hairstyle =
    c?.hairstyle ||
    "short";

  const outfit =
    c?.outfit ||
    "casual";

  const accessory =
    c?.accessory ||
    "none";

  let clothes = `

    <path
      d="
        M58 210
        C62 178 78 164 110 160
        C142 164 158 178 162 210
        Z
      "
      fill="#0F6B6F"
    />

  `;

  if(
    outfit === "streetwear"
  ){

    clothes = `

      <path
        d="
          M50 210
          C54 175 76 158 110 158
          C144 158 166 175 170 210
          Z
        "
        fill="#14201F"
      />

      <path
        d="
          M76 170
          L110 205
          L144 170
        "
        fill="none"
        stroke="#FFC20E"
        stroke-width="7"
      />

    `;

  }

  if(
    outfit === "formal"

/* =========================================================
REAL NIGERIAN CLOCK
========================================================= */

function realTimeInfo(){

  const now =
    new Date();

  const time =
    new Intl.DateTimeFormat(
      "en-NG",
      {
        timeZone:"Africa/Lagos",
        hour:"numeric",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      }
    ).format(now);

  const hour =
    Number(
      new Intl.DateTimeFormat(
        "en-NG",
        {
          timeZone:"Africa/Lagos",
          hour:"numeric",
          hourCycle:"h23"
        }
      ).format(now)
    );

  let phase =
    "Night";

  let icon =
    "🌙";

  if(
    hour >= 5 &&
    hour < 12
  ){

    phase =
      "Morning";

    icon =
      "🌅";

  }else if(
    hour >= 12 &&
    hour < 17
  ){

    phase =
      "Afternoon";

    icon =
      "☀️";

  }else if(
    hour >= 17 &&
    hour < 21
  ){

    phase =
      "Evening";

    icon =
      "🌆";

  }

  const date =
    new Intl.DateTimeFormat(
      "en-NG",
      {
        timeZone:"Africa/Lagos",
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    ).format(now);

  return {
    time,
    phase,
    icon,
    date
  };

}

function gameClockHtml(){

  const info =
    realTimeInfo();

  return `

    <div class="clock">

      <div class="row">

        <div>

          <div class="clock-time">
            ${info.time}
          </div>

          <div class="clock-phase">
            ${info.icon}
            ${info.phase}
          </div>

        </div>

        <div class="mute">
          Lagos time
        </div>

      </div>

      <div
        class="mute"
        style="margin-top:6px;font-size:.78rem"
      >
        ${esc(info.date)}
      </div>

    </div>

  `;

}

function startGameClock(){

  if(
    window.naijaClockTimer
  ){

    clearInterval(
      window.naijaClockTimer
    );

  }

  window.naijaClockTimer =
    setInterval(
      () => {

        const clock =
          document.querySelector(
            ".clock"
          );

        if(
          clock &&
          S.ch
        ){

          clock.outerHTML =
            gameClockHtml();

        }

      },
      1000
    );

}


/* =========================================================
NEEDS
========================================================= */

function needPct(value){

  return Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );

}

function needClass(value){

  const n =
    needPct(value);

  if(n <= 30){
    return "low";
  }

  if(n <= 60){
    return "mid";
  }

  return "high";

}

          `
          : `

            <h1>
              Create your account.
            </h1>

            <p class="mute">
              Your account is only the beginning.
              Next, you'll build your hustler.
            </p>

            ${msgHtml()}

            <form id="authForm">

              <div class="card">

                <label>
                  Email
                </label>

                <input
                  id="email"
                  type="email"
                  autocomplete="email"
                  required
                  placeholder="you@example.com"
                >

                <label
                  style="
                    display:block;
                    margin-top:12px;
                  "
                >
                  Password
                </label>

                <input
                  id="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="6"
                  required
                  placeholder="At least 6 characters"
                >

                <button
                  class="btn"
                  type="submit"
                >
                  Create account
                </button>

              </div>

            </form>

            <p class="mute">
              Already registered?

              <button
                class="link"
                id="switchLogin"
                type="button"
              >
                Log in
              </button>

            </p>

          `
      }

    </main>

  `;

  const form =
    document.getElementById(
      "authForm"
    );

  if(form){

    form.onsubmit =
      async event => {

        event.preventDefault();

        if(S.busy){
          return;
        }

        S.busy = true;

        const email =
          document
            .getElementById(
              "email"
            )
            .value
            .trim();

        const password =
          document
            .getElementById(
              "password"
            )
            .value;

        try{

          let result;

          if(
            S.mode === "login"
          ){

            result =
              await db.auth.signInWithPassword({
                email,
                password
              });

          }else{

            result =
              await db.auth.signUp({
                email,
                password
              });

          }

          S.busy = false;

          if(
            result.error
          ){

            setMsg(
              result.error.message
            );

            return viewAuth();

          }

          if(
            S.mode === "signup" &&
            !result.data?.session
          ){

            setMsg(
              "Account created. If email confirmation is enabled, confirm your email before logging in.",
              true
            );

            return viewAuth();

          }

          S.user =
            result.data?.user ||
            result.data?.session?.user ||
            null;

          setMsg(null);

          await load();

        }catch(error){

          S.busy = false;

          setMsg(
            error?.message ||
            "Authentication failed."
          );

          viewAuth();

        }

      };

  }

  const signup =
    document.getElementById(
      "switchSignup"
    );

  if(signup){

    signup.onclick =
      () => {

        S.mode =
          "signup";

        S.msg =
          null;

        viewAuth();

      };

  }

  const login =
    document.getElementById(
      "switchLogin"
    );

  if(login){

    login.onclick =
      () => {

        S.mode =
          "login";

        S.msg =
          null;

        viewAuth();

      };

  }

}

async function loadPersonalityTraits(){

  const {
    data,
    error
  } =
    await db
      .from(
        "personality_traits"
      )
      .select(
        "id,name,description,skill_bonus,skill_bonus_amount,effect_key,effect_amount"
      )
      .order("name");

  if(error){

    throw error;

  }

  S.personalityTraits =
    data || [];

  return S.personalityTraits;

}

/* =========================================================
CREATE CHARACTER
========================================================= */

async function createCharacter(){

  if(S.busy){
    return;
  }

  const input =
    document.getElementById(
      "characterName"
    );

  const name =
    (
      input
        ? input.value
        : S.nameDraft
    ).trim();

  S.nameDraft =
    name;

  if(
    name.length < 3 ||
    name.length > 20
  ){

    setMsg(
      "Character name must be between 3 and 20 characters."
    );

    return viewCreate();

  }

  if(!S.picked){

    setMsg(
      "Choose a background first."
    );

    return viewCreate();

  }

  if(
    !S.personality1 ||
    !S.personality2 ||
    S.personality1 ===
    S.personality2
  ){

    setMsg(
      "Choose exactly two different personality traits."
    );

    return viewCreate();

  }

  S.busy = true;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "create_character",
        {
          p_name:name,

          p_background:
            S.picked,

          p_trait_1:
            S.personality1,

          p_trait_2:
            S.personality2,

          p_skin_tone:
            S.skinTone,

          p_hairstyle:
            S.hairstyle,

          p_hair_color:
            S.hairColor,

          p_outfit:
            S.outfit,

          p_accessory:
            S.accessory
        }
      );

    S.busy = false;

    if(error){

      setMsg(
        error.message
      );

      return viewCreate();

    }

    if(data?.id){

      S.ch =
        data;

    }

    await load();

  }catch(error){

    S.busy = false;

    setMsg(
      error?.message ||
      "Character creation failed."
    );

    viewCreate();

  }

}

async function go(tab){

  S.tab =
    tab;

  S.jobMsg =
    null;

  S.activityMsg =
    null;

  S.bizMsg =
    null;

  S.mapMsg =
    null;

  if(
    tab === "business"
  ){

    S.bizLoaded =
      false;

  }

  viewGame();

  if(
    tab === "business"
  ){

    return;

  }

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );

    if(error){
      throw error;
    }

    if(
      data &&
      data.id &&
      S.tab === tab
    ){

      S.ch =
        data;

      viewGame();

    }

  }catch(error){

    console.error(
      "Navigation refresh failed:",
      error
    );

  }

}


/* =========================================================
MAIN GAME VIEW
========================================================= */

function viewGame(){

  if(!S.ch){

    if(S.user){

      return viewCreate();

    }

    return viewAuth();

  }

  if(
    window.naijaClockTimer
  ){

    clearInterval(
      window.naijaClockTimer
    );

  }

  const c =
    S.ch;

  const maxEnergy =
    Number(
      c.max_energy
    ) || 1;

  const energy =
    Number(
      c.energy
    ) || 0;

  const pct =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(
          (
            energy /
            maxEnergy
          ) * 100
        )
      )
    );

  const xpPct =
    Number(c.xp || 0) %
    100;

  const tabs = [

    ["home","Home"],

    ["jobs","Jobs"],

    ["business","Business"],

    ["map","Map"],

    ["board","Ranks"],

    ["profile","Profile"]

  ];

  app.innerHTML = `

    <div class="top">

      <div class="in">

        <div class="row">

          <b>
            ${esc(c.name)}
          </b>

          <span class="pill">

            Lvl
            ${Number(c.level) || 1}

            ·

            ${xpPct}/100 XP

          </span>

        </div>

        <div class="cash">
          ${naira(c.cash)}
        </div>

        <div
          class="row"
          style="font-size:.9rem"
        >

          <span>
            Energy
            ${energy}/${maxEnergy}
          </span>

          <span>
            Rep
            ${Number(c.reputation) || 0}
          </span>

        </div>

        <div class="bar">

          <i
            style="
              width:${pct}%
            "
          ></i>

        </div>

      </div>

      <div class="stripe"></div>

    </div>


    <div
      class="wrap"
      id="main"
    ></div>


    <nav class="nav">

      ${
        tabs
          .map(
            ([key,label]) => `

              <button
                type="button"
                data-t="${key}"
                ${
                  S.tab === key
                    ? 'aria-current="page"'
                    : ""
                }
              >
                ${label}
              </button>

            `
          )
          .join("")
      }

    </nav>

  `;


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            go(
              button.dataset.t
            );

      }
    );


  const main =
    document.getElementById(
      "main"
    );


  if(
    S.tab === "home"
  ){

    main.innerHTML =
      homeHtml(c);

    main
      .querySelectorAll(
        "[data-activity]"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              doActivity(
                button.dataset.activity
              );

        }
      );

  }else if(
    S.tab === "jobs"
  ){

    jobsView(main);

  }else if(
    S.tab === "business"
  ){

    bizView(main);

  }else if(
    S.tab === "map"
  ){

    mapView(main);

  }else if(
    S.tab === "board"
  ){

    boardView(main);

  }else if(
    S.tab === "profile"
  ){

    main.innerHTML =
      profileHtml(c);

  }

  startGameClock();

}

function jobCard(
  job,
  character
){

  const needs = [];

  if(
    Number(character.level) <
    Number(job.min_level)
  ){

    needs.push(
      "level " +
      job.min_level
    );

  }

  if(
    job.req_skill &&
    Number(
      character[
        "skill_" +
        job.req_skill
      ]
    ) <
    Number(
      job.req_skill_level
    )
  ){

    needs.push(

      SK[job.req_skill] +
      " " +
      job.req_skill_level

    );

  }

  return `

    <div class="card">

      <div class="row">

        <h2>
          ${esc(job.title)}
        </h2>

        <span class="pill">
          ${job.energy_cost} energy
        </span>

      </div>

      <p class="mute">
        ${esc(job.description)}
      </p>

      <div
        class="row"
        style="font-size:.95rem"
      >

        <span>

          ${naira(job.pay_min)}
          to
          ${naira(job.pay_max)}

        </span>

        <span>
          +${job.xp} XP
        </span>

      </div>

      ${
        needs.length
          ? `

            <div class="lock">

              Locked: needs
              ${esc(
                needs.join(
                  " and "
                )
              )}

            </div>

          `
          : `

            <button
              class="btn"
              type="button"
              data-job="${esc(job.id)}"
            >
              Work this job
            </button>

          `
      }

    </div>

  `;

}

async function doJob(id){

  if(S.busy){
    return;
  }

  S.busy =
    true;

  const before =
    S.ch;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "do_job",
        {
          p_job_id:id
        }
      );

    S.busy =
      false;

    if(error){

      S.jobMsg = {

        t:error.message,

        ok:false

      };

      return viewGame();

    }

    const job =
      S.jobs.find(
        item =>
          item.id === id
      );

    S.ch =
      data;

    let message =
      job
        ? `${job.title} completed.`
        : "Job completed.";

    const diff =
      Number(data.cash) -
      Number(before.cash);

    message +=
      ` Cash ${
        diff >= 0
          ? "+"
          : "-"
      }${naira(
        Math.abs(diff)
      )}.`;

    if(
      Number(data.level) >
      Number(before.level)
    ){

      message +=
        ` Level up! You're now level ${data.level}.`;

    }

    if(
      data.last_event
    ){

      message +=
        " " +
        data.last_event;

    }

    S.jobMsg = {

      t:message,

      ok:true

    };

    viewGame();

  }catch(error){

    S.busy =
      false;

    S.jobMsg = {

      t:
        error?.message ||
        "The job could not be completed.",

      ok:false

    };

    viewGame();

  }

}

async function bizAct(
  functionName,
  args,
  successText
){

  if(S.busy){
    return;
  }

  S.busy =
    true;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        functionName,
        args
      );

    S.busy =
      false;

    if(error){

      S.bizMsg = {

        t:error.message,

        ok:false

      };

      return viewGame();

    }

    if(
      data?.character
    ){

      S.ch =
        data.character;

    }

    if(
      Object.prototype
        .hasOwnProperty
        .call(
          data || {},
          "business"
        )
    ){

      S.biz =
        data.business;

    }

    S.bizLoaded =
      true;

    S.bizMsg = {

      t:
        successText(data),

      ok:true

    };

    viewGame();

  }catch(error){

    S.busy =
      false;

    S.bizMsg = {

      t:
        error?.message ||
        "Business action failed.",

      ok:false

    };

    viewGame();

  }

}

function mapSvg(

    victoria_island:[195,175],

    lekki:[278,188]

  };

    ikeja:"Ikeja",

    mushin:"Mushin",

    yaba:"Yaba",

    victoria_island:"VI",

    lekki:"Lekki"

  };

  const links = [

    ["ikeja","mushin"],

    ["mushin","yaba"],

    ["yaba","victoria_island"],

    ["victoria_island","lekki"]

  ];

  const lines =
    links
      .map(
        ([from,to]) => `

          <line

            x1="${positions[from][0]}"
            y1="${positions[from][1]}"

            x2="${positions[to][0]}"
            y2="${positions[to][1]}"

async function travel(id){

  if(S.busy){
    return;
  }

  const district =
    S.districts.find(
      item =>
        item.id === id
    );

  if(!district){
    return;
  }

  S.busy =
    true;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "travel",
        {
          p_district:id
        }
      );

    S.busy =
      false;

    if(error){

      S.mapMsg = {

        t:error.message,

        ok:false

      };

      return viewGame();

    }

    S.ch =
      data;

    S.mapMsg = {

      t:
        `You reached ${district.name}.`,

      ok:true

    };

    viewGame();

  }catch(error){

    S.busy =
      false;

    S.mapMsg = {

      t:
        error?.message ||
        "Travel failed.",

      ok:false

    };

    viewGame();

  }

}

/* =========================================================
AVATAR NAVIGATION
========================================================= */

function openAvatarStage(){

  S.tab =
    "avatar";

  if(
    window.naijaClockTimer
  ){

    clearInterval(
      window.naijaClockTimer
    );

  }

  const main =
    document.getElementById(
      "main"
    );

  if(!main){
    return;
  }

  main.innerHTML =
    avatarStageHtml(
      S.ch
    );

  main
    .querySelectorAll(
      "[data-avatar-rotate]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            S.avatarRotation +=
              Number(
                button.dataset.avatarRotate
              );

            const stage =
              main.querySelector(
                ".avatar-stage"
              );

            if(stage){

              const svg =
                stage.querySelector(
                  "svg"
                );

              if(svg){

                const amount =
                  S.avatarRotation *
                  8;

                svg.style.transform =
                  `perspective(500px) rotateY(${amount}deg)`;

              }

            }

          };

      }
    );

}

document.addEventListener(

/* =========================================================
LOAD
========================================================= */

async function load(){

  if(!S.user){

    S.ch =
      null;

    return viewAuth();

  }

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );

    if(error){

      console.error(
        "get_my_character failed:",
        error
      );

      setMsg(
        error.message
      );

      return viewCreate();

    }

    S.ch =
      data?.id
        ? data
        : null;

    if(S.ch){

      try{

        await loadPersonalityTraits();

      }catch(
        personalityError
      ){

        console.error(
          "Personality traits failed to load:",
          personalityError
        );

      }

      viewGame();

    }else{

      viewCreate();

    }

  }catch(error){

    console.error(
      "Load failed:",
      error
    );

    if(S.user){

      setMsg(
        error?.message ||
        "Could not load your character."
      );

      return viewCreate();

    }

    setMsg(
      error?.message ||
      "Could not load the game."
    );

    viewAuth();

  }

}


/* =========================================================
AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    S.user =
      session
        ? session.user
        : null;

    if(
      event ===
      "INITIAL_SESSION"
    ){

      return;

    }

    setTimeout(
      () => load(),
      0
    );

  }
);


/* =========================================================
STARTUP
========================================================= */

(async function init(){

  try{

    const {
      data,
      error
    } =
      await db.auth.getSession();

    if(error){
      throw error;
    }

    S.user =
      data?.session
        ? data.session.user
        : null;

    await load();

  }catch(error){

    console.error(
      "Naija Hustle startup error:",
      error
    );

    app.innerHTML = `

      <div class="stripe"></div>

      <div class="wrap">

        <h1>
          Naija Hustle
        </h1>

        <div class="err">

          <b>
            Something went wrong while starting the game.
          </b>

          <br><br>

          ${esc(
            error?.message ||
            "Unknown startup error."
          )}

        </div>

      </div>

    `;

  }

})();

</script>
