<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0F6B6F">

  <title>Naija Hustle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #EEF1F0;
      --ink: #14201F;
      --lagoon: #0F6B6F;
      --danfo: #FFC20E;
      --brick: #C2410C;
      --card: #fff;
      --mute: #5C6B6A;
      --line: #D5DCDA;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      line-height: 1.45;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .stripe {
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        var(--danfo) 0 28px,
        #14201F 28px 36px
      );
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 96px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.05;
      margin: 24px 0 8px;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 1.3rem;
      font-weight: 800;
      margin: 0 0 4px;
    }

    p {
      margin: 0 0 12px;
    }

    .mute {
      color: var(--mute);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 12px 0 4px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--danfo);
      outline-offset: 2px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--lagoon);
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      margin-top: 16px;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn.alt {
      background: #fff;
      color: var(--lagoon);
      border: 2px solid var(--lagoon);
      margin-top: 0;
      padding: 10px 4px;
      font-size: .95rem;
    }

    .btn.alt small {
      display: block;
      font-weight: 600;
      color: var(--mute);
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .link {
      background: none;
      border: 0;
      color: var(--lagoon);
      font-weight: 600;
      text-decoration: underline;
      padding: 8px 0;
      cursor: pointer;
    }

    .err {
      background: #FDE8E0;
      color: #7A2A08;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 12px;
    }

    .ok {
      background: #E2F3E7;
      color: #1C5B2E;
      border-radius: 10px;
      padding: 10px 12px;
      margin: 0 0 12px;
    }

    /* BACKGROUND CARDS */

    .bg {
      display: block;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      color: var(--ink);
    }

    .bg[aria-pressed="true"] {
      border-color: var(--lagoon);
      box-shadow: inset 6px 0 0 var(--danfo);
    }

    .bg b {
      font-size: 1.1rem;
    }

    .bg .meta {
      color: var(--lagoon);
      font-weight: 600;
      font-size: .9rem;
      margin: 2px 0 4px;
    }

    /* PERSONALITY */

    .section-head {
      margin: 22px 0 8px;
    }

    .section-head h2 {
      margin-bottom: 3px;
    }

    .counter {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 800;
      margin-top: 5px;
    }

    .trait-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 10px;
    }

    .trait {
      min-height: 125px;
      text-align: left;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 13px;
      padding: 12px;
      color: var(--ink);
      cursor: pointer;
    }

    .trait[aria-pressed="true"] {
      border-color: var(--lagoon);
      box-shadow: inset 0 -5px 0 var(--danfo);
      background: #F4FAF9;
    }

    .trait b {
      display: block;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .trait small {
      display: block;
      color: var(--mute);
      line-height: 1.35;
    }

    .trait-number {
      float: right;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--line);
      font-size: .72rem;
      font-weight: 800;
    }

    .trait[aria-pressed="true"] .trait-number {
      background: var(--danfo);
    }

    /* CHARACTER DESIGN */

    .look-preview {
      background:
        linear-gradient(
          135deg,
          #14201F,
          #0F6B6F
        );
      color: #fff;
      border-radius: 16px;
      padding: 18px;
      margin: 10px 0 16px;
      position: relative;
      overflow: hidden;
    }

    .look-preview::after {
      content: "NAIJA HUSTLE";
      position: absolute;
      right: -4px;
      bottom: -7px;
      font-size: 2rem;
      font-weight: 800;
      opacity: .08;
    }

    .avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: var(--danfo);
      display: grid;
      place-items: center;
      font-size: 2.7rem;
      margin-bottom: 10px;
      border: 4px solid rgba(255,255,255,.8);
    }

    .look-name {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .look-meta {
      color: rgba(255,255,255,.78);
      font-size: .85rem;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .choice {
      border: 2px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 11px 9px;
      cursor: pointer;
      text-align: left;
    }

    .choice.selected {
      border-color: var(--lagoon);
      background: #EAF7F6;
    }

    .choice b {
      display: block;
      font-size: .9rem;
    }

    .choice small {
      color: var(--mute);
    }

    /* PROFILE */

.profile-hero {
  background:
    linear-gradient(
      135deg,
      var(--ink),
      var(--lagoon)
    );
  color: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
}

.profile-hero::after {
  content: "NAIJA HUSTLE";
  position: absolute;
  right: -8px;
  bottom: -8px;
  font-size: 2rem;
  font-weight: 800;
  opacity: .06;
}

.profile-avatar {
  width: 72px;
  height: 72px;
  min-width: 72px;
  border-radius: 50%;
  background: var(--danfo);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: 2rem;
  font-weight: 800;
  border: 4px solid rgba(255,255,255,.8);
}

.profile-identity {
  min-width: 0;
}

.profile-identity .eyebrow {
  font-size: .7rem;
  font-weight: 800;
  letter-spacing: .08em;
  color: rgba(255,255,255,.7);
  margin-bottom: 2px;
}

.profile-identity h1 {
  color: #fff;
  font-size: 1.7rem;
  margin: 0 0 3px;
  overflow-wrap: anywhere;
}

.profile-identity p {
  color: rgba(255,255,255,.78);
  margin: 0;
  font-size: .9rem;
}

.profile-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}

.profile-card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 13px;
}

.profile-card-title span {
  font-size: 1.15rem;
}

.profile-card-title strong {
  font-size: 1.05rem;
}

.profile-stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.profile-stat {
  background: #F7F9F8;
  border-radius: 11px;
  padding: 12px;
}

.profile-stat span {
  display: block;
  color: var(--mute);
  font-size: .8rem;
  margin-bottom: 3px;
}

.profile-stat strong {
  display: block;
  color: var(--lagoon);
  font-size: 1.2rem;
}

.profile-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.profile-detail {
  background: #F7F9F8;
  border-radius: 10px;
  padding: 10px;
}

.profile-detail span {
  display: block;
  color: var(--mute);
  font-size: .78rem;
  margin-bottom: 2px;
}

.profile-detail strong {
  display: block;
  font-size: .95rem;
  overflow-wrap: anywhere;
}

.profile-traits {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.profile-trait {
  background: #E8F5F5;
  color: var(--lagoon);
  border: 1px solid #C5E3E2;
  border-radius: 20px;
  padding: 7px 11px;
  font-weight: 800;
  font-size: .85rem;
}

.profile-skill {
  margin: 12px 0;
}

.profile-skill:first-child {
  margin-top: 0;
}

.profile-skill:last-child {
  margin-bottom: 0;
}

.profile-skill-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
}

.profile-skill-head span {
  font-weight: 700;
}

.profile-skill-head strong {
  color: var(--lagoon);
}

.profile-skill-bar {
  height: 9px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.profile-skill-bar i {
  display: block;
  height: 100%;
  background: var(--lagoon);
  border-radius: 8px;
}

.profile-status {
  background: #F7F4EC;
  border-radius: 11px;
  padding: 12px;
  color: var(--mute);
}

.profile-status strong {
  color: var(--ink);
    }

    /* GAME */

    .top {
      background: var(--lagoon);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .top .in {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 16px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .cash {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--danfo);
    }

    .bar {
      height: 10px;
      background: rgba(255,255,255,.25);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--danfo);
    }

    .sk {
      margin: 10px 0;
    }

    .sk .bar {
      background: var(--line);
      margin-top: 4px;
    }

    .sk .bar i {
      background: var(--lagoon);
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 20;
    }

    .nav button {
      flex: 1;
      padding: 14px 4px;
      border: 0;
      background: none;
      font-weight: 600;
      color: var(--mute);
      cursor: pointer;
      border-top: 4px solid transparent;
    }

    .nav button[aria-current="page"] {
      color: var(--lagoon);
      border-top-color: var(--danfo);
    }

    .lb {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      gap: 10px;
    }

    .lb:last-child {
      border: 0;
    }

    .pill {
      display: inline-block;
      background: var(--danfo);
      color: #14201F;
      font-weight: 800;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: .85rem;
      white-space: nowrap;
    }

    .lock {
      color: var(--brick);
      font-weight: 600;
      margin-top: 10px;
    }

    .big {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--lagoon);
    }

    .map-card {
      padding: 10px !important;
      overflow: hidden;
    }

    .map-svg {
      width: 100%;
      display: block;
      border-radius: 10px;
    }

    .map-pin {
      cursor: pointer;
    }

    .district-card.here {
      border-color: var(--danfo);
      box-shadow: 0 0 0 3px rgba(255,194,14,.25);
    }

    .bonus {
      display: inline-block;
      background: #E8F5F5;
      color: var(--lagoon);
      font-weight: 700;
      font-size: .85rem;
      padding: 3px 9px;
      border-radius: 20px;
      margin-top: 6px;
    }

    /* NEEDS */

    .needs-card {
      position: relative;
    }

    .need-row {
      margin: 14px 0;
    }

    .need-row:last-child {
      margin-bottom: 2px;
    }

    .need-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .need-name {
      font-weight: 700;
    }

    .need-value {
      font-weight: 800;
    }

    .need-bar {
      height: 10px;
      background: var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .need-bar i {
      display: block;
      height: 100%;
      border-radius: 8px;
    }

    .need-good {
      background: var(--lagoon);
    }

    .need-mid {
      background: var(--danfo);
    }

    .need-low {
      background: var(--brick);
    }

    .needs-note {
      background: #F7F4EC;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--mute);
      font-size: .9rem;
      margin-top: 12px;
    }

    /* CLOCK */

    .clock-card {
      background: var(--ink);
      color: #fff;
      border: 0;
    }

    .clock-day {
      color: var(--danfo);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .clock-time {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 2px;
    }

    .clock-phase {
      color: rgba(255,255,255,.75);
      font-size: .85rem;
    }

    /* ACTIVITIES */

    .activity-card {
      margin: 10px 0 0;
      background: #F7F9F8;
    }

    .activity-icon {
      font-size: 1.35rem;
      margin-right: 5px;
    }

    .activity-action {
      width: auto;
      margin-top: 0;
      padding: 10px 14px;
      white-space: nowrap;
    }

    .loading {
      text-align: center;
      padding: 24px 12px;
      color: var(--mute);
    }

    @media (max-width: 380px) {
      .wrap {
        padding-left: 12px;
        padding-right: 12px;
      }

      .top .in {
        padding-left: 12px;
        padding-right: 12px;
      }

      .trait-grid,
      .choice-grid {
        grid-template-columns: 1fr;
      }

      .grid3 {
        grid-template-columns: 1fr;
      }

      .activity-card .row {
        align-items: flex-start;
      }

      .activity-action {
        padding: 9px 10px;
        font-size: .9rem;
      }
    }
  </style>
</head>

<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const app = document.getElementById("app");

const SUPABASE_URL =
  "https://pbqtbwiymlwksdtfsfcb.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_-SK-LvMzEwv-oqn8A5hZOQ_rwyzGxUj";

if (
  !window.supabase ||
  typeof window.supabase.createClient !== "function"
) {
  app.innerHTML = `
    <div class="stripe"></div>

    <div class="wrap">

      <h1>Naija Hustle</h1>

      <div class="err">
        <b>Naija Hustle could not start.</b>
        <br><br>
        The Supabase connection library failed to load.
      </div>

    </div>
  `;

  throw new Error(
    "Supabase JavaScript library failed to load."
  );
}

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   STATE
   ========================================================= */

const S = {

  user: null,
  ch: null,

  tab: "home",
  mode: "login",

  msg: null,
  busy: false,

  picked: null,
  nameDraft: "",

  personalityTraits: null,
  personality1: null,
  personality2: null,

  skinTone: "medium",
  hairstyle: "short",
  hairColor: "black",
  outfit: "casual",
  accessory: "none",

  jobs: null,
  jobMsg: null,

  activityMsg: null,

  bizTypes: null,
  biz: null,
  bizLoaded: false,
  bizMsg: null,

  districts: null,
  mapMsg: null

};


/* =========================================================
   GAME DATA
   ========================================================= */

const BG = [

  {
    id: "street_boy",
    name: "Street Boy",
    meta: "Starts in Mushin · ₦5,000",
    d:
      "No capital, no connections, plenty of hustle. Your only collateral is gist."
  },

  {
    id: "graduate",
    name: "Graduate",
    meta: "Starts in Yaba · ₦20,000",
    d:
      "First class degree, zero job offers. The CV is strong, the NYSC is done."
  },

  {
    id: "nepo_baby",
    name: "Nepo Baby",
    meta: "Starts in Lekki · ₦500,000",
    d:
      "Daddy's name opens doors. Now prove the doors were worth opening."
  },

  {
    id: "returnee",
    name: "Returnee",
    meta: "Starts in Ikeja · ₦150,000",
    d:
      "Came back from abroad with savings and a strong accent. Lagos will humble you."
  }

];


const SK = {
  hustle: "Hustle",
  edu: "Education",
  charm: "Charm",
  tech: "Tech"
};


const SKIN_TONES = [
  ["light", "Light"],
  ["medium", "Medium"],
  ["deep", "Deep"]
];


const HAIRSTYLES = [
  ["short", "Short"],
  ["low_cut", "Low Cut"],
  ["fade", "Fade"],
  ["afro", "Afro"],
  ["braids", "Braids"],
  ["dreads", "Dreads"],
  ["natural", "Natural"],
  ["long", "Long"]
];


const HAIR_COLORS = [
  ["black", "Black"],
  ["brown", "Brown"],
  ["blonde", "Blonde"],
  ["red", "Red"]
];


const OUTFITS = [
  ["casual", "Casual"],
  ["streetwear", "Streetwear"],
  ["formal", "Formal"],
  ["traditional", "Traditional"],
  ["sport", "Sport"],
  ["business", "Business"]
];


const ACCESSORIES = [
  ["none", "None"],
  ["cap", "Cap"],
  ["glasses", "Glasses"],
  ["chain", "Chain"],
  ["watch", "Watch"],
  ["earrings", "Earrings"],
  ["headphones", "Headphones"]
];


/* =========================================================
   HELPERS
   ========================================================= */

const esc = value =>
  String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char])
  );


const naira = value =>
  "₦" +
  Number(value || 0).toLocaleString("en-NG");


const cap = value => {

  const str =
    String(value || "");

  return str
    ? str.charAt(0).toUpperCase() +
      str.slice(1)
    : "";

};


const bgName = id => {

  const bg =
    BG.find(
      item => item.id === id
    );

  return bg
    ? bg.name
    : id;

};


const setMsg = (
  text,
  ok = false
) => {

  S.msg =
    text
      ? {
          t: text,
          ok
        }
      : null;

};


const msgHtml = () => {

  if (!S.msg) {
    return "";
  }

  return `
    <div
      class="${S.msg.ok ? "ok" : "err"}"
      role="alert"
      style="margin:12px 0 0"
    >
      ${esc(S.msg.t)}
    </div>
  `;

};


function optionLabel(
  list,
  value
) {

  const found =
    list.find(
      item => item[0] === value
    );

  return found
    ? found[1]
    : cap(value);

}


/* =========================================================
   CHARACTER PREVIEW
   ========================================================= */

function avatarEmoji() {

  if (S.accessory === "headphones") {
    return "🎧";
  }

  if (S.accessory === "glasses") {
    return "🤓";

/* =========================================================
   REAL NIGERIAN CLOCK
   ========================================================= */

function realTimeInfo() {

  const now =
    new Date();

  const timeFormatter =
    new Intl.DateTimeFormat(
      "en-NG",
      {
        timeZone: "Africa/Lagos",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }
    );

  const dateFormatter =
    new Intl.DateTimeFormat(
      "en-NG",
      {
        timeZone: "Africa/Lagos",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  const hourFormatter =
    new Intl.DateTimeFormat(
      "en-NG",
      {
        timeZone: "Africa/Lagos",
        hour: "numeric",
        hour12: false
      }
    );

  const hour =
    Number(
      hourFormatter.format(now)
    );

  let phase =
    "Morning";

  if (
    hour >= 12 &&
    hour < 17
  ) {
    phase =
      "Afternoon";
  } else if (
    hour >= 17 &&
    hour < 21
  ) {
    phase =
      "Evening";
  } else if (
    hour >= 21 ||
    hour < 5
  ) {
    phase =
      "Night";
  }

  const icon =
    phase === "Morning"
      ? "🌅"
      : phase === "Afternoon"
        ? "☀️"
        : phase === "Evening"
          ? "🌆"
          : "🌙";

  return {
    time:
      timeFormatter.format(now),

    date:
      dateFormatter.format(now),

    phase,
    icon
  };

}

function startGameClock() {

  if (window.naijaClockTimer) {

    clearInterval(
      window.naijaClockTimer
    );

  }

  const updateClock = () => {

    const clock =
      document.querySelector(
        "[data-game-clock]"
      );

    if (!clock) {
      return;
    }

    const info =
      realTimeInfo();

    const date =
      document.querySelector(
        "[data-real-date]"
      );

    const phase =
      document.querySelector(
        "[data-game-phase]"
      );

    const icon =
      document.querySelector(
        "[data-game-phase-icon]"
      );

    clock.textContent =
      info.time;

    if (date) {
      date.textContent =
        info.date;
    }

    if (phase) {
      phase.textContent =
        info.phase;
    }

    if (icon) {
      icon.textContent =
        info.icon;
    }

  };

  updateClock();

  if (
    document.querySelector(
      "[data-game-clock]"
    )
  ) {

    window.naijaClockTimer =
      setInterval(
        updateClock,
        1000
      );

  }

}

const needPct = value =>
  Math.max(
    0,
    Math.min(
      100,
      Number(value) || 0
    )
  );


const needClass = value => {

  const pct =
    needPct(value);

  if (pct <= 20) {
    return "need-low";
  }

  if (pct <= 50) {
    return "need-mid";
  }

  return "need-good";

};

          }
        </button>

      </div>

    </div>

  `;

  document.getElementById("sw").onclick =

      S.mode =
        login
          ? "signup"
          : "login";

      setMsg(null);

      viewAuth();

    };


  document.getElementById("go").onclick =
    async event => {

      const email =
        document
          .getElementById("em")
          .value
          .trim();

      const password =
        document
          .getElementById("pw")
          .value;

      if (
        !email ||
        password.length < 6
      ) {

        setMsg(
          "Enter your email and a password of at least 6 characters."
        );

        return viewAuth();

      }

      event.target.disabled =
        true;

      try {

        if (login) {

          const {
            error
          } =
            await db.auth.signInWithPassword({
              email,
              password
            });

          if (error) {

            setMsg(
              error.message
            );

            return viewAuth();

          return;

        if (!data.session) {

          setMsg(
            "Account created. Check your email to confirm, then log in.",
            true
          );

          return viewAuth();

        }

      } catch (error) {

        setMsg(
          error?.message ||
          "Authentication failed."
        );

        viewAuth();

      }

    };

}

/* =========================================================
   CREATE CHARACTER
   ========================================================= */

async function createCharacter(event) {

  if (S.busy) {
    return;
  }


  const nameInput =
    document.getElementById("nm");


  if (!nameInput) {
    return;
  }


  const name =
    nameInput.value.trim();


  S.nameDraft =
    name;


  if (
    name.length < 3 ||
    name.length > 20
  ) {

    setMsg(
      "Name must be 3 to 20 characters."
    );

    return viewCreate();

  }


  if (!S.picked) {

    setMsg(
      "Pick a background to continue."
    );

    return viewCreate();

  }


  if (
    !S.personality1 ||
    !S.personality2
  ) {

    setMsg(
      "Pick exactly two personality traits."
    );

    return viewCreate();

  }


  if (
    S.personality1 ===
    S.personality2
  ) {

    setMsg(
      "Choose two different personality traits."
    );

    return viewCreate();

  }


  S.busy =
    true;


  if (event?.target) {
    event.target.disabled =
      true;
  }


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "create_character",
        {

          p_name:
            name,

          p_background:
            S.picked,

          p_trait_1:
            S.personality1,

          p_trait_2:
            S.personality2,

          p_skin_tone:
            S.skinTone,

          p_hairstyle:
            S.hairstyle,

          p_hair_color:
            S.hairColor,

          p_outfit:
            S.outfit,

          p_accessory:
            S.accessory

        }
      );


    if (error) {
      throw error;
    }


    if (
      data &&
      data.id
    ) {

      S.ch =
        data;

    }


    S.busy =
      false;

    setMsg(null);


    /*
     * Reload the authoritative
     * character from Supabase.
     */

    await load();


  } catch (error) {

    S.busy =
      false;


    console.error(
      "Character creation failed:",
      error
    );


    setMsg(
      error?.message ||
      "Character creation failed."
    );


    viewCreate();

  }

}

async function go(tab) {

  S.tab =
    tab;

  S.jobMsg =
    null;

  S.activityMsg =
    null;

  S.bizMsg =
    null;

  S.mapMsg =
    null;


  if (
    tab === "business"
  ) {

    S.bizLoaded =
      false;

  }


  viewGame();


  if (
    tab === "business"
  ) {

    return;

  }


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );


    if (error) {
      throw error;
    }


    if (
      data &&
      data.id &&
      S.tab === tab
    ) {

      S.ch =
        data;

      viewGame();

    }


  } catch (error) {

    console.error(
      "Navigation refresh failed:",
      error
    );

  }

}


/* =========================================================
   MAIN GAME VIEW
   ========================================================= */

function viewGame() {

  /*
   * IMPORTANT:
   * A logged-in user without a character
   * belongs on the character creation screen,
   * NOT the login screen.
   */

  if (!S.ch) {

    if (S.user) {

      return viewCreate();

    }

    return viewAuth();

  }


  if (window.naijaClockTimer) {

    clearInterval(
      window.naijaClockTimer
    );

  }


  const c =
    S.ch;


  const maxEnergy =
    Number(c.max_energy) || 1;


  const energy =
    Number(c.energy) || 0;


  const pct =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(
          (
            energy /
            maxEnergy
          ) * 100
        )
      )
    );


  const xpPct =
    Number(c.xp || 0) % 100;


  const tabs = [

  ["home", "Home"],
  ["jobs", "Jobs"],
  ["business", "Business"],
  ["map", "Map"],
  ["board", "Ranks"],
  ["profile", "Profile"]

];


  app.innerHTML = `

    <div class="top">

      <div class="in">

        <div class="row">

          <b>
            ${esc(c.name)}
          </b>

          <span class="pill">

            Lvl
            ${Number(c.level) || 1}

            ·

            ${xpPct}/100 XP

          </span>

        </div>


        <div class="cash">
          ${naira(c.cash)}
        </div>


        <div
          class="row"
          style="font-size:.9rem"
        >

          <span>
            Energy
            ${energy}/${maxEnergy}
          </span>

          <span>
            Rep
            ${Number(c.reputation) || 0}
          </span>

        </div>


        <div class="bar">

          <i
            style="width:${pct}%"
          ></i>

        </div>

      </div>


      <div class="stripe"></div>

    </div>


    <div
      class="wrap"
      id="main"
    ></div>


    <nav class="nav">

      ${
        tabs.map(
          ([key, label]) => `

            <button
              type="button"
              data-t="${key}"
              ${
                S.tab === key
                  ? 'aria-current="page"'
                  : ""
              }
            >
              ${label}
            </button>

          `
        ).join("")
      }

    </nav>

  `;


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(button => {

      button.onclick =
        () =>
          go(
            button.dataset.t
          );

    });


  const main =
    document.getElementById(
      "main"
    );


  if (
    S.tab === "home"
  ) {

    main.innerHTML =
      homeHtml(c);


    main
      .querySelectorAll(
        "[data-activity]"
      )
      .forEach(button => {

        button.onclick =
          () =>
            doActivity(
              button.dataset.activity
            );

      });


  } else if (
    S.tab === "jobs"
  ) {

    jobsView(main);


  } else if (
    S.tab === "business"
  ) {

    bizView(main);


  } else if (
    S.tab === "map"
  ) {

    mapView(main);


  } else if (
    S.tab === "board"
  ) {

    boardView(main);

  }


  const logout =
    document.getElementById(
      "lo2"
    );


  if (logout) {

    logout.onclick =
      () =>
        db.auth.signOut();

  }


  startGameClock();

}

async function doActivity(
  activity
) {

  if (S.busy) {
    return;
  }


  S.busy =
    true;


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "do_activity",
        {
          p_activity:
            activity
        }
      );


    S.busy =
      false;


    if (error) {

      S.activityMsg = {

        t:
          error.message,

        ok:
          false

      };

      return viewGame();

    }


    S.ch =
      data;


    const names = {

      eat:
        "Meal",

      entertainment:
        "Entertainment",

      socialize:
        "Socializing",

      freshen_up:
        "Freshening up"

    };


    S.activityMsg = {

      t:
        `${
          names[activity] ||
          "Activity"
        } completed.` +

        (
          data.last_event
            ? ` ${data.last_event}`
            : ""
        ),

      ok:
        true

    };


    viewGame();


  } catch (error) {

    S.busy =
      false;


    S.activityMsg = {

      t:
        error?.message ||
        "Activity failed.",

      ok:
        false

    };


    viewGame();

  }

}

function jobCard(
  job,
  character
) {

  const needs =
    [];


  if (
    Number(character.level) <
    Number(job.min_level)
  ) {

    needs.push(
      "level " +
      job.min_level
    );

  }


  if (
    job.req_skill &&
    Number(
      character[
        "skill_" +
        job.req_skill
      ]
    ) <
    Number(
      job.req_skill_level
    )
  ) {

    needs.push(

      SK[job.req_skill] +
      " " +
      job.req_skill_level

    );

  }


  return `

    <div class="card">

      <div class="row">

        <h2>
          ${esc(job.title)}
        </h2>

        <span class="pill">
          ${job.energy_cost} energy
        </span>

      </div>


      <p class="mute">
        ${esc(job.description)}
      </p>


      <div
        class="row"
        style="font-size:.95rem"
      >

        <span>

          ${naira(job.pay_min)}
          to
          ${naira(job.pay_max)}

        </span>


        <span>
          +${job.xp} XP
        </span>

      </div>


      ${
        needs.length
          ? `

            <div class="lock">

              Locked: needs
              ${esc(
                needs.join(
                  " and "
                )
              )}

            </div>

          `
          : `

            <button
              class="btn"
              type="button"
              data-job="${esc(job.id)}"
            >
              Work this job
            </button>

          `
      }

    </div>

  `;

}

async function doJob(id) {

  if (S.busy) {
    return;
  }


  S.busy =
    true;


  const before =
    S.ch;


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "do_job",
        {
          p_job_id:
            id
        }
      );


    S.busy =
      false;


    if (error) {

      S.jobMsg = {

        t:
          error.message,

        ok:
          false

      };

      return viewGame();

    }


    const job =
      S.jobs.find(
        item =>
          item.id === id
      );


    S.ch =
      data;


    let message =
      job
        ? `${job.title} completed.`
        : "Job completed.";


    const diff =
      Number(data.cash) -
      Number(before.cash);


    message +=
      ` Cash ${
        diff >= 0
          ? "+"
          : "-"
      }${naira(
        Math.abs(diff)
      )}.`;


    if (
      Number(data.level) >
      Number(before.level)
    ) {

      message +=
        ` Level up! You're now level ${data.level}.`;

    }


    if (data.last_event) {

      message +=
        " " +
        data.last_event;

    }


    S.jobMsg = {

      t:
        message,

      ok:
        true

    };


    viewGame();


  } catch (error) {

    S.busy =
      false;


    S.jobMsg = {

      t:
        error?.message ||
        "The job could not be completed.",

      ok:
        false

    };


    viewGame();

  }

}

      ${head}

      <div class="err">
        Your business type could not be found.
      </div>

    `;

    return;

  }


  const rate =
    Number(type.base_rate) *
    Number(business.level);


  const capacity =
    Number(type.base_capacity) *
    Number(business.level);


  const perHour =
    rate *
    (
      Number(type.unit_price) -
      Number(type.unit_cost)
    );


  const stock =
    Number(
      business.stock
    ) || 0;


  const fill =
    Math.max(
      0,
      capacity - stock
    );


  const upgradeCost =
    Math.floor(
      Number(type.buy_cost) *
      Number(business.level) /
      2
    );


  main.innerHTML =
    head +

    `

      <div class="card">

        <div class="row">

          <h2>
            ${esc(type.name)}
          </h2>

          <span class="pill">
            Level
            ${business.level}
          </span>

        </div>

        <p class="mute">

          ${rate}
          units per hour.

          Potential profit:
          ${naira(perHour)}
          per hour while stocked.

        </p>


        <div class="sk">

          <div class="row">

            <span>
              Stock
            </span>

            <b>
              ${stock}/${capacity}
            </b>

          </div>


          <div class="bar">

            <i
              style="
                width:${
                  capacity
                    ? Math.min(
                        100,
                        (
                          stock /
                          capacity
                        ) * 100
                      )
                    : 0
                }%
              "
            ></i>

          </div>

        </div>

      </div>


      <div class="card">

        <div class="mute">
          Ready to collect
        </div>

        <div class="big">
          ${naira(
            business.uncollected
          )}
        </div>

        <button
          class="btn"
          id="collect"
          type="button"
        >
          Collect earnings
        </button>

      </div>


      <div class="card">

        <h2>
          Restock
        </h2>

        <p class="mute">

          Each unit costs
          ${naira(
            type.unit_cost
          )}.

        </p>


        ${
          fill > 0
            ? `

              <div class="grid3">

                <button
                  class="btn alt"
                  data-stock="${Math.min(
                    10,
                    fill
                  )}"
                >
                  +10
                </button>


                <button
                  class="btn alt"
                  data-stock="${Math.min(
                    50,
                    fill
                  )}"
                >
                  +50
                </button>


                <button
                  class="btn alt"
                  data-stock="${fill}"
                >
                  Fill
                </button>

              </div>

            `
            : `

              <p>
                Your shop is full.
              </p>

            `
        }

      </div>


      <div class="card">

        <h2>
          Upgrade
        </h2>

        ${
          Number(
            business.level
          ) < 5
            ? `

              <button
                class="btn alt"
                id="upgrade"
                type="button"
                style="width:100%"
              >

                Upgrade to level
                ${
                  Number(
                    business.level
                  ) + 1
                }

                <small>
                  ${naira(
                    upgradeCost
                  )}
                </small>

              </button>

            `
            : `

              <p>
                Max level reached.
              </p>

            `
        }

      </div>

    `;


  const collect =
    document.getElementById(
      "collect"
    );


  if (collect) {

    collect.onclick =
      () =>
        bizAct(
          "collect_earnings",
          {},
          () =>
            "Earnings collected."
        );

  }


  main
    .querySelectorAll(
      "[data-stock]"
    )
    .forEach(button => {

      button.onclick =
        () =>
          bizAct(
            "restock_business",
            {
              p_units:
                Number(
                  button.dataset.stock
                )
            },
            () =>
              "Business restocked."
          );

    });


  const upgrade =
    document.getElementById(
      "upgrade"
    );


  if (upgrade) {

    upgrade.onclick =
      () =>
        bizAct(
          "upgrade_business",
          {},
          () =>
            "Business upgraded."
        );

  }

}


async function bizAct(
  functionName,
  args,
  successText
) {

  if (S.busy) {
    return;
  }


  S.busy =
    true;


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        functionName,
        args
      );


    S.busy =
      false;


    if (error) {

      S.bizMsg = {

        t:
          error.message,

        ok:
          false

      };

      return viewGame();

    }


    if (
      data?.character
    ) {

      S.ch =
        data.character;

    }


    if (
      Object.prototype
        .hasOwnProperty
        .call(
          data || {},
          "business"
        )
    ) {

      S.biz =
        data.business;

    }


    S.bizLoaded =
      true;


    S.bizMsg = {

      t:
        successText(data),

      ok:
        true

    };


    viewGame();


  } catch (error) {

    S.busy =
      false;


    S.bizMsg = {

      t:
        error?.message ||
        "Business action failed.",

      ok:
        false

    };


    viewGame();

  }

}


/* =========================================================
   DISTRICTS
   ========================================================= */

async function loadDistricts() {

  if (S.districts) {
    return S.districts;
  }


  const result =
    await db
      .from("districts")
      .select("*")
      .order("travel_cost");


  if (result.error) {
    return null;
  }


  S.districts =
    result.data || [];


  return S.districts;

}


/* =========================================================
   MAP
   ========================================================= */

function mapSvg(
  currentDistrict
) {

  const positions = {

    ikeja:
      [68, 42],

    mushin:
      [128, 88],

    yaba:
      [218, 92],

    victoria_island:
      [195, 175],

    lekki:
      [278, 188]

  };


  const labels = {

    ikeja:
      "Ikeja",

    mushin:
      "Mushin",

    yaba:
      "Yaba",

    victoria_island:
      "VI",

    lekki:
      "Lekki"

  };


  const links = [

    ["ikeja", "mushin"],

    ["mushin", "yaba"],

    ["yaba", "victoria_island"],

    ["victoria_island", "lekki"]

  ];


  const lines =
    links.map(
      ([from, to]) => `

        <line

          x1="${positions[from][0]}"
          y1="${positions[from][1]}"

          x2="${positions[to][0]}"
          y2="${positions[to][1]}"

          stroke="#94A3A2"
          stroke-width="2.5"
          stroke-dasharray="6 5"
          stroke-linecap="round"

        />

      `
    ).join("");


  const dots =
    Object.keys(
      positions
    )
      .map(
        id => {

          const [
            x,
            y
          ] =
            positions[id];


          const current =
            id ===
            currentDistrict;


          return `

            <g
              class="map-pin"
              data-id="${id}"
            >

              <circle

                cx="${x}"
                cy="${y}"

                r="${
                  current
                    ? 13
                    : 9
                }"

                fill="${
                  current
                    ? "#FFC20E"
                    : "#fff"
                }"

                stroke="${
                  current
                    ? "#14201F"
                    : "#0F6B6F"
                }"

                stroke-width="3"

              />


              <text

                x="${x}"
                y="${y + 28}"

                text-anchor="middle"

                font-size="12"

                font-weight="700"

                fill="#14201F"

              >
                ${labels[id]}
              </text>

            </g>

          `;

        }
      ).join("");


  return `

    <div class="card map-card">

      <svg
        class="map-svg"
        viewBox="0 0 320 230"
      >

        <rect
          width="320"
          height="230"
          rx="12"
          fill="#F7F4EC"
        />


        <path

          d="
            M0 128
            C55 112 125 155 205 132
            S305 122 320 138
            L320 162
            C265 152 200 178 115 162
            S35 152 0 155 Z
          "

          fill="#A8D5D5"

        />


        <text

          x="28"
          y="152"

          font-size="11"

          fill="#0F6B6F"

          font-weight="600"

        >
          Lagos Lagoon
        </text>


        ${lines}
        ${dots}

      </svg>

    </div>

  `;

}

  main.innerHTML = `

              </div>


              <p class="mute">

              <div class="bonus">

                +${district.bonus_pct}%

                ${

              </div>

                      ${esc(
                        district.name
                      )}

                    </button>

            </div>

          `;

        }
      ).join("")

  `;


  main
    .querySelectorAll(
      ".map-pin"

    .forEach(pin => {

      pin.onclick =
        () => {

          if (
            pin.dataset.id !==
            current
          ) {

            travel(
              pin.dataset.id
            );

          }

        };

    });


  main
    .querySelectorAll(
      "[data-travel]"
    )
    .forEach(button => {

      button.onclick =
        () =>
          travel(
            button.dataset.travel
          );

    });

}


async function travel(id) {

  if (S.busy) {
    return;
  }


  const district =
    S.districts.find(
      item =>
        item.id === id
    );


  if (!district) {
    return;
  }


  S.busy =
    true;


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "travel",
        {
          p_district:
            id
        }
      );


    S.busy =
      false;


    if (error) {

      S.mapMsg = {

        t:
          error.message,

        ok:
          false

      };

      return viewGame();

    }


    S.ch =
      data;


    S.mapMsg = {

      t:
        `You reached ${district.name}.`,

      ok:
        true

    };


    viewGame();


  } catch (error) {

    S.busy =
      false;


    S.mapMsg = {

      t:
        error?.message ||
        "Travel failed.",

      ok:
        false

    };


    viewGame();

  }

}

/* =========================================================
   LOAD
   ========================================================= */

async function load() {

  if (!S.user) {

    S.ch =
      null;

    return viewAuth();

  }


  try {

    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );


    if (error) {

      /*
       * Do not automatically send a logged-in
       * user to the login page.
       */

      console.error(
        "get_my_character failed:",
        error
      );


      setMsg(
        error.message
      );


      /*
       * If authentication is still valid,
       * keep the user in the character flow.
       */

      return viewCreate();

    }


    S.ch =
      data?.id
        ? data
        : null;


    if (S.ch) {

      try {

        await loadPersonalityTraits();

      } catch (_) {

        /*
         * Personality display is optional
         * after character creation.
         */

      }


      viewGame();

    } else {

      /*
       * Authenticated user with no character.
       */

      viewCreate();

    }


  } catch (error) {

    console.error(
      "Load failed:",
      error
    );


    if (S.user) {

      setMsg(
        error?.message ||
        "Could not load your character."
      );

      return viewCreate();

    }


    setMsg(
      error?.message ||
      "Could not load the game."
    );


    viewAuth();

  }

}


/* =========================================================
   AUTH STATE
   ========================================================= */

db.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    S.user =
      session
        ? session.user
        : null;


    if (
      event ===
      "INITIAL_SESSION"
    ) {
      return;
    }


    setTimeout(
      () =>
        load(),
      0
    );

  }
);


/* =========================================================
   STARTUP
   ========================================================= */

(async function init() {

  try {

    const {
      data,
      error
    } =
      await db.auth.getSession();


    if (error) {
      throw error;
    }


    S.user =
      data?.session
        ? data.session.user
        : null;


    await load();


  } catch (error) {

    console.error(
      "Naija Hustle startup error:",
      error
    );


    app.innerHTML = `

      <div class="stripe"></div>

      <div class="wrap">

        <h1>
          Naija Hustle
        </h1>


        <div class="err">

          <b>
            Something went wrong while starting the game.
          </b>

          <br><br>

          ${esc(
            error?.message ||
            "Unknown startup error."
          )}

        </div>

      </div>

    `;

  }

})();

</script>
