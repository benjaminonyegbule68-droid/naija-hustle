<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0F6B6F">
<title>Naija Hustle — Open World</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#14201F;--lagoon:#0F6B6F;--danfo:#FFC20E;--panel:rgba(10,16,20,.74);--line:rgba(255,255,255,.14);--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#8fcbd6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
body{touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#game canvas{width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px}
#hud{position:fixed;top:calc(12px + var(--top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:20}
#info{padding:10px 14px;min-width:150px}
#name{font-size:15px;font-weight:800}
#sub{margin-top:2px;color:#c9d4d8;font-size:11px}
#statusRow{display:flex;gap:10px;margin-top:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
#status{color:var(--danfo)}
#clock{color:#9fe3dc}
#topButtons{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
#btnRow{display:flex;gap:8px}
.uiBtn{min-width:44px;height:44px;padding:0 10px;border:1px solid var(--line);border-radius:13px;background:rgba(10,16,20,.75);font-weight:800;font-size:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.uiBtn:active{transform:scale(.95)}
#minimap{width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(0,0,0,.3);background:#2f5a45}
#toast{position:fixed;left:50%;top:calc(76px + var(--top));transform:translate(-50%,-12px);max-width:86vw;padding:10px 16px;border-radius:14px;background:rgba(10,16,20,.88);border:1px solid var(--line);font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:150;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#prompt{position:fixed;left:50%;bottom:calc(150px + var(--bot));transform:translateX(-50%);z-index:28;display:none;height:48px;padding:0 20px;border:0;border-radius:15px;background:var(--danfo);color:#171717;font-weight:900;box-shadow:0 8px 25px rgba(0,0,0,.25)}
#prompt.show{display:block}
#backBtn,#customizeBtn,#emoteBtn{position:fixed;bottom:calc(14px + var(--bot));z-index:30;height:48px;padding:0 17px;border-radius:15px;font-weight:800}
#backBtn{left:14px;border:1px solid var(--line);background:rgba(10,16,20,.78)}
#emoteBtn{left:50%;transform:translateX(-50%);border:1px solid var(--line);background:rgba(10,16,20,.78)}
#customizeBtn{right:14px;border:0;background:var(--danfo);color:#171717;font-weight:900;box-shadow:0 8px 25px rgba(0,0,0,.2)}
#emoteMenu{position:fixed;left:50%;bottom:calc(72px + var(--bot));transform:translateX(-50%);display:none;gap:8px;padding:8px;z-index:31}
#emoteMenu.open{display:flex}
#emoteMenu button{height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#151c20;font-weight:800;font-size:12px}
#joystick{position:fixed;left:18px;bottom:calc(76px + var(--bot));width:126px;height:126px;border-radius:50%;background:rgba(10,16,20,.22);border:1px solid rgba(255,255,255,.2);z-index:25;display:none;touch-action:none}
#stick{position:absolute;width:54px;height:54px;left:36px;top:36px;border-radius:50%;background:rgba(255,255,255,.86);box-shadow:0 5px 18px rgba(0,0,0,.2)}
.round{position:fixed;border-radius:50%;z-index:25;display:none;border:1px solid rgba(255,255,255,.22);background:rgba(10,16,20,.68);font-weight:900;touch-action:none}
#jumpBtn{right:18px;bottom:calc(76px + var(--bot));width:76px;height:76px}
#runBtn{right:104px;bottom:calc(76px + var(--bot));width:58px;height:58px;font-size:12px}
#runBtn.active{background:var(--danfo);color:#171717}
@media (pointer:coarse){#joystick,.round{display:block}}
#viewerBar{position:fixed;top:calc(12px + var(--top));left:12px;right:12px;z-index:40;display:none;gap:8px;flex-wrap:wrap;justify-content:center}
body.viewer #viewerBar{display:flex}
body.viewer #hud,body.viewer #joystick,body.viewer .round,body.viewer #backBtn,body.viewer #emoteBtn,body.viewer #emoteMenu,body.viewer #prompt{display:none!important}
#viewerBar .uiBtn.on{background:var(--danfo);color:#171717;border-color:var(--danfo)}
#customizer{position:fixed;z-index:100;left:0;right:0;bottom:0;background:rgba(8,12,15,.96);border-top:1px solid var(--line);box-shadow:0 -20px 50px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .3s cubic-bezier(.22,.8,.25,1);padding:14px 14px calc(14px + var(--bot));max-height:46vh;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
#customizer.open{transform:translateY(0)}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.sheetTitle{font-size:17px;font-weight:900;flex:1}
.close{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#151c20;font-size:18px}
.section{margin-top:14px}
.sectionTitle{font-size:11px;color:#9eabb0;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin-bottom:8px}
.options{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}
.option{flex:0 0 auto;min-width:76px;min-height:46px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:#151c20;color:#e9edef;font-size:12px;font-weight:800}
.option.selected{border-color:var(--danfo);background:#332d17;color:#ffd84e}
.swatch{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.18)}
.swatch.selected{border-color:var(--danfo);box-shadow:0 0 0 2px #000 inset}
#saveConfig{width:100%;height:50px;margin-top:16px;border:0;border-radius:15px;background:var(--danfo);color:#151515;font-weight:900;font-size:14px}
#loading{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#10191d;transition:opacity .35s ease;text-align:center;padding:20px}
#loading.hidden{opacity:0;pointer-events:none}
.loader{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--danfo);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadingText{margin-top:13px;color:#d9e0e2;font-size:13px;font-weight:700;max-width:300px}
@media (min-width:800px){
  #customizer{left:auto;right:18px;bottom:18px;width:390px;border:1px solid var(--line);border-radius:20px;transform:translateX(110%);max-height:80vh}
  #customizer.open{transform:translateX(0)}
}
@media (prefers-reduced-motion:reduce){#customizer{transition:none}}
</style>
</head>
<body>

<div id="game"></div>

<div id="hud">
  <div id="info" class="panel">
    <div id="name">Guest</div>
    <div id="sub">Lagos</div>
    <div id="statusRow"><span id="status">Idle</span><span id="clock">10:00 AM</span></div>
  </div>
  <div id="topButtons">
    <div id="btnRow">
      <button class="uiBtn" id="cameraBtn" title="Change camera">3rd</button>
      <button class="uiBtn" id="viewBtn" title="View your character">View</button>
      <button class="uiBtn" id="qualityBtn" title="Graphics quality">HD</button>
    </div>
    <canvas id="minimap"></canvas>
  </div>
</div>

<div id="viewerBar">
  <button class="uiBtn on" data-preset="full">Full body</button>
  <button class="uiBtn" data-preset="face">Face</button>
  <button class="uiBtn" data-preset="back">Back</button>
  <button class="uiBtn on" id="spinBtn">Spin</button>
  <button class="uiBtn on" data-pose="idle">Idle</button>
  <button class="uiBtn" data-pose="walk">Walk</button>
  <button class="uiBtn" data-pose="run">Run</button>
  <button class="uiBtn" data-pose="wave">Wave</button>
  <button class="uiBtn" data-pose="dance">Dance</button>
  <button class="uiBtn" id="viewerClose">Done</button>
</div>

<div id="toast" role="status"></div>
<button id="prompt">Enter</button>

<button id="backBtn">← Back</button>
<button id="emoteBtn">Emotes</button>
<button id="customizeBtn">Customize</button>
<div id="emoteMenu" class="panel">
  <button data-emote="wave">Wave</button>
  <button data-emote="dance">Dance</button>
  <button data-emote="cheer">Cheer</button>
</div>

<div id="joystick"><div id="stick"></div></div>
<button class="round" id="runBtn">RUN</button>
<button class="round" id="jumpBtn">JUMP</button>

<div id="customizer">
  <div class="sheetHead">
    <div class="sheetTitle">Customize Avatar</div>
    <button class="uiBtn" id="randomBtn">Random</button>
    <button class="close" id="closeCustomizer" aria-label="Close">×</button>
  </div>
  <div id="sections"></div>
  <button id="saveConfig">SAVE AVATAR</button>
</div>

<div id="loading">
  <div class="loader"></div>
  <div class="loadingText" id="loadingText">Loading Naija Hustle...</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =========================================================
   NAIJA HUSTLE — OPEN WORLD
   How to extend:
   - New hairstyle / outfit / accessory: add it to OPTIONS (and OUTFITS),
     then add a case in addHair / addAccessory / addOutfitDetails.
   - New place to visit: add an entry to PLACES.
========================================================= */

const SUPABASE_URL = "https://pbqtbwiymlwksdtfsfcb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-SK-LvMzEwv-oqn8A5hZOQ_rwyzGxUj";

const CFG = {
  walk: 3.2, run: 6.4, accel: 14, decel: 18, turn: 12,
  jump: 5.4, gravity: 15,
  world: 190, limit: 90, road: 12, sidewalk: 3.2,
  avatarScale: 0.82, radius: 0.42,
  dayMinutes: 8
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const { clamp, lerp, smoothstep } = THREE.MathUtils;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- customization data ---------- */
const OPTIONS = {
  skinTone: { label: "Skin tone", kind: "swatch", values: { light: "#f3c39e", honey: "#d99b6c", tan: "#c2845a", brown: "#a96842", deep: "#70412f", dark: "#4c2d25" } },
  hairstyle: { label: "Hairstyle", kind: "pill", values: { low_cut: "Low cut", fade: "Fade", high_top: "High top", afro: "Afro", twists: "Twists", braids: "Braids", locs: "Locs", headwrap: "Gele", bald: "Bald" } },
  hairColor: { label: "Hair colour", kind: "swatch", values: { black: "#171311", darkBrown: "#211712", brown: "#3a2419", burgundy: "#4a1b24", blonde: "#c9a24b", grey: "#9a9a9a" } },
  beard: { label: "Facial hair", kind: "pill", values: { none: "None", stubble: "Stubble", goatee: "Goatee", full: "Full beard" } },
  outfit: { label: "Outfit", kind: "pill", values: { hoodie: "Hoodie", tee: "T-shirt", jersey: "Jersey", kaftan: "Kaftan", agbada: "Agbada", ankara: "Ankara", suit: "Suit" } },
  outfitColor: { label: "Outfit colour", kind: "swatch", values: { default: "default", red: "#b3392f", blue: "#2c5d9e", green: "#2d7a4f", purple: "#6b4aa0", black: "#1b1d21", white: "#efece4", gold: "#d8a22b" } },
  accessory: { label: "Accessory", kind: "pill", values: { none: "None", cap: "Cap", glasses: "Glasses", sunglasses: "Shades", chain: "Chain", headphones: "Headphones" } }
};
const DEFAULT_CFG = { skinTone: "brown", hairstyle: "fade", hairColor: "black", beard: "none", outfit: "hoodie", outfitColor: "default", accessory: "none" };

const OUTFITS = {
  hoodie: { top: "#263747", bottom: "#171b20", sleeves: "long", legs: "long", shoe: "#f2f0e8" },
  tee: { top: "#b5473a", bottom: "#2a3342", sleeves: "short", legs: "long", shoe: "#f2f0e8" },
  jersey: { top: "#147a73", bottom: "#20252b", sleeves: "short", legs: "short", shoe: "#f2f0e8" },
  kaftan: { top: "#d7d0bc", bottom: "#8a7a5a", sleeves: "long", legs: "long", shoe: "#3a2a1c", skirt: { rt: .22, rb: .30, h: .55, y: -.22 } },
  agbada: { top: "#f0e6c9", bottom: "#4b4232", sleeves: "long", legs: "long", shoe: "#3a2a1c", wide: true, skirt: { rt: .26, rb: .46, h: .8, y: -.33 } },
  ankara: { top: "#d8a22b", bottom: "#222d39", sleeves: "short", legs: "long", shoe: "#f2f0e8" },
  suit: { top: "#20252e", bottom: "#17191e", sleeves: "long", legs: "long", shoe: "#101112" }
};

function sanitize(c) {
  const o = { ...DEFAULT_CFG };
  if (c && typeof c === "object") {
    for (const k of Object.keys(DEFAULT_CFG)) {
      if (typeof c[k] === "string" && has(OPTIONS[k].values, c[k])) o[k] = c[k];
    }
  }
  return o;
}

const PLACES = [
  { id: "jobs", name: "Job Centre", tab: "jobs", sx: 1, sz: -1, color: "#0F6B6F" },
  { id: "business", name: "Market Plaza", tab: "business", sx: -1, sz: -1, color: "#C2410C" },
  { id: "board", name: "Hall of Fame", tab: "board", sx: 1, sz: 1, color: "#6b4aa0" },
  { id: "home", name: "Home", tab: "home", sx: -1, sz: 1, color: "#2d6b45" }
];

/* ---------- state ---------- */
const state = {
  mode: "play",            // play | viewer
  cfg: sanitize(null),
  name: "Guest",
  sub: "Lagos",
  user: null,
  keys: { up: false, down: false, left: false, right: false, shift: false },
  joy: { active: false, x: 0, y: 0 },
  runToggle: false,
  jumpQueued: false,
  emote: null,
  status: "Idle",
  quality: localStorage.getItem("nh_quality") || "high"
};
const cam = { yaw: 0, pitch: 0.28, dist: 5.4, mode: "chase" };      // chase | far | first
const viewer = { yaw: 0, pitch: 0.08, dist: 4.6, ty: 1.0, spin: true, preset: "full", pose: "idle", lastDrag: -10, shiftY: 0, shiftX: 0 };
const player = { pos: new THREE.Vector3(7.8, 0, 14), vel: new THREE.Vector3(), vy: 0, yaw: Math.PI, char: null, tag: null };

/* =========================================================
   RENDERER / SCENE
========================================================= */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch (err) {
  $("loadingText").textContent = "Your device or browser does not support 3D graphics.";
  document.querySelector(".loader").style.display = "none";
  throw err;
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$("game").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#8fcbd6");
scene.fog = new THREE.Fog("#8fcbd6", 40, 165);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 280);

const hemi = new THREE.HemisphereLight("#e7fbff", "#3f5547", 1.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight("#fff2d1", 2.8);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 140 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight("#8fa8ff", 0);
moon.position.set(-20, 40, -10);
scene.add(moon);

function applyQuality() {
  const high = state.quality === "high";
  renderer.setPixelRatio(high ? Math.min(devicePixelRatio, 2) : 1);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = high;
  sun.castShadow = high;
  scene.traverse(o => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); } });
  $("qualityBtn").textContent = high ? "HD" : "LO";
}

/* =========================================================
   CACHES
========================================================= */
const geoCache = new Map();
function geo(key, make) { let g = geoCache.get(key); if (!g) { g = make(); geoCache.set(key, g); } return g; }
const sphereG = (r, w = 20, h = 14) => geo(`s${r}_${w}_${h}`, () => new THREE.SphereGeometry(r, w, h));
const capsuleG = (r, l, c = 5, rad = 12) => geo(`c${r}_${l}_${c}_${rad}`, () => new THREE.CapsuleGeometry(r, l, c, rad));
const cylG = (rt, rb, h, s = 20) => geo(`y${rt}_${rb}_${h}_${s}`, () => new THREE.CylinderGeometry(rt, rb, h, s));
const boxG = (x, y, z) => geo(`b${x}_${y}_${z}`, () => new THREE.BoxGeometry(x, y, z));
const torusG = (r, t, rs = 8, ts = 24, arc = Math.PI * 2) => geo(`t${r}_${t}_${rs}_${ts}_${arc}`, () => new THREE.TorusGeometry(r, t, rs, ts, arc));

const matCache = new Map();
function mat(color, rough = 0.7, metal = 0, opts = null) {
  const k = `${color}|${rough}|${metal}|${opts ? JSON.stringify(opts) : ""}`;
  let m = matCache.get(k);
  if (!m) { m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...(opts || {}) }); matCache.set(k, m); }
  return m;
}

const texCache = new Map();
function labelTexture(text, fg = "#ffffff", bg = null, w = 128, h = 128, font = "800 78px system-ui,sans-serif") {
  const k = [text, fg, bg, w, h, font].join("|");
  let t = texCache.get(k);
  if (t) return t;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.font = font; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = fg;
  g.fillText(text, w / 2, h / 2 + 4);
  t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  texCache.set(k, t);
  return t;
}

/* =========================================================
   CHARACTER
   Front of the character is +Z. Rotating a limb group by a
   positive X angle swings it BACKWARD.
========================================================= */
function createCharacter(rawCfg, opts = {}) {
  const lite = !!opts.lite, sh = opts.shadow !== false;
  const cfg = sanitize(rawCfg);
  const skin = OPTIONS.skinTone.values[cfg.skinTone];
  const hairC = OPTIONS.hairColor.values[cfg.hairColor];
  const outfit = OUTFITS[cfg.outfit];
  const top = cfg.outfitColor !== "default" ? OPTIONS.outfitColor.values[cfg.outfitColor] : outfit.top;
  const bottom = outfit.bottom;
  const hairMat = mat(hairC, 0.85, 0, { side: THREE.DoubleSide });
  const P = (g, c, r = 0.7, m = 0) => { const o = new THREE.Mesh(g, mat(c, r, m)); o.castShadow = sh; o.receiveShadow = true; return o; };

  const root = new THREE.Group();
  const body = new THREE.Group(); body.scale.setScalar(CFG.avatarScale); root.add(body);
  const hips = new THREE.Group(); hips.position.y = 0.96; body.add(hips);

  const pelvis = P(capsuleG(0.17, 0.06), bottom);
  pelvis.rotation.z = Math.PI / 2; pelvis.scale.z = 0.8; pelvis.position.y = -0.02; hips.add(pelvis);

  /* legs */
  const legs = [1, -1].map(sx => {
    const hip = new THREE.Group(); hip.position.set(sx * 0.13, -0.02, 0); hips.add(hip);
    const up = P(capsuleG(0.1, 0.24), bottom); up.position.y = -0.22; hip.add(up);
    const knee = new THREE.Group(); knee.position.y = -0.44; hip.add(knee);
    const low = P(capsuleG(0.085, 0.26), outfit.legs === "long" ? bottom : skin); low.position.y = -0.215; knee.add(low);
    const shoe = P(sphereG(0.11), outfit.shoe, 0.6); shoe.scale.set(0.95, 0.55, 1.5); shoe.position.set(0, -0.44, 0.06); knee.add(shoe);
    return { hip, knee };
  });

  /* torso */
  const spine = new THREE.Group(); hips.add(spine);
  const chest = P(capsuleG(0.2, 0.24), top, 0.8); chest.scale.z = 0.74; chest.position.y = 0.27; spine.add(chest);
  const waist = P(capsuleG(0.17, 0.1), top, 0.8); waist.scale.z = 0.78; waist.position.y = 0.03; spine.add(waist);
  if (outfit.skirt) {
    const s = outfit.skirt;
    const skirt = P(cylG(s.rt, s.rb, s.h, 24), top, 0.85); skirt.position.y = s.y; hips.add(skirt);
    const trim = P(torusG(s.rb, 0.014, 6, 32), "#d8a22b", 0.4, 0.4); trim.rotation.x = Math.PI / 2; trim.position.y = s.y - s.h / 2 + 0.02; hips.add(trim);
  }

  /* arms */
  const arms = [1, -1].map(sx => {

      const tie = P(boxG(0.045, 0.3, 0.025), "#b68b26", 0.5); tie.position.set(0, 0.32, 0.165); spine.add(tie);

  return {
    root, body, hips, spine, head, eyes, legs, arms, cfg,

    pose: { legL: 0, legR: 0, kneeL: 0, kneeR: 0, armLx: 0, armRx: 0, armLz: 0.07, armRz: -0.07, elbL: 0.15, elbR: 0.15, elbLz: 0, elbRz: 0, lean: 0, bob: 0, yaw: 0, headX: 0 }

/* ---------- animation ---------- */
function animateCharacter(c, dt, st) {
  c.time += dt;
  const speed = st.speed || 0;
  const moving = speed > 0.25 && !st.air;
  const amp = clamp(speed / CFG.run, 0, 1.25);
  c.phase += dt * (3.2 + speed * 1.25);
  const s = Math.sin(c.phase);
  const t = c.time;
  const T = { legL: 0, legR: 0, kneeL: 0, kneeR: 0, armLx: 0, armRx: 0, armLz: 0.07, armRz: -0.07, elbL: 0.15, elbR: 0.15, elbLz: 0, elbRz: 0, lean: 0, bob: 0, yaw: 0, headX: 0 };

  if (st.air) {
    T.legL = -0.45; T.legR = 0.3; T.kneeL = 0.9; T.kneeR = 0.5;
    T.armLz = 1.0; T.armRz = -1.0; T.armLx = -0.25; T.armRx = -0.25; T.elbL = 0.3; T.elbR = 0.3; T.lean = 0.08;
  } else if (moving) {
    const a = 0.42 + amp * 0.55;
    T.legL = s * a; T.legR = -s * a;
    T.kneeL = Math.max(0, s) * (0.5 + amp * 0.7); T.kneeR = Math.max(0, -s) * (0.5 + amp * 0.7);
    T.armLx = -s * a * 0.9; T.armRx = s * a * 0.9;
    T.elbL = T.elbR = 0.25 + amp * 0.7;
    T.lean = amp * 0.2;
    T.bob = Math.abs(Math.cos(c.phase)) * 0.05 * (0.6 + amp);
    T.yaw = s * 0.12 * amp;
  } else {
    const br = Math.sin(t * 1.8);
    T.armLz = 0.08 + br * 0.015; T.armRz = -0.08 - br * 0.015;
    T.bob = br * 0.006;
    T.headX = Math.sin(t * 0.7) * 0.02;
  }

  if (st.emote && !st.air) {
    if (st.emote === "wave") {
      T.armRz = -2.55; T.elbRz = Math.sin(t * 9) * 0.55; T.elbR = 0.2;
      T.yaw = 0.08;
    } else if (st.emote === "dance") {
      const d = Math.sin(t * 5);
      T.yaw = d * 0.45; T.bob = Math.abs(d) * 0.07;
      T.armLz = 1.25 + d * 0.5; T.armRz = -1.25 + Math.sin(t * 5 + 1) * 0.5; T.elbL = T.elbR = 0.6;
      T.legL = d * 0.3; T.legR = -d * 0.3; T.kneeL = Math.max(0, d) * 0.6; T.kneeR = Math.max(0, -d) * 0.6;
    } else if (st.emote === "cheer") {
      const p = Math.sin(t * 8);
      T.armLz = 2.7 + p * 0.15; T.armRz = -2.7 - p * 0.15; T.bob = Math.abs(p) * 0.06; T.elbL = T.elbR = 0.1;
      T.legL = p * 0.12; T.legR = -p * 0.12;
    }
  }

  const k = 18, p = c.pose;
  for (const key in T) p[key] = damp(p[key], T[key], k, dt);

  c.legs[0].hip.rotation.x = p.legL; c.legs[1].hip.rotation.x = p.legR;
  c.legs[0].knee.rotation.x = p.kneeL; c.legs[1].knee.rotation.x = p.kneeR;
  c.arms[0].shoulder.rotation.x = p.armLx; c.arms[1].shoulder.rotation.x = p.armRx;
  c.arms[0].shoulder.rotation.z = p.armLz; c.arms[1].shoulder.rotation.z = p.armRz;
  c.arms[0].elbow.rotation.x = -p.elbL; c.arms[1].elbow.rotation.x = -p.elbR;
  c.arms[0].elbow.rotation.z = p.elbLz; c.arms[1].elbow.rotation.z = p.elbRz;
  c.spine.rotation.x = -p.lean;
  c.head.rotation.x = p.lean * 0.8 + p.headX;
  c.hips.rotation.y = p.yaw;
  c.hips.position.y = 0.96 + p.bob;
  c.spine.scale.y = 1 + Math.sin(t * 1.8) * 0.01;

  c.blinkT -= dt;
  if (c.blinkT <= 0) { c.blink = 1; c.blinkT = 2.5 + Math.random() * 3.5; }
  if (c.blink > 0) {
    c.blink = Math.max(0, c.blink - dt * 7);
    const closed = 1 - 0.92 * Math.sin((1 - c.blink) * Math.PI);
    for (const e of c.eyes) e.scale.y = closed;
  }
}

function makeWindowTexture(emissive) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = emissive ? "#000" : "#fff"; g.fillRect(0, 0, 64, 64);
  g.fillStyle = emissive ? "#ffd98a" : "#33505a"; g.fillRect(14, 12, 36, 32);
  g.fillStyle = emissive ? "#000" : "#fff"; g.fillRect(31, 12, 2, 32); g.fillRect(14, 27, 36, 2);
  if (!emissive) { g.fillStyle = "#d2d2d2"; g.fillRect(10, 46, 44, 4); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
const winTex = makeWindowTexture(false), winEmTex = makeWindowTexture(true);
const PALETTE = ["#c9b896", "#b7c4bd", "#d8cfc0", "#a9b7c1", "#cdb08c", "#9fb3a8", "#d9c7a6"];
function wallMaterial(color) {
  return new THREE.MeshStandardMaterial({ color, map: winTex, emissive: "#ffffff", emissiveMap: winEmTex, emissiveIntensity: 0, roughness: 0.85 });
}
const wallMats = PALETTE.map(wallMaterial);
const nightMats = [...wallMats];

function windowedBox(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], null, null, [w, h], [w, h]];
  for (let f = 0; f < 6; f++) {
    for (let v = 0; v < 4; v++) {
      const i = f * 4 + v;
      if (!dims[f]) { uv.setXY(i, 0.02, 0.02); continue; }
      uv.setXY(i, uv.getX(i) * Math.max(1, Math.round(dims[f][0] / 3)), uv.getY(i) * Math.max(1, Math.round(dims[f][1] / 3.2)));
    }
  }
  return g;
}

const lampMat = new THREE.MeshStandardMaterial({ color: "#ffe9a8", emissive: "#ffcc66", emissiveIntensity: 0.1, roughness: 0.4 });
const markers = [];

function instanced(geom, material, matrices) {
  const im = new THREE.InstancedMesh(geom, material, matrices.length);
  matrices.forEach((m, i) => im.setMatrixAt(i, m));
  im.castShadow = true; im.receiveShadow = true; im.instanceMatrix.needsUpdate = true;
  scene.add(im);
  return im;
}

function buildWorld() {
  const R = rng(20261008);
  const W = CFG.world;

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W, W), mat("#4d7755", 0.95));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  const water = new THREE.Mesh(new THREE.PlaneGeometry(700, 300), mat("#2a7f9a", 0.25, 0.1));
  water.rotation.x = -Math.PI / 2; water.position.set(0, -0.3, -245); scene.add(water);

  /* roads (shared dashed-line texture) */
  const rc = document.createElement("canvas"); rc.width = 128; rc.height = 128;
  const rg = rc.getContext("2d");
  rg.fillStyle = "#2f3336"; rg.fillRect(0, 0, 128, 128);
  rg.fillStyle = "#eee9cf"; rg.fillRect(62, 0, 4, 64); rg.fillRect(4, 0, 3, 128); rg.fillRect(121, 0, 3, 128);
  const roadTex = new THREE.CanvasTexture(rc);
  roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping; roadTex.repeat.set(1, W / 12); roadTex.colorSpace = THREE.SRGBColorSpace; roadTex.anisotropy = 4;
  const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.92 });
  const roadGeo = new THREE.PlaneGeometry(CFG.road, W);
  const vRoad = new THREE.Mesh(roadGeo, roadMat); vRoad.rotation.x = -Math.PI / 2; vRoad.position.y = 0.01; vRoad.receiveShadow = true; scene.add(vRoad);
  const hGroup = new THREE.Group(); hGroup.rotation.y = Math.PI / 2;
  const hRoad = new THREE.Mesh(roadGeo, roadMat); hRoad.rotation.x = -Math.PI / 2; hRoad.position.y = 0.012; hRoad.receiveShadow = true; hGroup.add(hRoad); scene.add(hGroup);
  const cross = new THREE.Mesh(new THREE.PlaneGeometry(CFG.road, CFG.road), mat("#2f3336", 0.92));
  cross.rotation.x = -Math.PI / 2; cross.position.y = 0.02; cross.receiveShadow = true; scene.add(cross);

  /* crosswalk stripes */
  const stripeM = [];
  const tmp = new THREE.Matrix4();
  for (let i = -4; i <= 4; i++) {

const buses = [];
function buildTraffic() {
  const defs = [
    { axis: "z", lane: 3, dir: 1, speed: 8, off: -60 }, { axis: "z", lane: -3, dir: -1, speed: 7, off: 40 },
    { axis: "x", lane: 3, dir: -1, speed: 7.5, off: 30 }, { axis: "x", lane: -3, dir: 1, speed: 8.5, off: -50 },

    const b = { ...d, mesh: m, t: d.off };

function updateTraffic(dt) {

function pushOutOfBuses(pos, r) {
  for (const b of buses) {

      const cx = b.mesh.position.x + ax * o, cz = b.mesh.position.z + az * o;

function refreshTag() {
  if (!player.char) return;
  if (player.tag) { player.char.root.remove(player.tag); player.tag.material.map.dispose(); player.tag.material.dispose(); }
  player.tag = makeNameTag(state.name);
  player.char.root.add(player.tag);
}
function rebuildPlayer() {
  if (player.char) scene.remove(player.char.root);

function resolveCollisions(pos, r) {
  for (const b of colliders) {
    const cx = clamp(pos.x, b.x0, b.x1), cz = clamp(pos.z, b.z0, b.z1);
    const dx = pos.x - cx, dz = pos.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2), push = r - d; pos.x += dx / d * push; pos.z += dz / d * push; }
    else {
      const l = pos.x - b.x0, rr = b.x1 - pos.x, t = pos.z - b.z0, bt = b.z1 - pos.z, m = Math.min(l, rr, t, bt);
      if (m === l) pos.x = b.x0 - r; else if (m === rr) pos.x = b.x1 + r; else if (m === t) pos.z = b.z0 - r; else pos.z = b.z1 + r;
    }
  }
}

function getInput() {
  let x = 0, z = 0;
  if (state.keys.left) x -= 1; if (state.keys.right) x += 1;
  if (state.keys.up) z -= 1; if (state.keys.down) z += 1;
  if (state.joy.active) { x = state.joy.x; z = state.joy.y; }
  const mag = Math.hypot(x, z);
  if (mag > 1) { x /= mag; z /= mag; }
  return { x, z, mag: Math.min(mag, 1) };
}

const fwd = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();
let runBlend = false;

function updatePlayer(dt) {
  const inp = getInput();
  const hasInput = inp.mag > 0.08;
  if (hasInput || state.jumpQueued) state.emote = null;

  const wantRun = state.keys.shift || state.runToggle || (state.joy.active && inp.mag > 0.92);
  runBlend = wantRun;
  const top = wantRun ? CFG.run : CFG.walk;
  const sp = hasInput ? top * (state.joy.active ? clamp(inp.mag * 1.15, 0.35, 1) : 1) : 0;

  fwd.set(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw));
  right.set(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
  wish.set(0, 0, 0).addScaledVector(right, inp.x).addScaledVector(fwd, -inp.z);
  if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(sp);

  const k = hasInput ? CFG.accel : CFG.decel;
  player.vel.x = damp(player.vel.x, wish.x, k, dt);
  player.vel.z = damp(player.vel.z, wish.z, k, dt);

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  player.pos.x = clamp(player.pos.x, -CFG.limit, CFG.limit);
  player.pos.z = clamp(player.pos.z, -CFG.limit, CFG.limit);
  resolveCollisions(player.pos, CFG.radius);
  pushOutOfBuses(player.pos, CFG.radius);

  if (player.pos.y <= 0.001 && state.jumpQueued) { player.vy = CFG.jump; }
  state.jumpQueued = false;
  player.vy -= CFG.gravity * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y < 0) { player.pos.y = 0; player.vy = 0; }

  const spd = Math.hypot(player.vel.x, player.vel.z);
  if (spd > 0.4) player.yaw += angDiff(player.yaw, Math.atan2(player.vel.x, player.vel.z)) * Math.min(1, CFG.turn * dt);

  const air = player.pos.y > 0.04;
  state.status = air ? "Jumping" : state.emote ? "Emote" : spd > 4.6 ? "Running" : spd > 0.4 ? "Walking" : "Idle";
  player.char.root.position.copy(player.pos);
  player.char.root.rotation.y = player.yaw;
  animateCharacter(player.char, dt, { speed: spd, air, emote: state.emote });
}

function updateViewerPlayer(dt) {
  player.vel.set(0, 0, 0);
  const pose = viewer.pose;
  const speed = pose === "walk" ? 2.6 : pose === "run" ? 6.2 : 0;
  const emote = pose === "wave" || pose === "dance" ? pose : null;
  player.char.root.position.copy(player.pos);
  player.char.root.rotation.y = player.yaw;
  animateCharacter(player.char, dt, { speed, emote });
  state.status = "Viewing";
}

========================================================= */
const camTarget = new THREE.Vector3(), camDesired = new THREE.Vector3(), camDir = new THREE.Vector3();
const camSmoothTarget = new THREE.Vector3(0, 1.5, 0), camPos = new THREE.Vector3(0, 3, 8);
let camInit = false;

function rayHit(ox, oy, oz, dx, dy, dz, maxT, margin) {
  let best = maxT;
  for (const b of colliders) {
    if (!b.building) continue;
    let tmin = 0, tmax = maxT, ok = true;
    for (const ax of [0, 1]) {
      const o = ax ? oz : ox, d = ax ? dz : dx, lo = (ax ? b.z0 : b.x0) - margin, hi = (ax ? b.z1 : b.x1) + margin;
      if (Math.abs(d) < 1e-6) { if (o < lo || o > hi) { ok = false; break; } }
      else { let t1 = (lo - o) / d, t2 = (hi - o) / d; if (t1 > t2) { const s = t1; t1 = t2; t2 = s; } tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if (tmin > tmax) { ok = false; break; } }
    }
    if (!ok) continue;
    if (oy + dy * tmin > b.y1 + margin) continue;
    if (tmin < best) best = tmin;
  }
  return best;
}

function placeOrbitCamera(target, yaw, pitch, dist, dt, followK) {
  const cp = Math.cos(pitch);
  camDir.set(Math.sin(yaw) * cp, Math.sin(pitch), Math.cos(yaw) * cp);
  const hit = rayHit(target.x, target.y, target.z, camDir.x, camDir.y, camDir.z, dist, 0.35);
  const d = Math.max(0.9, Math.min(dist, hit - 0.2));
  camDesired.copy(target).addScaledVector(camDir, d);
  camDesired.y = Math.max(camDesired.y, 0.35);
  camPos.lerp(camDesired, 1 - Math.exp(-followK * dt));
  camSmoothTarget.lerp(target, 1 - Math.exp(-(followK + 4) * dt));
  camera.position.copy(camPos);
  camera.lookAt(camSmoothTarget);
}

function updateCamera(dt) {
  if (!camInit) { camPos.set(player.pos.x, 3.5, player.pos.z + 7); camSmoothTarget.set(player.pos.x, 1.5, player.pos.z); camInit = true; }
  if (state.mode === "viewer") {
    if (viewer.spin && performance.now() / 1000 - viewer.lastDrag > 1.5) viewer.yaw += dt * 0.55;
    const pr = viewer.preset;
    const wantDist = pr === "face" ? 1.7 : 4.6, wantTy = pr === "face" ? 1.58 : 1.0;
    viewer.dist = damp(viewer.dist, viewer.userDist ?? wantDist, 6, dt);
    viewer.ty = damp(viewer.ty, wantTy, 6, dt);
    camTarget.set(player.pos.x, player.pos.y + viewer.ty, player.pos.z);
    placeOrbitCamera(camTarget, viewer.yaw, viewer.pitch, viewer.dist, dt, 9);
  } else if (cam.mode === "first") {
    const hy = player.pos.y + 1.62, cp = Math.cos(cam.pitch);
    camera.position.set(player.pos.x - Math.sin(cam.yaw) * 0.1, hy, player.pos.z - Math.cos(cam.yaw) * 0.1);
    camDir.set(-Math.sin(cam.yaw) * cp, -Math.sin(cam.pitch), -Math.cos(cam.yaw) * cp);
    camera.lookAt(camera.position.x + camDir.x, camera.position.y + camDir.y, camera.position.z + camDir.z);
    camPos.copy(camera.position); camSmoothTarget.set(camera.position.x + camDir.x, camera.position.y + camDir.y, camera.position.z + camDir.z);
  } else {
    camTarget.set(player.pos.x, player.pos.y + 1.45, player.pos.z);
    const d = cam.mode === "far" ? cam.dist * 1.8 : cam.dist;
    placeOrbitCamera(camTarget, cam.yaw, cam.pitch, d, dt, 10);
  }

  /* shift the avatar out from behind the customizer sheet */
  const open = $("customizer").classList.contains("open");
  const wide = innerWidth >= 800;
  viewer.shiftY = damp(viewer.shiftY, open && !wide ? innerHeight * 0.2 : 0, 8, dt);
  viewer.shiftX = damp(viewer.shiftX, open && wide ? innerWidth * 0.15 : 0, 8, dt);
  if (Math.abs(viewer.shiftY) + Math.abs(viewer.shiftX) > 0.5) camera.setViewOffset(innerWidth, innerHeight, viewer.shiftX, viewer.shiftY, innerWidth, innerHeight);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
}

function updateSun() {
  sun.position.set(player.pos.x + sunDir.x * 45, player.pos.y + sunDir.y * 45, player.pos.z + sunDir.z * 45);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();
  stars.position.copy(camera.position);
}

/* =========================================================
   MINIMAP
========================================================= */
const mm = $("minimap"), mx = mm.getContext("2d");
mm.width = mm.height = 220;
function drawMinimap() {
  const S = 2.6, M = 220;
  mx.clearRect(0, 0, M, M);
  mx.save();
  mx.beginPath(); mx.arc(M / 2, M / 2, M / 2, 0, Math.PI * 2); mx.clip();
  mx.fillStyle = "#2f5a45"; mx.fillRect(0, 0, M, M);
  const theta = -Math.PI / 2 - Math.atan2(-Math.cos(cam.yaw), -Math.sin(cam.yaw));
  mx.save();
  mx.translate(M / 2, M / 2); mx.rotate(theta); mx.scale(S, S); mx.translate(-player.pos.x, -player.pos.z);
  mx.fillStyle = "#2c3033"; mx.fillRect(-6, -100, 12, 200); mx.fillRect(-100, -6, 200, 12);
  mx.fillStyle = "#b9ab8d";
  for (const b of buildingRects) mx.fillRect(b.x0, b.z0, b.x1 - b.x0, b.z1 - b.z0);
  for (const p of poiList) { mx.fillStyle = p.color; mx.beginPath(); mx.arc(p.x, p.z, 2.6, 0, 7); mx.fill(); mx.strokeStyle = "#FFC20E"; mx.lineWidth = 0.7; mx.stroke(); }
  mx.fillStyle = "#ffffff";
  for (const n of npcs) { mx.beginPath(); mx.arc(n.pos.x, n.pos.z, 0.9, 0, 7); mx.fill(); }
  mx.fillStyle = "#f2b705";
  for (const b of buses) { mx.fillRect(b.mesh.position.x - 1, b.mesh.position.z - 1, 2, 2); }
  mx.restore();
  const ang = Math.atan2(Math.cos(player.yaw), Math.sin(player.yaw)) + theta;
  mx.translate(M / 2, M / 2); mx.rotate(ang);
  mx.fillStyle = "#FFC20E"; mx.strokeStyle = "#14201F"; mx.lineWidth = 3;
  mx.beginPath(); mx.moveTo(12, 0); mx.lineTo(-8, 8); mx.lineTo(-4, 0); mx.lineTo(-8, -8); mx.closePath(); mx.fill(); mx.stroke();
  mx.restore();
}

/* =========================================================
   UI
========================================================= */
let toastTimer = 0;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

function refreshSelected() {
  document.querySelectorAll("#sections [data-key]").forEach(b => b.classList.toggle("selected", state.cfg[b.dataset.key] === b.dataset.val));
}
function buildCustomizer() {
  const host = $("sections"); host.innerHTML = "";
  for (const [key, def] of Object.entries(OPTIONS)) {
    const sec = document.createElement("div"); sec.className = "section";
    const title = document.createElement("div"); title.className = "sectionTitle"; title.textContent = def.label; sec.appendChild(title);
    const row = document.createElement("div"); row.className = "options";
    for (const [val, label] of Object.entries(def.values)) {
      const b = document.createElement("button"); b.type = "button"; b.dataset.key = key; b.dataset.val = val;
      if (def.kind === "swatch") {
        b.className = "swatch"; b.setAttribute("aria-label", `${def.label} ${val}`);
        b.style.background = label === "default" ? "repeating-linear-gradient(45deg,#ddd 0 6px,#888 6px 12px)" : label;
      } else { b.className = "option"; b.textContent = label; }
      b.addEventListener("click", () => { state.cfg[key] = val; refreshSelected(); rebuildPlayer(); });
      row.appendChild(b);
    }
    sec.appendChild(row); host.appendChild(sec);
  }
  refreshSelected();
}

function enterViewer(preset = "full") {
  state.mode = "viewer"; state.emote = null;
  document.body.classList.add("viewer");
  $("emoteMenu").classList.remove("open");
  viewer.preset = preset; viewer.pose = "idle"; viewer.userDist = undefined;
  player.yaw = 0; player.vel.set(0, 0, 0);
  viewer.yaw = 0; viewer.pitch = 0.08; viewer.lastDrag = performance.now() / 1000 - 10;
  player.char.root.visible = true;
  syncViewerButtons();
}
function exitViewer() {
  state.mode = "play";
  document.body.classList.remove("viewer");
  $("customizer").classList.remove("open");
  cam.yaw = viewer.yaw + Math.PI * 0 ; cam.yaw = player.yaw + Math.PI;
  player.char.root.visible = cam.mode !== "first";
}
function syncViewerButtons() {
  document.querySelectorAll("#viewerBar [data-preset]").forEach(b => b.classList.toggle("on", b.dataset.preset === viewer.preset));
  document.querySelectorAll("#viewerBar [data-pose]").forEach(b => b.classList.toggle("on", b.dataset.pose === viewer.pose));
  $("spinBtn").classList.toggle("on", viewer.spin);
}

$("viewBtn").addEventListener("click", () => enterViewer("full"));
$("viewerClose").addEventListener("click", exitViewer);
$("spinBtn").addEventListener("click", () => { viewer.spin = !viewer.spin; syncViewerButtons(); });
document.querySelectorAll("#viewerBar [data-preset]").forEach(b => b.addEventListener("click", () => {
  viewer.preset = b.dataset.preset; viewer.userDist = undefined;
  if (viewer.preset === "back") { viewer.preset = "full"; viewer.yaw = Math.PI; viewer.lastDrag = performance.now() / 1000; }
  else if (viewer.preset === "full" || viewer.preset === "face") { viewer.yaw = 0; viewer.lastDrag = performance.now() / 1000; }
  syncViewerButtons();
}));
document.querySelectorAll("#viewerBar [data-pose]").forEach(b => b.addEventListener("click", () => { viewer.pose = b.dataset.pose; syncViewerButtons(); }));

$("customizeBtn").addEventListener("click", () => { enterViewer("full"); $("customizer").classList.add("open"); });
$("closeCustomizer").addEventListener("click", () => $("customizer").classList.remove("open"));
$("randomBtn").addEventListener("click", () => {
  for (const key of Object.keys(DEFAULT_CFG)) { const ks = Object.keys(OPTIONS[key].values); state.cfg[key] = ks[Math.floor(Math.random() * ks.length)]; }
  refreshSelected(); rebuildPlayer();
});
$("saveConfig").addEventListener("click", saveAvatar);

$("cameraBtn").addEventListener("click", () => {
  const order = ["chase", "far", "first"], labels = { chase: "3rd", far: "Far", first: "1st" };
  cam.mode = order[(order.indexOf(cam.mode) + 1) % 3];
  $("cameraBtn").textContent = labels[cam.mode];
  if (cam.mode === "first") cam.pitch = 0.05; else if (cam.pitch < 0.15) cam.pitch = 0.28;
  player.char.root.visible = cam.mode !== "first";
  toast(cam.mode === "chase" ? "Third-person view" : cam.mode === "far" ? "Wide third-person view" : "First-person view");
});
$("qualityBtn").addEventListener("click", () => {
  state.quality = state.quality === "high" ? "low" : "high";
  localStorage.setItem("nh_quality", state.quality);
  applyQuality(); toast(state.quality === "high" ? "Graphics: High" : "Graphics: Low (faster)");
});
$("backBtn").addEventListener("click", () => { location.href = "index.html"; });
$("prompt").addEventListener("click", enterPlace);

$("emoteBtn").addEventListener("click", () => $("emoteMenu").classList.toggle("open"));
document.querySelectorAll("#emoteMenu [data-emote]").forEach(b => b.addEventListener("click", () => { state.emote = b.dataset.emote; $("emoteMenu").classList.remove("open"); }));

/* ---------- joystick + buttons ---------- */
const joy = $("joystick"), stick = $("stick");
let joyId = null;
function setJoy(cx, cy) {
  const r = joy.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  let x = cx - ox, y = cy - oy; const rad = r.width * 0.34, d = Math.hypot(x, y);
  if (d > rad) { x = x / d * rad; y = y / d * rad; }
  state.joy.x = x / rad; state.joy.y = y / rad;
  stick.style.transform = `translate(${x}px,${y}px)`;
}
function resetJoy() { joyId = null; state.joy.active = false; state.joy.x = state.joy.y = 0; stick.style.transform = "translate(0,0)"; }
joy.addEventListener("pointerdown", e => { e.preventDefault(); joyId = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch {} state.joy.active = true; setJoy(e.clientX, e.clientY); });
joy.addEventListener("pointermove", e => { if (e.pointerId === joyId) setJoy(e.clientX, e.clientY); });
joy.addEventListener("pointerup", resetJoy); joy.addEventListener("pointercancel", resetJoy);
$("jumpBtn").addEventListener("pointerdown", e => { e.preventDefault(); state.jumpQueued = true; });
$("runBtn").addEventListener("pointerdown", e => { e.preventDefault(); state.runToggle = !state.runToggle; $("runBtn").classList.toggle("active", state.runToggle); });

/* ---------- camera drag / pinch / wheel ---------- */
const cv = renderer.domElement, pointers = new Map();
let pinch = 0;
function zoom(d) {
  if (state.mode === "viewer") { viewer.userDist = clamp((viewer.userDist ?? viewer.dist) + d, 1.2, 8); viewer.lastDrag = performance.now() / 1000; }
  else cam.dist = clamp(cam.dist + d, 2.8, 10);
}
cv.addEventListener("pointerdown", e => {
  try { cv.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
cv.addEventListener("pointermove", e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoom(-(d - pinch) * 0.02); pinch = d; return; }
  if (state.mode === "viewer") { viewer.yaw -= dx * 0.01; viewer.pitch = clamp(viewer.pitch + dy * 0.005, -0.25, 1.0); viewer.lastDrag = performance.now() / 1000; }
  else { cam.yaw -= dx * 0.006; cam.pitch = clamp(cam.pitch + dy * 0.004, cam.mode === "first" ? -1.2 : -0.05, cam.mode === "first" ? 1.2 : 1.15); }
});
const endPointer = e => pointers.delete(e.pointerId);
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY * 0.005); }, { passive: false });
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- keyboard ---------- */
const KEYMAP = { w: "up", arrowup: "up", s: "down", arrowdown: "down", a: "left", arrowleft: "left", d: "right", arrowright: "right", shift: "shift" };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (has(KEYMAP, k)) { state.keys[KEYMAP[k]] = true; e.preventDefault(); }
  if (k === " ") { state.jumpQueued = true; e.preventDefault(); }
  if (k === "e") enterPlace();
  if (k === "c") $("cameraBtn").click();
  if (k === "v") { if (state.mode === "viewer") exitViewer(); else enterViewer("full"); }
  if (k === "escape") { if ($("customizer").classList.contains("open")) $("customizer").classList.remove("open"); else if (state.mode === "viewer") exitViewer(); }
});
addEventListener("keyup", e => { const k = e.key.toLowerCase(); if (has(KEYMAP, k)) state.keys[KEYMAP[k]] = false; });
addEventListener("blur", () => { for (const k in state.keys) state.keys[k] = false; });

/* =========================================================
   PERSISTENCE (Supabase + local fallback)
========================================================= */
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BG_NAMES = { street_boy: "Street Boy", graduate: "Graduate", nepo_baby: "Nepo Baby", returnee: "Returnee" };
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, " ") : s;

function setPlayerInfo() {
  $("name").textContent = state.name;
  $("sub").textContent = state.sub;
  refreshTag();
}
async function loadPlayer() {
  try { const l = localStorage.getItem("nh_avatar"); if (l) state.cfg = sanitize(JSON.parse(l)); } catch {}
  rebuildPlayer(); refreshSelected();
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { setPlayerInfo(); return; }
    const { data, error } = await db.rpc("get_my_character");
    if (error || !data || !data.id) { setPlayerInfo(); return; }
    state.user = data; state.name = data.name; state.sub = `${cap1(data.district)} · ${BG_NAMES[data.background] || ""}`;
    setPlayerInfo();
    if (data.avatar) { state.cfg = sanitize(data.avatar); localStorage.setItem("nh_avatar", JSON.stringify(state.cfg)); rebuildPlayer(); refreshSelected(); }
  } catch { setPlayerInfo(); }
}
async function saveAvatar() {
  localStorage.setItem("nh_avatar", JSON.stringify(state.cfg));
  if (!state.user) { toast("Saved on this device. Log in to save it to your account."); return; }
  const { error } = await db.rpc("save_avatar", { p_avatar: state.cfg });
  toast(error ? "Saved on this device only. Run the avatar SQL in Supabase to save online." : "Avatar saved to your account");
  if (error) console.warn(error.message);
}

/* =========================================================
   MAIN LOOP
========================================================= */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(state.quality === "high" ? Math.min(devicePixelRatio, 2) : 1);
});

let last = performance.now(), mmTick = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt <= 0) return;
  const t = now / 1000;
  updateDayNight(dt);
  if (state.mode === "play") updatePlayer(dt); else updateViewerPlayer(dt);
  updateNPCs(dt); updateTraffic(dt); updatePlaces(dt, t);
  updateCamera(dt); updateSun();
  $("status").textContent = state.status;
  if ((mmTick++ & 1) === 0 && state.mode === "play") drawMinimap();
  renderer.render(scene, camera);
}

/* ---------- start ---------- */
buildWorld();
buildTraffic();
buildNPCs();
buildCustomizer();
applyQuality();
loadPlayer().finally(() => {
  requestAnimationFrame(frame);
  setTimeout(() => $("loading").classList.add("hidden"), 450);
});
</script>
