const geoCache=new Map(), matCache=new Map(), labelCache=new Map();

function geo(key,make){
  if(!geoCache.has(key)){
    geoCache.set(key,make());
  }
  return geoCache.get(key);
}

function mat(color,rough=.72,metal=0,opts={}){
  const k=`${color}|${rough}|${metal}|${JSON.stringify(opts)}`;

  if(matCache.has(k)){
    return matCache.get(k);
  }

  const m=new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal,
    ...opts
  });

  matCache.set(k,m);
  return m;
  }
function sphereG(r){return geo(`s${r}`,()=>new THREE.SphereGeometry(r,18,14))}
function capsuleG(r,l){return geo(`c\( {r}_ \){l}`,()=>new THREE.CapsuleGeometry(r,l,8,12))}
function cylG(rt,rb,h,s=12){return geo(`y\( {rt}_ \){rb}_\( {h}_ \){s}`,()=>new THREE.CylinderGeometry(rt,rb,h,s))}
function boxG(x,y,z){return geo(`b\( {x}_ \){y}_${z}`,()=>new THREE.BoxGeometry(x,y,z))}
function torusG(r,t,rs=10,ts=20,arc=Math.PI*2){return geo(`t\( {r}_ \){t}_\( {rs}_ \){ts}_${arc}`,()=>new THREE.TorusGeometry(r,t,rs,ts,arc))}

function labelTexture(text,color="#ffffff"){
  const key=`\( {text}| \){color}`;
  if(labelCache.has(key))return labelCache.get(key);
  const c=document.createElement("canvas");c.width=512;c.height=128;
  const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  x.font="900 42px system-ui";x.textAlign="center";x.textBaseline="middle";
  x.strokeStyle="rgba(0,0,0,.75)";x.lineWidth=12;x.strokeText(text,256,64);
  x.fillStyle=color;x.fillText(text,256,64);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  labelCache.set(key,tex);return tex;
}
function makeLabel(text,color="#fff",scale=1){
  const m=new THREE.SpriteMaterial({map:labelTexture(text,color),transparent:true,depthWrite:false});
  const s=new THREE.Sprite(m);s.scale.set(3.5*scale,.88*scale,1);return s;
}

function sanitize(raw){
  const out={...DEFAULT_CFG};
  if(!raw||typeof raw!=="object") return out;
  for(const k of Object.keys(DEFAULT_CFG)){
    if(has(OPTIONS,k)&&has(OPTIONS[k].values,raw[k])) out[k]=raw[k];
  }
  return out;
}

function addHair(root,cfg,headRadius){
  const hairColors={black:"#151313",darkBrown:"#2c1b14",brown:"#4b2c1e",burgundy:"#541d2c",blonde:"#d6ad65",grey:"#8d8d8d"};
  const hc=mat(hairColors[cfg.hairColor]||hairColors.black,.9);
  const style=cfg.hairstyle;
  if(style==="bald")return;
  if(style==="headwrap"){
    const wrap=new THREE.Mesh(sphereG(headRadius*1.05),mat("#d6ad65"));
    wrap.scale.set(1.02,.48,1.02);wrap.position.y=.20;root.add(wrap);
    const band=new THREE.Mesh(torusG(headRadius*.91,.065,10,28),mat("#8f641b"));
    band.rotation.x=Math.PI/2;band.position.y=.13;root.add(band);return;
  }
  if(style==="afro"){
    const hair=new THREE.Mesh(sphereG(headRadius*1.18),hc);
    hair.scale.set(1.04,.86,1.04);hair.position.y=.16;root.add(hair);
    const front=new THREE.Mesh(sphereG(headRadius*.72),hc);
    front.scale.set(1.05,.55,.72);front.position.set(0,.34,.20);root.add(front);return;
  }
  if(style==="high_top"){
    const sides=new THREE.Mesh(sphereG(headRadius*.98),hc);
    sides.scale.set(1,.55,.98);sides.position.y=.16;root.add(sides);
    const top=new THREE.Mesh(capsuleG(headRadius*.52,.34),hc);
    top.scale.set(1.12,1,.95);top.position.y=.40;root.add(top);return;
  }
  if(style==="twists"||style==="locs"||style==="braids"){
    const count=style==="braids"?12:style==="locs"?14:10;
    const length=style==="braids"?.30:style==="locs"?.34:.26;
    const cap=new THREE.Mesh(sphereG(headRadius*.98),hc);
    cap.scale.set(1,.62,1);cap.position.y=.17;root.add(cap);
    for(let i=0;i<count;i++){
      const a=i/count*Math.PI*2;
      const strand=new THREE.Mesh(capsuleG(.055,length),hc);
      strand.position.set(Math.cos(a)*headRadius*.78,.18,Math.sin(a)*headRadius*.78);
      strand.rotation.z=Math.cos(a)*.28;strand.rotation.x=-Math.sin(a)*.28;
      root.add(strand);
    }
    return;
  }
  const cap=new THREE.Mesh(sphereG(headRadius*1.015),hc);
  cap.scale.set(1,style==="fade"?.54:.64,1);cap.position.y=.20;root.add(cap);
  if(style==="fade"){
    const hairline=new THREE.Mesh(torusG(headRadius*.91,.035,8,28),hc);
    hairline.rotation.x=Math.PI/2;hairline.position.y=.08;root.add(hairline);
  }
}

  const head=new THREE.Group();head.position.y=1.12*height;spine.add(head);
  const headR=.36;

  const face=new THREE.Mesh(sphereG(headR),skin);face.scale.set(1,.99,.93);head.add(face);
  for(const x of [-.19,.19]){
    const cheek=new THREE.Mesh(sphereG(.16),skin);cheek.scale.set(.95,.82,.72);cheek.position.set(x,-.055,.255);head.add(cheek);

  for(const x of [-.345,.345]){

  for(const x of [-.125,.125]){

    const pupil=new THREE.Mesh(sphereG(.043),eyeMat);pupil.scale.set(.9,.95,.42);pupil.position.set(x,.045,.365);head.add(pupil);

  for(const x of [-.125,.125]){
    const brow=new THREE.Mesh(capsuleG(.025,.13),browMat);brow.rotation.z=x<0?.08:-.08;brow.position.set(x,.145,.335);head.add(brow);
  }
  const nose=new THREE.Mesh(sphereG(.075),skin);nose.scale.set(.72,.95,1.25);nose.position.set(0,-.035,.355);head.add(nose);
  const noseTip=new THREE.Mesh(sphereG(.055),skin);noseTip.scale.set(1,.72,.95);noseTip.position.set(0,-.09,.385);head.add(noseTip);
  const mouth=new THREE.Mesh(capsuleG(.035,.13),mat("#5a2925"));mouth.rotation.z=Math.PI/2;mouth.scale.set(1,.65,.55);mouth.position.set(0,-.165,.345);head.add(mouth);
  const lip=new THREE.Mesh(sphereG(.045),mat("#8b5148"));lip.scale.set(1.45,.48,.55);lip.position.set(0,-.205,.35);head.add(lip);

  addHair(head,cfg,headR);
  addBeard(head,cfg,headR);
  addAccessory(head,cfg,headR);
  addOutfitDetails(spine,cfg,.72*S);

  const pelvis=new THREE.Mesh(capsuleG(.30*W,.25*height),outfitMat);
  pelvis.scale.set(1.18*W,1,.82*W);pelvis.position.y=.05*height;hips.add(pelvis);

  const legs=[];
  for(const x of [-.20*W,.20*W]){

    const sole=new THREE.Mesh(boxG(.31*L,.045*height,.52*L),dark);sole.position.set(0,-1.09*height,.105);leg.add(sole);

  const arms=[];

  return {root,hips,spine,head,legs,arms,cfg,phase:Math.random()*Math.PI*2,time:0,blinkT:1,blink:false,pose:"idle",tag};
}

function animateCharacter(char,dt,opts){
  if(!char)return;
  char.time+=dt;
  const speed=opts.speed||0;
  const air=opts.air||false;
  const emote=opts.emote||null;
  const t=char.time;
  let legSwing=0,armSwing=0;
  if(speed>0.1&&!air){
    const freq=speed>4?10:7;
    legSwing=Math.sin(t*freq)*0.45;
    armSwing=Math.sin(t*freq+Math.PI)*0.35;
    char.pose="walk";
  }else if(emote==="wave"){
    char.arms[1].rotation.z=-1.2+Math.sin(t*6)*0.4;
    char.pose="wave";
  }else if(emote==="dance"){
    char.hips.position.y=1.02+Math.sin(t*8)*0.06;
    char.arms[0].rotation.z=0.6+Math.sin(t*6)*0.3;
    char.arms[1].rotation.z=-0.6-Math.sin(t*6)*0.3;
    char.pose="dance";
  }else if(emote==="cheer"){
    char.arms[0].rotation.z=-1.4;char.arms[1].rotation.z=1.4;
    char.pose="cheer";
  }else{
    char.pose="idle";
    char.hips.position.y=1.02+Math.sin(t*1.5)*0.015;
  }
  if(char.legs[0]&&char.legs[1]){
    char.legs[0].rotation.x=legSwing;char.legs[1].rotation.x=-legSwing;
  }
  if(char.arms[0]&&char.arms[1]&&!emote){
    char.arms[0].rotation.x=armSwing;char.arms[1].rotation.x=-armSwing;
  }
}

function rebuildPlayer(){
  if(player.char){scene.remove(player.char.root);player.char=null}
  player.char=createCharacter(state.cfg,{name:state.name,scale:CFG.avatarScale,tagColor:"#FFC20E"});
  player.char.root.position.copy(player.pos);
  player.char.root.rotation.y=player.yaw;
  scene.add(player.char.root);
  refreshTag();
}

function refreshTag(){
  if(player.char&&player.char.tag){
    player.char.tag.material.map=labelTexture(state.name||"Guest","#FFC20E");
    player.char.tag.material.needsUpdate=true;
  }
}

function buildWorld(){
  const ground=new THREE.Mesh(boxG(CFG.world*2,.4,CFG.world*2),mat("#355b43"));
  ground.position.y=-.22;ground.receiveShadow=true;scene.add(ground);
  const water=new THREE.Mesh(boxG(38,.08,CFG.world*2),mat("#397c8b",.25,.05));
  water.position.set(-78,-.02,0);scene.add(water);
  addRoad(0,0,CFG.world*2,CFG.road);
  addRoad(0,0,CFG.road,CFG.world*2);
  for(let sx=-2;sx<=2;sx++){
    for(let sz=-2;sz<=2;sz++){
      if(sx===0&&sz===0)continue;
      const px=sx*32,pz=sz*32;
      const key=`\( {sx}_ \){sz}`;
      const poi=ALL_PLACES.find(p=>`\( {p.sx}_ \){p.sz}`===key);
      if(poi)continue;
      for(let i=0;i<3;i++){
        const ox=(i-1)*8,oz=((i%2)?-5:5);
        const w=6+Math.random()*3,d=6+Math.random()*3,h=4+Math.random()*7;
        buildBuilding(px+ox,pz+oz,w,d,h,["#9c8c78","#b3a28b","#827d75","#a88b73"][Math.floor(Math.random()*4)]);
      }
    }
  }
  for(const p of PLACES)buildPlace(p);
  for(const p of SOCIAL_PLACES)buildSocialPlace(p);
  for(let i=0;i<42;i++){
    const x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;
    if(Math.abs(x)<10||Math.abs(z)<10)continue;
    const trunk=new THREE.Mesh(cylG(.13,.18,1.7),mat("#5b3a25"));
    trunk.position.set(x,.85,z);trunk.castShadow=true;scene.add(trunk);
    const leaf=new THREE.Mesh(sphereG(1.25),mat("#2d7349"));
    leaf.position.set(x,2.1,z);leaf.scale.y=1.15;leaf.castShadow=true;scene.add(leaf);
  }
  for(let i=-80;i<=80;i+=10){
    for(const z of [-7,7]){
      const pole=new THREE.Mesh(cylG(.06,.07,3.2),mat("#343434",.65,.25));
      pole.position.set(i,1.6,z);scene.add(pole);
      const lamp=new THREE.Mesh(sphereG(.13),new THREE.MeshBasicMaterial({color:"#ffe8a2"}));
      lamp.position.set(i,3.15,z);scene.add(lamp);
    }
  }
  const skyline=new THREE.Group();
  for(let i=0;i<32;i++){
    const x=(Math.random()-.5)*180,z=(Math.random()-.5)*180;
    if(Math.abs(x)<65&&Math.abs(z)<65)continue;
    const h=10+Math.random()*25,w=3+Math.random()*7,d=3+Math.random()*7;
    const b=new THREE.Mesh(boxG(w,h,d),mat("#53615f"));
    b.position.set(x,h/2,z);skyline.add(b);
  }
  scene.add(skyline);
}

/* ---------- traffic (danfo style) ---------- */
function buildBus(x,z,rot=0){
  const root=new THREE.Group();
  const body=new THREE.Mesh(boxG(2.2,1.25,4.6),mat("#FFC20E")); // danfo yellow
  body.position.y=.75;body.castShadow=true;root.add(body);
  const stripe=new THREE.Mesh(boxG(2.25,.18,4.65),mat("#111"));
  stripe.position.y=1.15;root.add(stripe);
  const roof=new THREE.Mesh(boxG(2.05,.16,4.2),mat("#ece6cf"));roof.position.y=1.42;root.add(roof);
  for(const sx of [-1.13,1.13])for(const sz of [-1.35,1.35]){
    const wh=new THREE.Mesh(cylG(.36,.36,.22),mat("#171717"));wh.rotation.z=Math.PI/2;wh.position.set(sx,.38,sz);root.add(wh);
  }
  root.position.set(x,0,z);root.rotation.y=rot;scene.add(root);
  buses.push({mesh:root,speed:2+Math.random()*2.5,axis:Math.random()<.5?"x":"z",dir:Math.random()<.5?-1:1});
}
function buildTraffic(){
  buildBus(-70,0);buildBus(60,0,Math.PI);buildBus(0,-70,Math.PI/2);buildBus(0,70,-Math.PI/2);
}
function updateTraffic(dt){
  for(const b of buses){
    if(b.axis==="x")b.mesh.position.x+=b.speed*b.dir*dt;
    else b.mesh.position.z+=b.speed*b.dir*dt;
    if(Math.abs(b.mesh.position.x)>94||Math.abs(b.mesh.position.z)>94)b.dir*=-1;
  }
}
function pushOutOfBuses(pos,r=.42){
  for(const b of buses){
    const q=b.mesh.position;
    const dx=pos.x-q.x,dz=pos.z-q.z;
    if(Math.abs(dx)<1.7&&Math.abs(dz)<2.8){
      const l=Math.hypot(dx,dz)||1;
      const push=2.1-l;
      if(push>0){pos.x+=dx/l*push;pos.z+=dz/l*push;}
    }
  }
}

/* ---------- NPCs ---------- */
const NPC_NAMES=["Chinedu","Amaka","Tobi","Zainab","Kelechi","Favour","Emeka","Bola","Ada","Ifeanyi","Mariam","Daniel"];
const NPC_PERSONALITIES=["friendly","ambitious","streetwise","creative","business","career"];
function randomCfg(){
  const c={...DEFAULT_CFG};
  for(const k of Object.keys(c)){
    const vals=Object.keys(OPTIONS[k].values);c[k]=vals[Math.floor(Math.random()*vals.length)];
  }
  return c;
}
function buildNPCs(){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,r=18+Math.random()*58;
    const npc={
      id:`npc_${i+1}`,
      name:NPC_NAMES[i%NPC_NAMES.length],
      personality:NPC_PERSONALITIES[i%NPC_PERSONALITIES.length],
      pos:new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),
      target:new THREE.Vector3(),
      speed:.7+Math.random()*.65,
      wait:Math.random()*3,
      char:createCharacter(randomCfg(),{name:NPC_NAMES[i%NPC_NAMES.length],scale:.74,tagColor:"#ffffff"})
    };
    npc.char.root.position.copy(npc.pos);scene.add(npc.char.root);
    npc.target.copy(npc.pos);
    npcs.push(npc);
  }
}
function chooseNpcTarget(n){
  const a=Math.random()*Math.PI*2,r=8+Math.random()*30;
  n.target.set(clamp(n.pos.x+Math.cos(a)*r,-78,78),0,clamp(n.pos.z+Math.sin(a)*r,-78,78));
}
function updateNPCs(dt){
  for(const n of npcs){
    n.wait-=dt;
    if(n.wait<=0){chooseNpcTarget(n);n.wait=3+Math.random()*6}
    const dx=n.target.x-n.pos.x,dz=n.target.z-n.pos.z,d=Math.hypot(dx,dz);
    if(d>.5){
      n.pos.x+=dx/d*n.speed*dt;n.pos.z+=dz/d*n.speed*dt;
      n.char.root.rotation.y=Math.atan2(dx,dz);
    }
    n.char.root.position.copy(n.pos);
    animateCharacter(n.char,dt,{speed:d>.5?n.speed:0,air:false,emote:null});
  }
}

/* ---------- day / night + rent ---------- */
let gameHour=8, gameDay=1;
function updateDayNight(dt){
  gameHour=(gameHour+dt*(24/(CFG.dayMinutes*60)))%24;
  if(gameHour<0.05&&dt>0){ // new day roughly
    gameDay++;
    state.rentDueIn=Math.max(0,state.rentDueIn-1);
    if(state.rentDueIn<=0){
      const rent=HOUSING[state.housingLevel].rent;
      if(state.money>=rent){
        state.money-=rent;
        state.rentDueIn=14;
        toast(`Rent paid: ₦${rent.toLocaleString()}. Next due in 14 days.`);
        updateHUD();
      }else{
        toast("Rent overdue! Find work or you'll lose housing.");
      }
    }
  }
  const h=gameHour;
  let sky="#78a9b8";
  if(h<6||h>20)sky="#11182b";
  else if(h<8||h>18)sky="#d18b67";
  scene.background.lerp(new THREE.Color(sky),.04);
  scene.fog.color.copy(scene.background);
  const daylight=clamp(Math.sin((h-6)/12*Math.PI),0,1);
  sun.intensity=.35+daylight*2.2;
  hemi.intensity=.45+daylight*1.2;
  moon.intensity=.12+(1-daylight)*.55;
  sunDir.set(Math.cos((h-12)/24*Math.PI*2),Math.sin((h-6)/12*Math.PI),.25).normalize();
  \( ("clock").textContent=` \){((Math.floor(h)+11)%12)+1}:${String(Math.floor((h%1)*60)).padStart(2,"0")} ${h<12?"AM":"PM"}`;
  stars.visible=daylight<.3;
}

/* ---------- movement ---------- */
function resolveCollisions(pos,r){
  for(const b of colliders){
    if(!b.building||pos.y>b.y1)continue;
    const cx=clamp(pos.x,b.x0,b.x1);
    const cz=clamp(pos.z,b.z0,b.z1);
    const dx=pos.x-cx,dz=pos.z-cz;
    const dist=Math.hypot(dx,dz);
    if(dist<r&&dist>0){
      const push=(r-dist)/dist;
      pos.x+=dx*push;pos.z+=dz*push;
    }
  }
}
function updatePlayer(dt){
  const run=state.keys.shift||state.runToggle;
  const speed=run?CFG.run:CFG.walk;
  wish.set(0,0,0);
  if(state.keys.up||state.joy.y<-.2)wish.z-=1;
  if(state.keys.down||state.joy.y>.2)wish.z+=1;
  if(state.keys.left||state.joy.x<-.2)wish.x-=1;
  if(state.keys.right||state.joy.x>.2)wish.x+=1;
  if(wish.lengthSq()>0)wish.normalize();
  const camYaw=cam.yaw;
  fwd.set(-Math.sin(camYaw),0,-Math.cos(camYaw));
  right.set(Math.cos(camYaw),0,-Math.sin(camYaw));
  const dir=new THREE.Vector3();
  dir.addScaledVector(fwd,-wish.z);
  dir.addScaledVector(right,wish.x);
  if(dir.lengthSq()>0){
    dir.normalize();
    player.vel.x=damp(player.vel.x,dir.x*speed,CFG.accel,dt);
    player.vel.z=damp(player.vel.z,dir.z*speed,CFG.accel,dt);
    player.yaw=Math.atan2(dir.x,dir.z);
  }else{
    player.vel.x=damp(player.vel.x,0,CFG.decel,dt);
    player.vel.z=damp(player.vel.z,0,CFG.decel,dt);
  }
  if(state.jumpQueued&&player.pos.y<=0.05){
    player.vy=CFG.jump;state.jumpQueued=false;
  }
  player.vy-=CFG.gravity*dt;
  player.pos.x+=player.vel.x*dt;
  player.pos.z+=player.vel.z*dt;
  player.pos.y+=player.vy*dt;
  if(player.pos.y<0){player.pos.y=0;player.vy=0}
  player.pos.x=clamp(player.pos.x,-CFG.limit,CFG.limit);
  player.pos.z=clamp(player.pos.z,-CFG.limit,CFG.limit);
  resolveCollisions(player.pos,CFG.radius);
  pushOutOfBuses(player.pos);
  if(player.char){
    player.char.root.position.copy(player.pos);
    player.char.root.rotation.y=player.yaw;
    const spd=Math.hypot(player.vel.x,player.vel.z);
    animateCharacter(player.char,dt,{speed:spd,air:player.pos.y>0.1,emote:state.emote});
    state.status=spd>4?"Running":spd>0.3?"Walking":state.emote||"Idle";
  }
}

function updateViewerPlayer(dt){
  if(!player.char)return;
  animateCharacter(player.char,dt,{speed:viewer.pose==="walk"?2:viewer.pose==="run"?5:0,air:false,emote:viewer.pose==="wave"||viewer.pose==="dance"?viewer.pose:null});
  if(viewer.spin)viewer.yaw+=dt*0.8;
}

function updateCamera(dt){
  if(state.mode==="viewer"){
    const dist=viewer.userDist??viewer.dist;
    const target=player.pos.clone().add(new THREE.Vector3(0,1.4,0));
    const ox=Math.sin(viewer.yaw)*dist;
    const oz=Math.cos(viewer.yaw)*dist;
    const oy=Math.sin(viewer.pitch)*dist*0.6+1.2;
    camera.position.lerp(target.clone().add(new THREE.Vector3(ox,oy,oz)),1-Math.exp(-8*dt));
    camera.lookAt(target);
    return;
  }
  const dist=cam.mode==="far"?8.5:cam.mode==="first"?0.15:cam.dist;
  const target=player.pos.clone().add(new THREE.Vector3(0,cam.mode==="first"?1.55:1.35,0));
  if(cam.mode==="first"){
    camera.position.copy(target);
    camera.rotation.order="YXZ";
    camera.rotation.y=player.yaw+Math.PI;
    camera.rotation.x=cam.pitch;
  }else{
    const ox=Math.sin(cam.yaw)*dist;
    const oz=Math.cos(cam.yaw)*dist;
    const oy=Math.sin(cam.pitch)*dist*0.7+1.5;
    camera.position.lerp(target.clone().add(new THREE.Vector3(ox,oy,oz)),1-Math.exp(-6*dt));
    camera.lookAt(target);
  }
}

function updateSun(){
  sun.position.copy(player.pos).add(sunDir.clone().multiplyScalar(40));
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();
}

function updatePlaces(dt,t){
  let nearest=null,nd=8;
  for(const p of poiList){
    const d=Math.hypot(p.x-player.pos.x,p.z-player.pos.z);
    if(d<nd){nd=d;nearest=p}
  }
  const prompt=$("prompt");
  if(nearest&&state.mode==="play"&&!$("socialPanel").classList.contains("open")){
    prompt.textContent=nearest.kind==="home"?"Enter Home":`Enter ${nearest.name}`;
    prompt.classList.add("show");
    prompt.onclick=()=>enterPlace(nearest);
  }else if(!nearbySocialNpc){
    prompt.classList.remove("show");
  }
  for(const m of markers){
    m.ring.rotation.z=t*0.6;
    m.label.position.y=m.base+Math.sin(t*2)*0.08;
  }
}

function enterPlace(p){
  if(!p)return;
  if(p.kind==="home"){
    toast("You're home. Rest, plan, or upgrade your housing.");
    openHousingPanel();
  }else if(p.kind==="career"){
    const pay=1500+Math.floor(Math.random()*2500);
    state.money+=pay;
    updateHUD();
    toast(`You worked a shift. Earned ₦${pay.toLocaleString()}`);
  }else if(p.kind==="market"){
    toast("Market Plaza — buy clothes, food, or hustle supplies here soon.");
  }else{
    toast(`Entered ${p.name}`);
  }
}

/* ---------- HUD + housing ---------- */
function updateHUD(){
  $("money").textContent=state.money.toLocaleString();
  $("housingPill").textContent=HOUSING[state.housingLevel].name.split(" ")[0];
  $("name").textContent=state.name;
  $("sub").textContent=state.sub;
}

function openHousingPanel(){
  const levels=$("housingLevels");
  levels.innerHTML="";
  HOUSING.forEach((h,i)=>{
    const div=document.createElement("div");
    div.className="housingLevel"+(i===state.housingLevel?" current":"")+(i>state.housingLevel+1?" locked":"");
    div.innerHTML=`<b>\( {h.name}</b><span style="font-size:12px;color:var(--muted)">Rent ₦ \){h.rent.toLocaleString()}/14 days · Upgrade ₦${h.cost.toLocaleString()}</span>`;
    levels.appendChild(div);
  });
  $("housingDesc").textContent=`Current: ${HOUSING[state.housingLevel].name}. Rent due in ${state.rentDueIn} days. ${HOUSING[state.housingLevel].desc}`;
  $("housingPanel").classList.add("open");
}

function tryUpgradeHousing(){
  const next=state.housingLevel+1;
  if(next>=HOUSING.length){toast("You already have the best housing.");return}
  const cost=HOUSING[next].cost;
  if(state.money<cost){toast(`Need ₦${cost.toLocaleString()} to upgrade.`);return}
  state.money-=cost;
  state.housingLevel=next;
  state.rentDueIn=14;
  updateHUD();
  toast(`Upgraded to ${HOUSING[next].name}!`);
  openHousingPanel();
  saveLocalProgress();
}

/* ---------- minimap ---------- */
function drawMinimap(){
  const c=$("minimap");
  const mx=c.getContext("2d");
  const M=200;
  c.width=M;c.height=M;
  mx.fillStyle="#1b241f";mx.fillRect(0,0,M,M);
  mx.strokeStyle="rgba(255,255,255,.08)";
  for(let i=0;i<M;i+=20){mx.beginPath();mx.moveTo(i,0);mx.lineTo(i,M);mx.stroke();mx.beginPath();mx.moveTo(0,i);mx.lineTo(M,i);mx.stroke()}
  const scale=M/(CFG.world*1.1);
  const ox=M/2-player.pos.x*scale,oy=M/2-player.pos.z*scale;
  for(const p of poiList){
    mx.fillStyle=p.color;
    mx.beginPath();mx.arc(ox+p.x*scale,oy+p.z*scale,5,0,Math.PI*2);mx.fill();
  }
  mx.save();
  mx.translate(M/2,M/2);mx.rotate(player.yaw);
  mx.fillStyle="#FFC20E";mx.strokeStyle="#14201F";mx.lineWidth=2;
  mx.beginPath();mx.moveTo(10,0);mx.lineTo(-7,7);mx.lineTo(-3,0);mx.lineTo(-7,-7);mx.closePath();mx.fill();mx.stroke();
  mx.restore();
}

/* ---------- UI helpers ---------- */
let toastTimer=0;
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}
function refreshSelected(){
  document.querySelectorAll("#sections [data-key]").forEach(b=>b.classList.toggle("selected",state.cfg[b.dataset.key]===b.dataset.val));
}
function buildCustomizer(){
  const host=$("sections");host.innerHTML="";
  for(const [key,def] of Object.entries(OPTIONS)){
    const sec=document.createElement("div");sec.className="section";
    const title=document.createElement("div");title.className="sectionTitle";title.textContent=def.label;sec.appendChild(title);
    const row=document.createElement("div");row.className="options";
    for(const [val,label] of Object.entries(def.values)){
      const b=document.createElement("button");b.type="button";b.dataset.key=key;b.dataset.val=val;
      if(def.kind==="swatch"){
        b.className="swatch";b.setAttribute("aria-label",`${def.label} ${val}`);
        b.style.background=label==="default"?"repeating-linear-gradient(45deg,#ddd 0 6px,#888 6px 12px)":label;
      }else{b.className="option";b.textContent=label}
      b.addEventListener("click",()=>{state.cfg[key]=val;refreshSelected();rebuildPlayer()});
      row.appendChild(b);
    }
    sec.appendChild(row);host.appendChild(sec);
  }
  refreshSelected();
}

function relationLevel(id){return state.relationships[id]||0}
function addRelationship(n,amount){state.relationships[n.id]=clamp(relationLevel(n.id)+amount,0,100)}
function addOpportunity(name){
  if(!name)return;
  if(!state.opportunities.some(o=>o.name===name)){
    state.opportunities.unshift({name,from:state.activeNpc?.name||"Unknown",at:Date.now()});
    if(state.opportunities.length>20)state.opportunities.pop();
    toast(`New opportunity: ${name}`);
  }
}
function openConversation(npc){
  if(!npc)return;
  state.activeNpc=npc;
  $("socialPanel").classList.add("open");
  setSocialTab("conversation");
  renderConversation(npc);
}
function renderConversation(npc){
  const body=$("socialBody");
  const d=DIALOGUES[npc.personality]||DIALOGUES.friendly;
  const level=relationLevel(npc.id);
  body.innerHTML="";
  const intro=document.createElement("div");intro.className="dialogueIntro";
  intro.innerHTML=`<div class="dialogueName">\( {npc.name}</div><div> \){d.intro(npc)}</div><div class="smallNote">Relationship: ${level}/100 · ${npc.personality}</div>`;
  body.appendChild(intro);
  const choices=document.createElement("div");choices.className="dialogueChoices";
  d.choices.forEach(c=>{
    const b=document.createElement("button");b.className="choice";b.textContent=c.text;
    b.addEventListener("click",()=>{
      addRelationship(npc,c.rel||1);if(c.opp)addOpportunity(c.opp);
      body.innerHTML="";
      const response=document.createElement("div");response.className="dialogueIntro";
      response.innerHTML=`<div class="dialogueName">\( {npc.name}</div><div> \){c.reply}</div><div class="smallNote">Relationship: ${relationLevel(npc.id)}/100</div>`;
      body.appendChild(response);
      const again=document.createElement("button");again.className="choice";again.textContent="Continue talking";
      again.addEventListener("click",()=>renderConversation(npc));body.appendChild(again);
      const done=document.createElement("button");done.className="choice";done.textContent="End conversation";
      done.addEventListener("click",()=>setSocialTab("chat"));body.appendChild(done);
      saveLocalState();
    });
    choices.appendChild(b);
  });
  body.appendChild(choices);
}
function setSocialTab(tab){
  document.querySelectorAll(".socialTab").forEach(b=>b.classList.toggle("active",b.dataset.socialTab===tab));
  $("chatComposer").style.display=tab==="chat"?"flex":"none";
  if(tab==="conversation"&&state.activeNpc)renderConversation(state.activeNpc);
  else if(tab==="opportunities")renderOpportunities();
  else renderHustleChat();
}

function sendChat(){
  const input=$("chatInput");
  const text=input.value.trim();
  if(!text)return;
  state.socialMessages.push({who:state.name||"Guest",text,time:Date.now()});
  const lower=text.toLowerCase();
  let reply=null;
  if(lower.includes("job")||lower.includes("work"))reply="System: Check the Job Centre for career opportunities.";
  else if(lower.includes("business")||lower.includes("money"))reply="System: Talk to people around Computer Village.";
  else if(lower.includes("hello")||lower.includes("hi"))reply="Chinedu: Welcome to Naija Hustle. Keep moving.";
  else reply="System: Keep exploring. Conversations unlock leads.";
  if(reply){
    setTimeout(()=>{
      state.socialMessages.push({who:"Hustle System",text:reply,time:Date.now()});
      saveLocalState();
      if($("socialPanel").classList.contains("open")&&document.querySelector(".socialTab.active")?.dataset.socialTab==="chat")renderHustleChat();
    },500);
  }
  input.value="";saveLocalState();renderHustleChat();
}

/* ---------- joystick ---------- */
const joy=\( ("joystick"),stick= \)("stick");
let joyId=null;
function setJoy(cx,cy){
  const r=joy.getBoundingClientRect();
  const ox=r.left+r.width/2,oy=r.top+r.height/2;
  let x=cx-ox,y=cy-oy;
  const rad=r.width*.34,d=Math.hypot(x,y);
  if(d>rad){x=x/d*rad;y=y/d*rad}
  state.joy.x=x/rad;state.joy.y=y/rad;
  stick.style.transform=`translate(\( {x}px, \){y}px)`;
}
function resetJoy(){joyId=null;state.joy.active=false;state.joy.x=0;state.joy.y=0;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",e=>{e.preventDefault();joyId=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch{}state.joy.active=true;setJoy(e.clientX,e.clientY)});
joy.addEventListener("pointermove",e=>{if(e.pointerId===joyId)setJoy(e.clientX,e.clientY)});
joy.addEventListener("pointerup",resetJoy);joy.addEventListener("pointercancel",resetJoy);
$("jumpBtn").addEventListener("pointerdown",e=>{e.preventDefault();state.jumpQueued=true});
\( ("runBtn").addEventListener("pointerdown",e=>{e.preventDefault();state.runToggle=!state.runToggle; \)("runBtn").classList.toggle("active",state.runToggle)});

/* ---------- camera drag ---------- */
const cv=renderer.domElement;
const pointers=new Map();
let pinch=0;
function zoom(d){
  if(state.mode==="viewer"){
    viewer.userDist=clamp((viewer.userDist??viewer.dist)+d,1.2,8);
    viewer.lastDrag=performance.now()/1000;
  }else cam.dist=clamp(cam.dist+d,2.8,10);
}
cv.addEventListener("pointerdown",e=>{
  try{cv.setPointerCapture(e.pointerId)}catch{}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y)}
});
cv.addEventListener("pointermove",e=>{
  const p=pointers.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    zoom(-(d-pinch)*.02);pinch=d;return;
  }
  if(state.mode==="viewer"){
    viewer.yaw-=dx*.01;viewer.pitch=clamp(viewer.pitch+dy*.005,-.25,1);viewer.lastDrag=performance.now()/1000;
  }else{
    cam.yaw-=dx*.006;cam.pitch=clamp(cam.pitch+dy*.004,cam.mode==="first"?-1.2:-.05,cam.mode==="first"?1.2:1.15);
  }
});
const endPointer=e=>pointers.delete(e.pointerId);
cv.addEventListener("pointerup",endPointer);cv.addEventListener("pointercancel",endPointer);
cv.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY*.005)},{passive:false});
cv.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- nearby NPC talk ---------- */
let nearbySocialNpc=null;
function getNearbySocialNpc(maxDistance=3.4){
  let result=null,distance=maxDistance;
  npcs.forEach((npc,index)=>{
    if(!npc?.pos)return;
    const d=Math.hypot((npc.pos.x||0)-player.pos.x,(npc.pos.z||0)-player.pos.z);
    if(d<distance){distance=d;result={npc,index,distance}}
  });
  return result;
}
function updateSocialNpcPrompt(){
  if(state.mode!=="play"||state.activeNpc||$("socialPanel").classList.contains("open"))return;
  nearbySocialNpc=getNearbySocialNpc();
  if(!nearbySocialNpc)return;
  const prompt=$("prompt");
  prompt.textContent=`Talk to ${nearbySocialNpc.npc.name}`;
  prompt.classList.add("show");
  prompt.onclick=()=>openConversation(nearbySocialNpc.npc);
}

const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
function setPlayerInfo(){updateHUD();refreshTag()}
async function loadPlayer(){
  loadLocalState();loadLocalProgress();
  try{
    const l=localStorage.getItem("nh_avatar");
    if(l)state.cfg=sanitize(JSON.parse(l));
  }catch{}
  rebuildPlayer();refreshSelected();
  try{
    const {data:{session}}=await db.auth.getSession();
    if(!session){setPlayerInfo();return}
    const {data,error}=await db.rpc("get_my_character");
    if(error||!data||!data.id){setPlayerInfo();return}
    state.user=data;state.name=data.name;
    state.sub=`${(data.district||"Lagos")} · ${(data.background||"Hustler")}`;
    if(data.avatar){state.cfg=sanitize(data.avatar);localStorage.setItem("nh_avatar",JSON.stringify(state.cfg));rebuildPlayer();refreshSelected()}
    setPlayerInfo();
  }catch{setPlayerInfo()}
}
async function saveAvatar(){
  localStorage.setItem("nh_avatar",JSON.stringify(state.cfg));
  if(!state.user){toast("Saved on this device. Log in to save to your account.");return}
  const {error}=await db.rpc("save_avatar",{p_avatar:state.cfg});

}

/* ---------- resize + loop ---------- */

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    state.quality === "high"
      ? Math.min(devicePixelRatio, 2)
      : 1
  );
});


let last = performance.now();
let mmTick = 0;

function frame(now) {
  requestAnimationFrame(frame);

  const dt = Math.min(
    .05,
    (now - last) / 1000
  );

  last = now;

  if (dt <= 0) return;

  const t = now / 1000;

  updateDayNight(dt);

  if (state.mode === "play") {
    updatePlayer(dt);
  } else {
    updateViewerPlayer(dt);
  }

  updateNPCs(dt);
  updateTraffic(dt);
  updatePlaces(dt, t);
  updateSocialNpcPrompt();

  updateCamera(dt);
  updateSun();

  $("status").textContent =
    state.status;

  if (
    (mmTick++ & 1) === 0 &&
    state.mode === "play"
  ) {
    drawMinimap();
  }

  renderer.render(
    scene,
    camera
  );
}


/* ---------- start ---------- */

buildWorld();
buildTraffic();
buildNPCs();
buildCustomizer();
applyQuality();

loadPlayer().finally(() => {
  requestAnimationFrame(frame);

  setTimeout(() => {
    $("loading").classList.add("hidden");
  }, 450);
});
