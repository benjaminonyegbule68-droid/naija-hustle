      --ink:#14201F;
      --lagoon:#0F6B6F;
      --danfo:#FFC20E;
      --brick:#C2410C;
      --white:#fff;
      --muted:#667472;
      --line:#D7DFDD;
      --soft:#F5F7F6;
      --success:#087443;
      --danger:#B42318;
      --shadow:0 8px 30px rgba(20,32,31,.08);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{

      background:var(--bg);
      color:var(--ink);
      font-family:"Bricolage Grotesque",system-ui,sans-serif;
      line-height:1.45;
    }

    button,
    input,
    select{

    }

    button{
      cursor:pointer;
    }

    button:disabled{
      cursor:not-allowed;
      opacity:.55;
    }

    h1,
    h2,
    h3,
    p{
      margin-top:0;
    }

    h1,
    h2,
    h3{
      line-height:1.1;
    }

    .app{
      min-height:100vh;
    }

    .wrap{
      width:min(100% - 28px, 720px);
      margin:0 auto;
      padding:18px 0 110px;
    }

    .top{
      background:var(--white);
      position:sticky;
      top:0;
      z-index:20;
      box-shadow:0 2px 12px rgba(20,32,31,.08);
    }

    .top .in{
      width:min(100% - 28px, 720px);
      margin:auto;
      padding:13px 0 10px;
    }

    .stripe{
      height:5px;
      background:linear-gradient(
        90deg,
        var(--lagoon) 0 45%,
        var(--danfo) 45% 72%,
        var(--brick) 72% 100%
      );
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .cash{
      font-size:1.7rem;
      font-weight:800;
      margin:3px 0;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      width:max-content;
      padding:5px 9px;
      border-radius:999px;
      background:#E7F2F1;
      color:var(--lagoon);
      font-size:.75rem;
      font-weight:800;
    }

    .bar{
      height:8px;
      width:100%;
      overflow:hidden;
      background:#DDE5E3;
      border-radius:999px;
    }

    .bar i{
      display:block;
      height:100%;
      width:0;
      background:var(--lagoon);
      border-radius:inherit;
      transition:width .25s ease;
    }

    .card{
      background:var(--white);
      border:1px solid rgba(20,32,31,.06);
      border-radius:var(--radius);
      padding:17px;
      margin-bottom:14px;
      box-shadow:var(--shadow);
    }

    .card h2{
      font-size:1.08rem;
      margin-bottom:8px;
    }

    .mute{
      color:var(--muted);
    }

    .err,
    .ok,
    .lock{
      padding:12px 14px;
      border-radius:13px;
      margin-bottom:12px;
      font-size:.9rem;
      font-weight:600;
    }

    .err{
      color:var(--danger);
      background:#FEECEC;
      border:1px solid #F8C8C8;
    }

    .ok{
      color:var(--success);
      background:#EAF8F1;
      border:1px solid #BFE8D2;
    }

    .lock{
      color:#8A5B00;
      background:#FFF7D6;
      border:1px solid #F2D66B;
    }

    .btn{
      width:100%;
      border:0;
      border-radius:14px;
      padding:13px 15px;
      margin-top:12px;
      background:var(--lagoon);
      color:white;
      font-weight:800;
      transition:.15s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn.alt{
      background:#E8EFEE;
      color:var(--ink);
    }

    .btn.yellow{
      background:var(--danfo);
      color:var(--ink);
    }

    .link{
      display:block;
      width:100%;
      border:0;
      background:none;
      color:var(--lagoon);
      font-weight:800;
      padding:12px;
      margin-top:8px;
    }

    input,
    select{
      width:100%;
      border:1px solid var(--line);
      background:white;
      color:var(--ink);
      border-radius:13px;
      padding:12px;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:var(--lagoon);
      box-shadow:0 0 0 3px rgba(15,107,111,.1);
    }

    label{
      display:block;
      font-size:.82rem;
      font-weight:800;
      margin:0 0 7px;
    }

    .field{
      margin-bottom:13px;
    }

    .nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:50;
      display:grid;
      grid-template-columns:repeat(6,1fr);
      background:white;
      border-top:1px solid var(--line);
      padding:7px 5px calc(7px + env(safe-area-inset-bottom));
    }

    .nav button{
      border:0;
      background:none;
      color:#65716F;
      padding:8px 2px;
      font-size:.68rem;
      font-weight:800;
      border-radius:10px;
    }

    .nav button[aria-current="page"]{

      color:var(--lagoon);
    }

    .auth{

      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px 14px;
    }

    .auth-box{
      width:min(100%,440px);
    }

    .brand{
      font-size:2.4rem;
      font-weight:800;
      letter-spacing:-.06em;
      margin-bottom:4px;
    }

      color:var(--lagoon);
    }

    .eyebrow{
      color:var(--lagoon);
      font-size:.72rem;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .bg-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .bg-choice{

      border-radius:15px;
      background:white;
      padding:13px;
      text-align:left;
    }

    .bg-choice.selected{

      background:#EDF8F7;
    }

    .bg-choice strong{
      display:block;
      margin-bottom:3px;
    }

    .bg-choice small{
      color:var(--muted);
      display:block;
    }

    .trait-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;

    .trait{

      border-radius:14px;
      background:white;
      padding:12px;
      text-align:left;

      background:#EDF8F7;

      margin-bottom:4px;
    }

    .trait small{

    .appearance-grid{

      gap:10px;

      text-align:center;

    .avatar-large{

      height:120px;

      align-items:center;
      justify-content:center;
    }

    .avatar-mini{

      height:58px;

      align-items:center;
      justify-content:center;

    .avatar-mini svg{

    .profile-detail strong{

      font-size:.8rem;
      margin-bottom:4px;

    .need-bar{
      height:8px;
      border-radius:999px;
      overflow:hidden;
      background:#E0E7E5;

    .need-bar i{
      display:block;
      height:100%;
      background:var(--lagoon);
    }

    .activity-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .activity{
      border:1px solid var(--line);
      background:white;
      border-radius:14px;
      padding:12px;
      text-align:left;
    }

    .activity strong{
      display:block;
    }

    .activity small{
      color:var(--muted);
      display:block;
      margin-top:3px;
    }

    .sk{
      margin-bottom:12px;
    }

    .sk:last-child{
      margin-bottom:0;
    }

    .grid3{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .grid3 .btn{
      margin-top:0;
      padding:11px 5px;
    }

    .big{
      font-size:2rem;
      font-weight:800;
      margin:3px 0 8px;
    }

    .bonus{
      display:inline-block;
      background:#FFF7D6;
      color:#765300;
      padding:7px 9px;
      border-radius:9px;
      font-size:.78rem;
      font-weight:800;
    }

    .map-card{
      padding:8px;
      overflow:hidden;
    }

    .map-svg{
      width:100%;
      display:block;
    }

    .map-pin{
      cursor:pointer;
    }

    .district-card.here{
      border:2px solid var(--lagoon);
    }

    .lb{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:13px 0;
      border-bottom:1px solid var(--line);
    }

    .lb:last-child{
      border-bottom:0;
    }

    .clock{
      background:var(--ink);
      color:white;
      border-radius:17px;
      padding:14px;
      margin-bottom:14px;
    }

    .clock-time{
      font-size:1.5rem;
      font-weight:800;
    }

    .clock-date{
      color:rgba(255,255,255,.7);
      font-size:.78rem;
    }

    .avatar-controls{
      display:flex;
      gap:8px;
      margin-top:12px;
    }

    .avatar-control{
      flex:1;
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px;
      background:white;
      font-weight:800;
    }

    .avatar-note{
      color:var(--muted);
      font-size:.8rem;
      margin-top:10px;
    }

      .appearance-grid{

      }

      .bg-grid{
        grid-template-columns:1fr;
      }

</head>

/* =========================================================

========================================================= */

function esc(value){

  return String(
    value ?? ""
  )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function naira(value){

  const n =
    Number(value) || 0;

  return "₦" +
    n.toLocaleString(
      "en-NG"
    );

}


function cap(value){

  return String(
    value ?? ""
  )
    .replaceAll("_"," ")
    .replace(/\b\w/g,
      letter =>
        letter.toUpperCase()
    );

}


function bgName(id){

  const found =
    BACKGROUNDS.find(
      item =>
        item.id === id
    );

  return found
    ? found.name
    : cap(id);

}


function optionLabel(
  list,
  value
){

  const found =
    list.find(
      item =>
        item[0] === value
    );

  return found
    ? found[1]
    : cap(value);

}


function setMsg(message){

  S.msg = {

    ok:false

function msgHtml(){

  if(!S.msg){

  const output = `

        S.msg.ok
          ? "ok"
          : "err"
      }"
    >
      ${esc(S.msg.t)}
    </div>

  `;

  S.msg = null;

  return output;

}

    now.toLocaleDateString(

        day:"numeric",
        month:"long",
        year:"numeric",
        timeZone:"Africa/Lagos"
      }
    );

  return `

      <div class="clock-time">
        ${time}
      </div>

      <div class="clock-date">
        ${date} · Nigeria
      </div>

    </div>

  `;

}


function startGameClock(){

  if(
    window.naijaClockTimer
  ){

    clearInterval(
      window.naijaClockTimer
    );

  }

  window.naijaClockTimer =
    setInterval(
      () => {

        if(
          !S.ch ||
          S.tab === "avatar"
        ){
          return;
        }

        const clock =
          document.querySelector(
            ".clock"
          );

        if(clock){

          clock.outerHTML =
            gameClockHtml();

        }

      },
      1000
    );

}

/* =========================================================
AUTH ACTION
========================================================= */

async function authSubmit(){

  if(S.busy){
    return;
  }

  const email =
    document
      .getElementById(
        "authEmail"
      )
      ?.value
      .trim();

  const password =
    document
      .getElementById(
        "authPassword"
      )
      ?.value;

  if(!email){

    setMsg(
      "Enter your email."
    );

    return viewAuth();

  }

  if(
    !password ||
    password.length < 6
  ){

    setMsg(
      "Password must be at least 6 characters."
    );

    return viewAuth();

  }

  S.busy =
    true;

  try{

    let result;

    if(
      S.mode === "login"
    ){

      result =
        await db.auth.signInWithPassword({
          email,
          password
        });

    }else{

      result =
        await db.auth.signUp({
          email,
          password
        });

    }

    if(result.error){
      throw result.error;
    }

    S.busy =
      false;

    if(
      S.mode === "signup" &&
      !result.data.session
    ){

      S.msg = {

        t:
          "Account created. If email confirmation is enabled, confirm your email before logging in.",

        ok:true

      };

      S.mode =
        "login";

      return viewAuth();

    }

    S.user =
      result.data.user ||
      result.data.session?.user ||
      null;

    await load();

  }catch(error){

    S.busy =
      false;

    setMsg(
      error?.message ||
      "Authentication failed."
    );

    viewAuth();

  }

}

    skinTone:"skinTone",

    hairstyle:"hairstyle",

    hairColor:"hairColor",

    outfit:"outfit",

    accessory:"accessory"

  };


  Object.entries(
    appearanceIds
  )
  .forEach(
    ([stateKey,id]) => {

      document
        .getElementById(id)
        ?.addEventListener(
          "change",
          event => {

            S[stateKey] =
              event.target.value;

            viewCreate();

          }
        );

    }
  );


  document
    .getElementById(
      "startHustling"
    )
    ?.addEventListener(
      "click",
      createCharacter
    );


  document
    .getElementById(
      "logoutCreate"
    )
    ?.addEventListener(
      "click",
      logout
    );

}


/* =========================================================
CREATE CHARACTER
========================================================= */

async function createCharacter(){

  if(S.busy){
    return;
  }

  const name =
    S.nameDraft.trim();

  if(
    name.length < 3 ||
    name.length > 20
  ){

    setMsg(
      "Character name must be between 3 and 20 characters."
    );

    return viewCreate();

  }

  if(!S.picked){

    setMsg(
      "Choose a background."
    );

    return viewCreate();

  }

  if(
    !S.personality1 ||
    !S.personality2 ||
    S.personality1 ===
      S.personality2
  ){

    setMsg(
      "Choose exactly two different personality traits."
    );

    return viewCreate();

  }

  S.busy =
    true;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "create_character",
        {

          p_name:
            name,

          p_background:
            S.picked,

          p_trait_1:
            S.personality1,

          p_trait_2:
            S.personality2,

          p_skin_tone:
            S.skinTone,

          p_hairstyle:
            S.hairstyle,

          p_hair_color:
            S.hairColor,

          p_outfit:
            S.outfit,

          p_accessory:
            S.accessory

        }
      );

    if(error){
      throw error;
    }

    S.busy =
      false;

    S.ch =
      data;

    S.nameDraft =
      "";

    await load();

  }catch(error){

    S.busy =
      false;

    console.error(
      "Character creation failed:",
      error
    );

    setMsg(
      error?.message ||
      "Could not create your character."
    );

    viewCreate();

  }

}

async function go(tab){

  S.tab =
    tab;

  S.jobMsg =
    null;

  S.activityMsg =
    null;

  S.bizMsg =
    null;

  S.mapMsg =
    null;

  if(
    tab === "business"
  ){

    S.bizLoaded =
      false;

  }

  viewGame();

  if(
    tab === "business"
  ){

    return;

  }

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );

    if(error){
      throw error;
    }

    if(
      data &&
      data.id &&
      S.tab === tab
    ){

      S.ch =
        data;

      viewGame();

    }

  }catch(error){

    console.error(
      "Navigation refresh failed:",
      error
    );

  }

}


/* =========================================================

========================================================= */

function viewGame(){

  if(!S.ch){

    if(S.user){
      return viewCreate();
    }

    return viewAuth();

  }

  if(
    window.naijaClockTimer
  ){

    clearInterval(
      window.naijaClockTimer
    );

  }

  const c =
    S.ch;

  const maxEnergy =
    Number(
      c.max_energy
    ) || 1;

  const energy =
    Number(
      c.energy
    ) || 0;

  const pct =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(
          (
            energy /
            maxEnergy
          ) * 100
        )
      )
    );

  const xpPct =
    Number(c.xp || 0) %
    100;

  const tabs = [

    ["home","Home"],

    ["jobs","Jobs"],

    ["business","Business"],

    ["map","Map"],

    ["board","Ranks"],

    ["profile","Profile"]

  ];

  app.innerHTML = `

    <div class="top">

      <div class="in">

        <div class="row">

            ${esc(c.name)}

            "
          ></i>

        </div>

      </div>

      <div class="stripe"></div>

    </div>


    <div
      class="wrap"
      id="main"
    ></div>


    <nav class="nav">

      ${
        tabs
          .map(
            ([key,label]) => `

              <button
                type="button"
                data-t="${key}"
                ${
                  S.tab === key
                    ? 'aria-current="page"'
                    : ""
                }
              >
                ${label}
              </button>

            `
          )
          .join("")
      }

    </nav>

  `;


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            go(
              button.dataset.t
            );

      }
    );


  const main =
    document.getElementById(
      "main"
    );


  if(
    S.tab === "home"
  ){

    main.innerHTML =
      homeHtml(c);

    main
      .querySelectorAll(
        "[data-activity]"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              doActivity(
                button.dataset.activity
              );

        }
      );

  }else if(
    S.tab === "jobs"
  ){

    jobsView(main);

  }else if(
    S.tab === "business"
  ){

    bizView(main);

  }else if(
    S.tab === "map"
  ){

    mapView(main);

  }else if(
    S.tab === "board"
  ){

    boardView(main);

  }else if(
    S.tab === "profile"
  ){

    main.innerHTML =
      profileHtml(c);

  }

  startGameClock();

}

async function doActivity(
  activity
){

  if(S.busy){
    return;
  }

  S.busy =
    true;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "do_activity",
        {
          p_activity:
            activity
        }
      );

    S.busy =
      false;

    if(error){

      S.activityMsg = {

        t:error.message,

        ok:false

      };

      return viewGame();

    }

    S.ch =
      data;

    const names = {

      eat:"Meal",

      entertainment:
        "Entertainment",

      socialize:
        "Socializing",

      freshen_up:
        "Freshening up"

    };

    S.activityMsg = {

      t:
        `${names[activity] || "Activity"} completed.` +
        (
          data.last_event
            ? ` ${data.last_event}`
            : ""
        ),

      ok:true

    };

    viewGame();

  }catch(error){

    S.busy =
      false;

    S.activityMsg = {

      t:
        error?.message ||
        "Activity failed.",

      ok:false

    };

    viewGame();

  }

}

function jobCard(
  job,
  character
){

  const needs = [];

  if(
    Number(character.level) <
    Number(job.min_level)
  ){

    needs.push(
      "level " +
      job.min_level
    );

  }

  if(
    job.req_skill &&
    Number(
      character[
        "skill_" +
        job.req_skill
      ]
    ) <
    Number(
      job.req_skill_level
    )
  ){

    needs.push(

      SK[job.req_skill] +
      " " +
      job.req_skill_level

    );

  }

  return `

    <div class="card">

      <div class="row">

        <h2>
          ${esc(job.title)}
        </h2>

        <span class="pill">
          ${job.energy_cost} energy
        </span>

        ${esc(job.description)}

      <div
        class="row"
        style="font-size:.95rem"
      >

        <span>
          ${naira(job.pay_min)}
          to
          ${naira(job.pay_max)}
        </span>

        <span>
          +${job.xp} XP
        </span>

      </div>

      ${
        needs.length
          ? `

            <div class="lock">

              Locked: needs

                needs.join(

                )

          `
          : `

              class="btn"

              data-job="${esc(job.id)}"

        {
          p_job_id:id
        }
      );

    S.busy =
      false;

    if(error){

      S.jobMsg = {

        t:error.message,

        ok:false

      };

      return viewGame();

    }

    const job =
      S.jobs.find(
        item =>
          item.id === id
      );

    S.ch =
      data;

    let message =
      job
        ? `${job.title} completed.`
        : "Job completed.";

    const diff =
      Number(data.cash) -
      Number(before.cash);

    message +=
      ` Cash ${
        diff >= 0
          ? "+"
          : "-"
      }${naira(
        Math.abs(diff)
      )}.`;

    if(
      Number(data.level) >
      Number(before.level)
    ){

      message +=
        ` Level up! You're now level ${data.level}.`;

    }

    if(
      data.last_event
    ){

      message +=
        " " +
        data.last_event;

    }

    S.jobMsg = {

      t:message,

      ok:true

    };

    viewGame();

  }catch(error){

    S.busy =
      false;

    S.jobMsg = {

      t:
        error?.message ||
        "The job could not be completed.",

      ok:false

    };

    viewGame();

  }

}

          ${esc(

    main.innerHTML =
      head +

      `

        <div class="card">

          <h2>
            Start a business
          </h2>

          <p class="mute">

            Buy a shop, stock it,
            and earn while you
            work other jobs.

          </p>

        </div>

      ` +

      S.bizTypes
        .map(
          type => `

            <div class="card">

              <div class="row">

                <span class="pill">
                  ${naira(

      <div class="err">

    Number(type.base_rate) *
    Number(business.level);

  const capacity =
    Number(type.base_capacity) *
    Number(business.level);

  const perHour =
    rate *
    (
      Number(type.unit_price) -
      Number(type.unit_cost)
    );

  const stock =
    Number(
      business.stock
    ) || 0;

  const fill =
    Math.max(
      0,
      capacity - stock
    );

    Math.floor(
      Number(type.buy_cost) *

    );

    head +

    `

        <div class="row">

          <h2>
            ${esc(type.name)}
          </h2>

            Level

            business.uncollected

          ${naira(
            type.unit_cost

                <button
                  class="btn alt"
                  data-stock="${Math.min(
                    10,
                    fill
                  )}"
                >
                  +10
                </button>

                <button
                  class="btn alt"
                  data-stock="${Math.min(
                    50,
                    fill
                  )}"

                  +50

                  class="btn alt"

          {},

        );

async function bizAct(
  functionName,
  args,
  successText
){

  if(S.busy){
    return;
  }

  S.busy =
    true;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        functionName,
        args
      );

    S.busy =
      false;

    if(error){

      S.bizMsg = {

        t:error.message,

        ok:false

      };

      return viewGame();

    }

    if(
      data?.character
    ){

      S.ch =
        data.character;

    }

    if(
      Object.prototype
        .hasOwnProperty
        .call(
          data || {},
          "business"
        )
    ){

      S.biz =
        data.business;

    }

    S.bizLoaded =
      true;

    S.bizMsg = {

      t:
        successText(data),

      ok:true

    };

    viewGame();

  }catch(error){

    S.busy =
      false;

    S.bizMsg = {

      t:
        error?.message ||
        "Business action failed.",

      ok:false

    };

    viewGame();

  }

}

async function loadDistricts(){

    return S.districts;

  const result =
    await db
      .from("districts")
      .select("*")
      .order("travel_cost");

function mapSvg(
  currentDistrict
){

  const positions = {

    ikeja:[68,42],

    mushin:[128,88],

    yaba:[218,92],

    victoria_island:[195,175],

    lekki:[278,188]

  };

  const labels = {

    ikeja:"Ikeja",

    mushin:"Mushin",

    yaba:"Yaba",

    victoria_island:"VI",

    lekki:"Lekki"

  };

  const links = [

    ["ikeja","mushin"],

    ["mushin","yaba"],

    ["yaba","victoria_island"],

    ["victoria_island","lekki"]

  ];

  const lines =
    links
      .map(
        ([from,to]) => `

          <line
            x1="${positions[from][0]}"
            y1="${positions[from][1]}"
            x2="${positions[to][0]}"
            y2="${positions[to][1]}"
            stroke="#94A3A2"
            stroke-width="2.5"
            stroke-dasharray="6 5"
            stroke-linecap="round"
          />

        `
      )
      .join("");

  const dots =
    Object.keys(
      positions
    )
    .map(
      id => {

        const [
          x,
          y
        ] =
          positions[id];

        const current =
          id ===
          currentDistrict;

        return `

          <g
            class="map-pin"
            data-id="${id}"
          >

            <circle
              cx="${x}"
              cy="${y}"
              r="${
                current
                  ? 13
                  : 9
              }"
              fill="${
                current
                  ? "#FFC20E"
                  : "#fff"
              }"
              stroke="${
                current
                  ? "#14201F"
                  : "#0F6B6F"
              }"
              stroke-width="3"
            />

            <text
              x="${x}"
              y="${y + 28}"
              text-anchor="middle"
              font-size="12"
              font-weight="700"
              fill="#14201F"
            >
              ${labels[id]}
            </text>

          </g>

        `;

      }
    )
    .join("");

  return `

    <div class="card map-card">

      <svg
        class="map-svg"
        viewBox="0 0 320 230"
      >

        <rect
          width="320"
          height="230"
          rx="12"
          fill="#F7F4EC"
        />

        <path
          d="
            M0 128
            C55 112 125 155 205 132
            S305 122 320 138
            L320 162
            C265 152 200 178 115 162
            S35 152 0 155 Z
          "
          fill="#A8D5D5"
        />

        <text
          x="28"
          y="152"
          font-size="11"
          fill="#0F6B6F"
          font-weight="600"
        >
          Lagos Lagoon
        </text>

        ${lines}

        ${dots}

      </svg>

    </div>

  `;

}

async function travel(id){

  if(S.busy){
    return;
  }

  const district =
    S.districts.find(
      item =>
        item.id === id
    );

  if(!district){
    return;
  }

  S.busy =
    true;

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "travel",
        {
          p_district:id
        }
      );

    S.busy =
      false;

    if(error){

      S.mapMsg = {

        t:error.message,

        ok:false

      };

      return viewGame();

    }

    S.ch =
      data;

    S.mapMsg = {

      t:
        `You reached ${district.name}.`,

      ok:true

    };

    viewGame();

  }catch(error){

    S.busy =
      false;

    S.mapMsg = {

      t:
        error?.message ||
        "Travel failed.",

      ok:false

    };

    viewGame();

  }

}

/* =========================================================
AVATAR NAVIGATION
========================================================= */

function openAvatarStage(){

  if(
    window.naijaClockTimer
  ){

    clearInterval(
      window.naijaClockTimer
    );

  }

  const main =
    document.getElementById(
      "main"
    );

  if(
    !main ||
    !S.ch
  ){

    return;

  }

  main.innerHTML =
    avatarStageHtml(
      S.ch
    );

  main
    .querySelectorAll(
      "[data-avatar-rotate]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            S.avatarRotation +=
              Number(
                button.dataset.avatarRotate
              );

            const stage =
              main.querySelector(
                ".avatar-stage"
              );

            if(stage){

              const svg =
                stage.querySelector(
                  "svg"
                );

              if(svg){

                const amount =
                  S.avatarRotation *
                  8;

                svg.style.transform =
                  `perspective(500px) rotateY(${amount}deg)`;

              }

            }

          };

      }
    );

}

async function logout(){

  try{

    await db.auth.signOut();

  }catch(error){

    console.error(
      "Logout failed:",
      error
    );

  }

  S.user =
    null;

  S.ch =

  S.tab =

  S.biz =
    null;

  S.bizLoaded =

/* =========================================================
LOAD
========================================================= */

async function load(){

  if(!S.user){

    S.ch =
      null;

    return viewAuth();

  }

  try{

    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );

    if(error){

      console.error(
        "get_my_character failed:",
        error
      );

      setMsg(
        error.message
      );

      return viewCreate();

    }

    S.ch =
      data?.id
        ? data
        : null;

    if(S.ch){

      try{

        await loadPersonalityTraits();

      }catch(
        personalityError
      ){

        console.error(
          "Personality traits failed to load:",
          personalityError
        );

      }

      viewGame();

    }else{

      viewCreate();

    }

  }catch(error){

    console.error(
      "Load failed:",
      error
    );

    if(S.user){

      setMsg(
        error?.message ||
        "Could not load your character."
      );

      return viewCreate();

    }

    setMsg(
      error?.message ||
      "Could not load the game."
    );

    viewAuth();

  }

}


/* =========================================================
AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
  (
    event,
    session
  ) => {

    S.user =
      session
        ? session.user
        : null;

    if(
      event ===
      "INITIAL_SESSION"
    ){

      return;

    }

    setTimeout(
      () => load(),
      0
    );

  }
);


/* =========================================================
STARTUP
========================================================= */

(async function init(){

  try{

    const {
      data,
      error
    } =
      await db.auth.getSession();

    if(error){
      throw error;
    }

    S.user =
      data?.session
        ? data.session.user
        : null;

    await load();

  }catch(error){

    console.error(
      "Naija Hustle startup error:",
      error
    );

    app.innerHTML = `

      <div class="stripe"></div>

      <div class="wrap">

        <h1>
          Naija Hustle
        </h1>

        <div class="err">

          <b>
            Something went wrong while starting the game.
          </b>

          <br><br>

          ${esc(
            error?.message ||
            "Unknown startup error."
          )}

        </div>

      </div>

    `;

  }

})();
