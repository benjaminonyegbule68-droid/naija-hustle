<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14201F">
<title>Naija Hustle — Open World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2314201F'/%3E%3Cpath d='M32 10 51 42 32 54 13 42Z' fill='%23FFC20E'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1413;
  --panel:rgba(13,18,17,.94);
  --panel2:rgba(20,27,25,.97);
  --teal:#0F6B6F;
  --yellow:#FFC20E;
  --charcoal:#14201F;
  --text:#f7f7f4;
  --muted:#aeb9b5;
  --line:rgba(255,255,255,.12);
  --good:#39c36e;
  --danger:#ef6666;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f0e;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{touch-action:none}
button,input,textarea{font:inherit}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
.hudLeft,.hudRight{position:absolute;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
