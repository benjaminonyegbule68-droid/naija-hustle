<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Naija Hustle — 3D Avatar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --glass:rgba(8,10,12,.62);
  --glass-border:rgba(255,255,255,.12);
  --accent:#ffd66b;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101214;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  padding:24px;
  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,214,107,.08),
      transparent 35%
    ),
    #101214;
  color:#fff;
  text-align:center;
  font-size:18px;
}

#loading small{
  max-width:340px;
  line-height:1.5;
  opacity:.65;
  font-size:13px;
}

#loading.error{
  color:#fff;
}

#loading .loadingIcon{
  width:42px;
  height:42px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.16);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#retryButton{
  margin-top:8px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:10px 14px;
  background:rgba(255,255,255,.08);
  color:#fff;
  cursor:pointer;
}

/* =========================================================
   PLAYER INFO
========================================================= */

#info{
  position:fixed;
  top:14px;
  left:14px;
  z-index:20;
  min-width:220px;
  max-width:calc(100vw - 92px);
  padding:13px 15px;
  border:1px solid var(--glass-border);
  border-radius:15px;
  background:var(--glass);
  color:#fff;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 35px rgba(0,0,0,.18);
}

#info strong{
  display:block;
  margin-bottom:5px;
  font-size:16px;
  letter-spacing:.1px;
}

#playerName{
  display:block;
  font-size:14px;
  font-weight:700;
}

#playerDetails{
  display:block;
  margin-top:4px;
  color:rgba(255,255,255,.68);
  font-size:12px;
}

#status{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}

#statusDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px rgba(255,214,107,.65);
}

#backButton{
  position:fixed;
  top:14px;
  right:14px;
  z-index:25;
  border:1px solid var(--glass-border);
  border-radius:11px;
  padding:10px 14px;
  background:var(--glass);
  color:#fff;
  cursor:pointer;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  transition:
    transform .15s ease,
    background .15s ease;
}

#backButton:hover{
  background:rgba(0,0,0,.78);
}

#backButton:active{
  transform:scale(.96);
}

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

#controls{
  position:fixed;
  left:22px;
  bottom:22px;
  z-index:25;
  width:138px;
  height:138px;
  border:2px solid rgba(255,255,255,.15);
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.025),
    0 12px 30px rgba(0,0,0,.2);
  touch-action:none;
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:60px;
  height:60px;
  margin-left:-30px;
  margin-top:-30px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
  background:
    radial-gradient(
      circle at 32% 28%,
      rgba(255,255,255,.72),
      rgba(255,255,255,.45)
    );
  box-shadow:
    0 8px 22px rgba(0,0,0,.3),
    inset 0 2px 5px rgba(255,255,255,.22);
  pointer-events:none;
  will-change:transform;
}

/* =========================================================
   ACTION BUTTONS
========================================================= */

#actions{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:25;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.actionButton{
  min-width:78px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:12px;
  padding:10px 12px;
  background:var(--glass);
  color:#fff;
  cursor:pointer;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(0,0,0,.16);
  transition:
    transform .12s ease,
    background .12s ease;
}

.actionButton:hover{
  background:rgba(0,0,0,.78);
}

.actionButton:active{
  transform:scale(.96);
}

#sprintButton{
  display:none;
}

/* =========================================================
   DESKTOP HINT
========================================================= */

#desktopControls{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:20;
  padding:10px 14px;
  border:1px solid var(--glass-border);
  border-radius:11px;
  background:var(--glass);
  color:rgba(255,255,255,.86);
  font-size:12px;
  line-height:1.45;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

#desktopControls strong{
  color:#fff;
}

#cameraHint{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  z-index:15;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(0,0,0,.34);
  color:rgba(255,255,255,.56);
  font-size:11px;
  pointer-events:none;
  white-space:nowrap;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  #desktopControls,
  #cameraHint{
    display:none;
  }

  #info{
    min-width:172px;
    padding:10px 12px;
  }

  #info strong{
    font-size:14px;
  }

  #playerName{
    font-size:13px;
  }

  #playerDetails{
    font-size:11px;
  }

  #status{
    font-size:11px;
  }

  #controls{
    left:18px;
    bottom:18px;
    width:130px;
    height:130px;
  }

  #stick{
    width:55px;
    height:55px;
    margin-left:-27.5px;
    margin-top:-27.5px;
  }

  #actions{
    right:16px;
    bottom:18px;
  }

  .actionButton{
    min-width:72px;
    padding:9px 11px;
    font-size:12px;
  }

  #sprintButton{
    display:block;
  }

  #backButton{
    padding:9px 12px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="loading">
  <div class="loadingIcon"></div>
  <div>Loading 3D Avatar...</div>
  <small>Loading your Naija Hustle character</small>
</div>

<div id="game"></div>

<div id="info">
  <strong>Naija Hustle</strong>
  <span id="playerName">Loading player...</span>
  <span id="playerDetails"></span>

  <span id="status">
    <span id="statusDot"></span>
    <span id="statusText">Loading...</span>
  </span>
</div>

<button id="backButton">← Back</button>

<div id="controls">

</div>

<div id="actions">
  <button
    class="actionButton"
    id="cameraButton"
    type="button"
  >
    Camera
  </button>

  <button
    class="actionButton"
    id="sprintButton"
    type="button"
  >
    Run
  </button>
</div>

<div id="desktopControls">
  <strong>Move:</strong> WASD / Arrow Keys<br>
  <strong>Run:</strong> Shift<br>
  <strong>Camera:</strong> C or drag
</div>

<div id="cameraHint">
  Drag the screen to look around
</div>


<script type="module">

/* =========================================================

========================================================= */

const SUPABASE_URL =

const SUPABASE_ANON_KEY =

const db =

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from

/* =========================================================

========================================================= */

const loading =

/* =========================================================

========================================================= */

const scene =

/* =========================================================
   CAMERA

const camera =

/*

*/

let cameraYaw =

let cameraPitch =
  .30;

const CAMERA_DISTANCE =
  6.4;

const CAMERA_HEIGHT =
  1.8;

const cameraPositionTarget =
  new THREE.Vector3();

const cameraLookTarget =
  new THREE.Vector3();


/* =========================================================
   RENDERER
========================================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:
      "high-performance"
  });

renderer.setPixelRatio(

/* =========================================================

sun.shadow.mapSize.width=

sun.shadow.camera.bottom=

/* subtle fill */

/* =========================================================

const groundMaterial =

  });

  });


/* =========================================================
   WORLD
========================================================= */

const ground =

ground.rotation.x=

/* Road */

const road =

road.rotation.x=

/* Sidewalks */

const leftWalk =
  new THREE.Mesh(
    new THREE.BoxGeometry(

  );

leftWalk.position.set(

leftWalk.receiveShadow=true;

scene.add(
  leftWalk
);


const rightWalk =
  leftWalk.clone();

rightWalk.position.x=
  7.12;

scene.add(
  rightWalk
);


/* Road markings */

for(
  let z=-105;
  z<110;
  z+=8
){

  const line =
    new THREE.Mesh(

        .26,
        .025,

    );

    line

/* Edge lines */

for(
  const x of [-5.25,5.25]
){

  const edge =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .055,
        .02,
        220
      ),

    );

  );

/* =========================================================
   WORLD BUILDING MATERIALS
========================================================= */

const buildingMaterials=[
  new THREE.MeshStandardMaterial({
    color:0xb28767,
    roughness:.95
  }),

  new THREE.MeshStandardMaterial({
    color:0x8b8d8f,
    roughness:.95

  }),

    color:0x73777b,
    roughness:.95
  }),

  new THREE.MeshStandardMaterial({
    color:0xa58a65,
    roughness:.95
  })
];


const windowMaterial =
  new THREE.MeshStandardMaterial({
    color:0x7fb7cb,
    roughness:.35,
    metalness:.08
  });


const darkMaterial =
  new THREE.MeshStandardMaterial({
    color:0x222426,
    roughness:.8
  });


/* =========================================================
   BUILDINGS
========================================================= */

function createBuilding(
  x,
  z,
  width,
  depth,
  height,
  materialIndex
){

  const group =
    new THREE.Group();

  group.position.set(
    x,
    0,
    z
  );

  scene.add(
    group
  );


  const building =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      buildingMaterials[
        materialIndex %
        buildingMaterials.length
      ]
    );

  building.position.y=
    height/2;

  building.castShadow=true;
  building.receiveShadow=true;

  group.add(
    building
  );


  /* roof */

  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width+.10,
        .12,
        depth+.10
      ),
      darkMaterial
    );

  roof.position.y=
    height+.06;

  roof.castShadow=true;

  group.add(
    roof
  );


  /* door */

  const door =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .6,
        1.25,
        .03
      ),
      darkMaterial
    );

  door.position.set(
    0,
    .63,
    depth/2+.016
  );

  group.add(
    door
  );


  /* windows */

  const columns=
    Math.max(
      1,
      Math.floor(
        width/1.8
      )
    );

  const rows=
    Math.max(
      1,
      Math.floor(
        height/2.1
      )
    );


  for(
    let row=0;
    row<rows;
    row++
  ){

    for(
      let col=0;
      col<columns;
      col++
    ){

      const windowMesh =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .42,
            .58,
            .03
          ),
          windowMaterial
        );


      const usableWidth =
        Math.max(
          0,
          width-1.25
        );


      const windowX =
        columns===1
          ? 0
          : -usableWidth/2+
            col*
            (
              usableWidth/
              (columns-1)
            );


      windowMesh.position.set(
        windowX,
        1.35+
          row*1.85,
        depth/2+.018
      );

      group.add(
        windowMesh
      );
    }
  }


  /* side shadow wall detail */

  const sideDetail =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .06,
        height*.72,
        depth*.55
      ),
      darkMaterial
    );

  sideDetail.position.set(
    width/2+.032,
    height*.42,
    0
  );

  sideDetail.material =
    sideDetail.material.clone();

  sideDetail.material.color
    .multiplyScalar(.88);

  group.add(
    sideDetail
  );


  return group;
}

for(

/* =========================================================
   TREES
========================================================= */

const trunkMaterial =
  new THREE.MeshStandardMaterial({
    color:0x5c3823,
    roughness:1
  });


const leafMaterial =

function createTree(

  const crown1 =

    );

  crown1.position.y=
    1.65;

  crown1.castShadow=true;

  group.add(
    crown1
  );


  const crown2 =
    crown1.clone();

  crown2.scale.setScalar(
    .72
  );

  crown2.position.set(

  );


  const crown3 =

  group.add(

  );
}


createTree(

);

createTree(
  6.2,

/* =========================================================
   HELPERS
========================================================= */

function mesh(
  geometry,
  material
){

  const object =
    new THREE.Mesh(
      geometry,
      material
    );

  object.castShadow=true;
  object.receiveShadow=true;

  return object;
}


function sphere(
  radius,
  material,
  widthSegments=20,
  heightSegments=16
){

  return mesh(
    new THREE.SphereGeometry(
      radius,
      widthSegments,
      heightSegments
    ),
    material
  );
}


function capsule(
  radius,
  length,
  material
){

  return mesh(
    new THREE.CapsuleGeometry(
      radius,
      length,
      8,
      16
    ),
    material
  );
}


function box(
  x,
  y,
  z,
  material
){

  return mesh(
    new THREE.BoxGeometry(
      x,
      y,
      z
    ),
    material
  );
}


function normalize(
  value
){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase()
  .replace(
    /[\s-]+/g,
    "_"
  );
}


function damp(
  current,
  target,
  smoothing,
  delta
){

  return THREE.MathUtils.damp(
    current,
    target,
    smoothing,
    delta
  );
}


function dampAngle(
  current,
  target,
  smoothing,
  delta
){

  let difference =
    target-current;

  while(
    difference>Math.PI
  ){
    difference-=Math.PI*2;
  }

  while(
    difference<-Math.PI
  ){
    difference+=Math.PI*2;
  }

  return current+
    difference*
    (
      1-
      Math.exp(
        -smoothing*
        delta
      )
    );
}

/* =========================================================
   HAIRSTYLE SYSTEM
========================================================= */

function clearHairExtras(){

  while(
    hairExtras.children.length
  ){

    const child =
      hairExtras.children.pop();

    child.traverse(
      object=>{
        if(
          object.geometry
        ){
          object.geometry.dispose();
        }
      }
    );
  }
}


function hairPiece(
  x,
  y,
  z,
  sx,
  sy,
  sz
){

  const piece =
    sphere(
      .12,
      hairMaterial,
      14,
      10
    );

  piece.position.set(
    x,
    y,
    z
  );

  piece.scale.set(
    sx,
    sy,
    sz
  );

  hairExtras.add(
    piece
  );

  return piece;
}


function applyHairstyle(
  value
){

  const style =
    normalize(value);

  clearHairExtras();

  hair.visible=true;
  hairline.visible=true;


  if(
    style==="low_cut" ||
    style==="lowcut"
  ){

    hair.scale.set(
      .45,
      .20,
      .405
    );

    hairline.scale.set(
      1,
      .75,
      1
    );

    return;
  }


  if(style==="fade"){

    hair.scale.set(
      .45,
      .23,
      .405
    );

    hairPiece(
      0,
      .42,
      0,
      1.7,
      .26,
      1.5
    );

    return;
  }


  if(style==="afro"){

    hair.scale.set(
      .58,
      .52,
      .54
    );

    return;
  }


  if(style==="natural"){

    hair.scale.set(
      .51,
      .44,
      .47
    );

    return;
  }


  if(style==="braids"){

    hair.scale.set(
      .47,
      .37,
      .43
    );

    for(
      let i=-3;
      i<=3;
      i++
    ){

      hairPiece(
        i*.105,
        -.015,
        -.01,
        .24,
        1.48,
        .25
      );
    }

    return;
  }


  if(style==="dreads"){

    hair.scale.set(
      .49,
      .41,
      .45
    );

    for(
      let i=-3;
      i<=3;
      i++
    ){

      hairPiece(
        i*.115,
        -.12,
        .01,
        .25,
        1.58,
        .25
      );
    }

    return;
  }


  if(style==="long"){

    hair.scale.set(
      .48,
      .43,
      .44
    );

    hairPiece(
      -.32,
      -.18,
      .01,
      .25,
      1.65,
      .33
    );

    hairPiece(
      .32,
      -.18,
      .01,
      .25,
      1.65,
      .33
    );

    return;
  }


  /* default short */

  hair.scale.set(
    .45,
    .30,
    .405
  );
}

/* =========================================================
   ACCESSORY SYSTEM
========================================================= */

let headAccessoryNodes=[];
let bodyAccessoryNodes=[];
let handAccessoryNodes=[];


function removeNodes(
  nodes
){

  for(
    const node of nodes
  ){

    if(
      node.parent
    ){
      node.parent.remove(
        node
      );
    }

    node.traverse(
      object=>{
        if(
          object.geometry
        ){
          object.geometry.dispose();
        }
      }
    );
  }

  nodes.length=0;
}


function addHeadAccessory(
  node
){

  headGroup.add(
    node
  );

  headAccessoryNodes.push(
    node
  );

  return node;

function applyAccessory(
  value
){

  removeNodes(
    headAccessoryNodes
  );

  removeNodes(
    bodyAccessoryNodes
  );

  removeNodes(
    handAccessoryNodes
  );


  const accessory =
    normalize(value);


  if(
    !accessory ||
    accessory==="none"
  ){
    return;
  }


  if(accessory==="cap"){
    createCap();
    return;
  }


  if(accessory==="glasses"){
    createGlasses();
    return;
  }


  if(accessory==="chain"){
    createChain();
    return;
  }


  if(accessory==="watch"){
    createWatch();
    return;
  }


  if(accessory==="earrings"){
    createEarrings();
    return;
  }


  if(accessory==="headphones"){
    createHeadphones();
    return;
  }
}

/* =========================================================
   CHARACTER LOADING
========================================================= */

let currentCharacter=
  null;


async function loadCharacter(){

  try{

    const {
      data:sessionData,
      error:sessionError
    } =
      await db.auth.getSession();


    if(sessionError){
      throw sessionError;
    }


    const session =
      sessionData?.session;


    if(!session){

      throw new Error(
        "You are not logged in."
      );
    }


    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );


    if(error){
      throw error;
    }


    if(!data){

      throw new Error(
        "No Naija Hustle character was found."
      );
    }


    currentCharacter =
      Array.isArray(data)
        ? data[0]
        : data;


    if(!currentCharacter){

      throw new Error(
        "Character data is empty."
      );
    }


    applyCharacterAppearance(
      currentCharacter
    );


    playerName.textContent =
      currentCharacter.name ||
      "Player";


    const district =
      currentCharacter.district ||
      currentCharacter.current_district ||
      "";


    const level =
      currentCharacter.level;


    const details=[];


    if(district){
      details.push(
        district
      );
    }


    if(
      level !== undefined &&
      level !== null
    ){
      details.push(
        `Level ${level}`
      );
    }


    playerDetails.textContent =
      details.join(
        " • "
      );


    statusText.textContent=
      "Idle";


    loading.style.display=
      "none";


    return true;

  }catch(error){

    console.error(
      "3D avatar load error:",
      error
    );


    loading.classList.add(
      "error"
    );


    loading.innerHTML=`
      <div style="
        font-size:28px;
        margin-bottom:4px;
      ">⚠</div>

      <div>Unable to load your character.</div>

      <small>
        ${escapeHtml(
          error?.message ||
          "Unknown error"
        )}
      </small>

      <button
        id="retryButton"
        type="button"
      >
        Try Again
      </button>
    `;


    document
      .getElementById(
        "retryButton"
      )
      ?.addEventListener(
        "click",
        ()=>location.reload()
      );


    return false;
  }
}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
  document.getElementById(
    "controls"
  );

const stick=
  document.getElementById(
    "stick"
  );


let joystickX=0;
let joystickY=0;
let joystickDragging=false;


function updateJoystick(
  clientX,
  clientY
){

  const rect=
    joystick.getBoundingClientRect();


  const centerX=
    rect.left+
    rect.width/2;


  const centerY=
    rect.top+
    rect.height/2;


  let dx=
    clientX-centerX;


  let dy=
    clientY-centerY;


  const maxDistance=
    rect.width*.33;


  const distance=
    Math.hypot(
      dx,
      dy
    );


  if(
    distance>
    maxDistance
  ){

    dx=
      dx/distance*
      maxDistance;

    dy=
      dy/distance*
      maxDistance;
  }


  joystickX=
    THREE.MathUtils.clamp(
      dx/maxDistance,
      -1,
      1
    );


  joystickY=
    THREE.MathUtils.clamp(
      dy/maxDistance,
      -1,
      1
    );


  stick.style.transform=
    `translate3d(${dx}px,${dy}px,0)`;
}


function resetJoystick(){

  joystickDragging=false;

  joystickX=0;
  joystickY=0;

  stick.style.transform=
    "translate3d(0,0,0)";
}


joystick.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    joystickDragging=true;

    joystick.setPointerCapture(
      event.pointerId
    );

    updateJoystick(
      event.clientX,
      event.clientY
    );
  }
);


joystick.addEventListener(
  "pointermove",
  event=>{

    if(!joystickDragging)
      return;

    updateJoystick(
      event.clientX,
      event.clientY
    );
  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);


joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


joystick.addEventListener(
  "lostpointercapture",
  resetJoystick
);

========================================================= */

let cameraDragging=false;
let cameraPointerId=null;
let cameraLastX=0;
let cameraLastY=0;


renderer.domElement.addEventListener(
  "pointerdown",
  event=>{

    /*
      Left mouse / primary touch.
      Camera controls operate on the renderer,
      not the joystick/buttons.
    */

    cameraDragging=true;
    cameraPointerId=
      event.pointerId;

    cameraLastX=
      event.clientX;

    cameraLastY=
      event.clientY;

    renderer.domElement.setPointerCapture(
      event.pointerId
    );
  }
);


renderer.domElement.addEventListener(
  "pointermove",
  event=>{

    if(
      !cameraDragging ||
      event.pointerId !==
      cameraPointerId
    ){
      return;
    }


    const dx=
      event.clientX-
      cameraLastX;


    const dy=
      event.clientY-
      cameraLastY;


    cameraLastX=
      event.clientX;

    cameraLastY=
      event.clientY;


    cameraYaw -=
      dx*.008;


    cameraPitch=
      THREE.MathUtils.clamp(
        cameraPitch+
        dy*.005,
        .10,
        .78
      );
  }
);


function stopCameraDrag(){

  cameraDragging=false;
  cameraPointerId=null;
}


renderer.domElement.addEventListener(
  "pointerup",
  stopCameraDrag
);


renderer.domElement.addEventListener(
  "pointercancel",
  stopCameraDrag
);


renderer.domElement.addEventListener(
  "lostpointercapture",
  stopCameraDrag
);

/* =========================================================
   MOVEMENT
========================================================= */

const velocity =
  new THREE.Vector3();


const desiredVelocity =
  new THREE.Vector3();


const movementDirection =
  new THREE.Vector3();


const cameraForward =
  new THREE.Vector3();


const cameraRight =
  new THREE.Vector3();


const inputVector =
  new THREE.Vector2();


let animationPhase=0;
let lastState="Idle";


function readInput(){

  let x=0;
  let y=0;


  if(
    keys.a ||
    keys.arrowleft
  ){
    x-=1;
  }


  if(
    keys.d ||
    keys.arrowright
  ){
    x+=1;
  }


  if(
    keys.w ||
    keys.arrowup
  ){
    y+=1;
  }


  if(
    keys.s ||
    keys.arrowdown
  ){
    y-=1;
  }


  x+=joystickX;
  y-=joystickY;


  inputVector.set(
    x,
    y
  );


  if(
    inputVector.length()>
    1
  ){
    inputVector.normalize();
  }


  return inputVector.length()>
    .045;
}


function getCameraBasis(){

  cameraForward.set(
    -Math.sin(
      cameraYaw
    ),
    0,
    -Math.cos(
      cameraYaw
    )
  );


  cameraForward.normalize();


  cameraRight.set(
    Math.cos(
      cameraYaw
    ),
    0,
    -Math.sin(
      cameraYaw
    )
  );


  cameraRight.normalize();
}


function updateMovement(
  delta
){

  const hasInput=
    readInput();


  getCameraBasis();


  if(hasInput){

    movementDirection
      .set(0,0,0)
      .addScaledVector(
        cameraRight,
        inputVector.x
      )
      .addScaledVector(
        cameraForward,
        inputVector.y
      );


    movementDirection.y=0;


    if(
      movementDirection.lengthSq()>
      .0001
    ){

      movementDirection.normalize();
    }


    const sprinting=
      keys.shift ||
      mobileSprint ||
      Math.abs(joystickX)>.92 &&
      Math.abs(joystickY)>.92;


    const speed=
      sprinting
        ? 6.5
        : 4.15;


    desiredVelocity.copy(
      movementDirection
    ).multiplyScalar(
      speed
    );


    const acceleration=
      sprinting
        ? 13
        : 11;


    velocity.x=
      damp(
        velocity.x,
        desiredVelocity.x,
        acceleration,
        delta
      );


    velocity.z=
      damp(
        velocity.z,
        desiredVelocity.z,
        acceleration,
        delta
      );


    /* rotate avatar toward movement */

    const targetYaw=
      Math.atan2(
        movementDirection.x,
        -movementDirection.z
      );


    avatarYaw=
      dampAngle(
        avatarYaw,
        targetYaw,
        12,
        delta
      );


    visualRoot.rotation.y=
      avatarYaw;


  }else{

    velocity.x=
      damp(
        velocity.x,
        0,
        9,
        delta
      );


    velocity.z=
      damp(
        velocity.z,
        0,
        9,
        delta
      );
  }


  const speed=
    Math.hypot(
      velocity.x,
      velocity.z
    );


  const moving=
    speed>.12;


  const running=
    speed>5.0;


  /* move */

  avatar.position.x+=
    velocity.x*
    delta;

  avatar.position.z+=
    velocity.z*
    delta;


  /* keep player on the playable road */

  avatar.position.x=
    THREE.MathUtils.clamp(
      avatar.position.x,
      -4.6,
      4.6
    );


  avatar.position.z=
    THREE.MathUtils.clamp(
      avatar.position.z,
      -98,
      98
    );


  /* prevent boundary velocity */

  if(
    avatar.position.x<=-4.6 ||
    avatar.position.x>=4.6
  ){
    velocity.x=0;
  }


  if(
    avatar.position.z<=-98 ||
    avatar.position.z>=98
  ){
    velocity.z=0;
  }


  /* movement state */

  let newState=
    "Idle";


  if(running){
    newState=
      "Running";
  }else if(moving){
    newState=
      "Walking";
  }


  if(
    newState !==
    lastState
  ){

    lastState=
      newState;

    statusText.textContent=
      newState;
  }


  if(moving){

    const normalizedSpeed=
      THREE.MathUtils.clamp(
        speed/
        (
          running
            ? 6.5
            : 4.15
        ),
        0,
        1
      );


    animationPhase +=
      delta*
      (
        6.5+
        normalizedSpeed*9
      );


    animateWalking(
      animationPhase,
      normalizedSpeed,
      running,
      delta
    );

  }else{

    animationPhase +=
      delta*1.8;

    animateIdle(
      animationPhase,
      delta
    );
  }


  /* shadow scale */

  const shadowScale=
    1+
    Math.min(
      speed*.025,
      .12
    );

  avatarShadow.scale.x=
    shadowScale;

  avatarShadow.scale.y=
    shadowScale;
}


/* =========================================================
   WALK / RUN ANIMATION
========================================================= */

function animateWalking(
  time,
  intensity,
  running,
  delta
){

  const stride=
    (
      running
        ? .53
        : .36
    )*
    intensity;


  const leftPhase=
    Math.sin(time);


  const rightPhase=
    Math.sin(
      time+
      Math.PI
    );


  /* hips / thighs */

  leftLeg.hip.rotation.x=
    leftPhase*
    stride;


  rightLeg.hip.rotation.x=
    rightPhase*
    stride;


  /* knees */

  const leftKneeBend=
    Math.max(
      0,
      -leftPhase
    )*
    (
      running
        ? .34
        : .20
    )*
    intensity;


  const rightKneeBend=
    Math.max(
      0,
      -rightPhase
    )*
    (
      running
        ? .34
        : .20
    )*
    intensity;


  leftLeg.kneeGroup.rotation.x=
    leftKneeBend;


  rightLeg.kneeGroup.rotation.x=
    rightKneeBend;


  /* ankles */

  leftLeg.ankleGroup.rotation.x=
    -leftKneeBend*.25;


  rightLeg.ankleGroup.rotation.x=
    -rightKneeBend*.25;


  /* arms opposite to legs */

  leftArm.shoulder.rotation.x=
    -leftPhase*
    stride*
    .82;


  rightArm.shoulder.rotation.x=
    -rightPhase*
    stride*
    .82;


  /* elbow flex */

  leftArm.elbowGroup.rotation.x=
    -.06-
    leftKneeBend*.42;


  rightArm.elbowGroup.rotation.x=
    -.06-
    rightKneeBend*.42;


  /* torso rhythm */

  const torsoTwist=
    Math.sin(time)*
    .025*
    intensity;


  torso.rotation.z=
    damp(
      torso.rotation.z,
      torsoTwist,
      8,
      delta
    );


  /* subtle torso bob */

  const bob=
    Math.abs(
      Math.sin(time*2)
    )*
    (
      running
        ? .05
        : .032
    )*
    intensity;


  bodyRoot.position.y=
    damp(
      bodyRoot.position.y,
      bob,
      10,
      delta
    );


  /* head remains more stable */

  headGroup.rotation.z=
    damp(
      headGroup.rotation.z,
      Math.sin(
        time*
        .75
      )*.012*
      intensity,
      7,
      delta
    );
}


/* =========================================================
   IDLE ANIMATION
========================================================= */

function animateIdle(
  time,
  delta
){

  const breathing=
    Math.sin(
      time*
      1.55
    );


  bodyRoot.position.y=
    damp(
      bodyRoot.position.y,
      Math.abs(
        breathing
      )*
      .014,
      5,
      delta
    );


  torso.scale.y=
    damp(
      torso.scale.y,
      1+
      breathing*
      .008,
      4,
      delta
    );


  torso.rotation.z=
    damp(
      torso.rotation.z,
      Math.sin(
        time*.6
      )*
      .008,
      4,
      delta
    );


  leftLeg.hip.rotation.x=
    damp(
      leftLeg.hip.rotation.x,
      0,
      8,
      delta
    );


  rightLeg.hip.rotation.x=
    damp(
      rightLeg.hip.rotation.x,
      0,
      8,
      delta
    );


  leftLeg.kneeGroup.rotation.x=
    damp(
      leftLeg.kneeGroup.rotation.x,
      0,
      8,
      delta
    );


  rightLeg.kneeGroup.rotation.x=
    damp(
      rightLeg.kneeGroup.rotation.x,
      0,
      8,
      delta
    );


  leftLeg.ankleGroup.rotation.x=
    damp(
      leftLeg.ankleGroup.rotation.x,
      0,
      8,
      delta
    );


  rightLeg.ankleGroup.rotation.x=
    damp(
      rightLeg.ankleGroup.rotation.x,
      0,
      8,
      delta
    );


  leftArm.shoulder.rotation.x=
    damp(
      leftArm.shoulder.rotation.x,
      0,
      8,
      delta
    );


  rightArm.shoulder.rotation.x=
    damp(
      rightArm.shoulder.rotation.x,
      0,
      8,
      delta
    );


  leftArm.elbowGroup.rotation.x=
    damp(
      leftArm.elbowGroup.rotation.x,
      -.06,
      8,
      delta
    );


  rightArm.elbowGroup.rotation.x=
    damp(
      rightArm.elbowGroup.rotation.x,
      -.06,
      8,
      delta
    );


  headGroup.rotation.z=
    damp(
      headGroup.rotation.z,
      Math.sin(
        time*.55
      )*.006,
      4,
      delta
    );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(
  delta
){

  const horizontalDistance=
    CAMERA_DISTANCE*
    Math.cos(
      cameraPitch
    );


  const verticalOffset=
    CAMERA_HEIGHT+
    CAMERA_DISTANCE*
    Math.sin(
      cameraPitch
    );


  cameraPositionTarget.set(
    avatar.position.x+
      Math.sin(
        cameraYaw
      )*
      horizontalDistance,

    avatar.position.y+
      verticalOffset,

    avatar.position.z+
      Math.cos(
        cameraYaw
      )*
      horizontalDistance
  );


  /*
    Dynamic look target makes the camera
    feel less robotic while running.
  */

  const speed=
    Math.hypot(
      velocity.x,
      velocity.z
    );


  cameraLookTarget.set(
    avatar.position.x,
    avatar.position.y+
      1.52+
      Math.min(
        speed*.025,
        .08
      ),
    avatar.position.z
  );


  camera.position.lerp(
    cameraPositionTarget,
    1-
    Math.exp(
      -7*
      delta
    )
  );


  const currentLook =
    new THREE.Vector3();

  currentLook.copy(
    cameraLookTarget
  );


  camera.lookAt(
    currentLook
  );
}


/* =========================================================
   CAMERA / PLAYER VISUAL POLISH
========================================================= */

function updateVisualPolish(
  delta
){

  /*
    Small acceleration-based lean.
    This gives the character more weight.
  */

  const speed=
    Math.hypot(
      velocity.x,
      velocity.z
    );


  const lean=
    THREE.MathUtils.clamp(
      speed*.018,
      0,
      .10
    );


  bodyRoot.rotation.x=
    damp(
      bodyRoot.rotation.x,
      -lean,
      6,
      delta
    );


  /*
    Slight side sway while moving.
  */

  const lateral=
    THREE.MathUtils.clamp(
      velocity.x*.008,
      -.045,
      .045
    );


  bodyRoot.rotation.z=
    damp(
      bodyRoot.rotation.z,
      lateral,
      6,
      delta
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        1.75
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);


/* =========================================================
   BACK BUTTON
========================================================= */

document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    ()=>{

      if(
        window.history.length>1
      ){

        window.history.back();

      }else{

        window.location.href=
          "index.html";
      }
    }
  );


/* =========================================================
   CLOCK
========================================================= */

const clock=
  new THREE.Clock();


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );


  updateMovement(
    delta
  );


  updateVisualPolish(
    delta
  );


  updateCamera(
    delta
  );


  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   STARTUP
========================================================= */

const loaded=
  await loadCharacter();


if(loaded){

  avatarYaw=
    Math.PI;

  visualRoot.rotation.y=
    avatarYaw;

  animate();
}

</script>
