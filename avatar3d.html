<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Naija Hustle — Avatar</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#87c9d8;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  z-index:20;
}

.panel{
  background:rgba(10,16,20,.72);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:16px;
}

#info{
  padding:11px 14px;
  min-width:145px;
}

#name{
  font-size:15px;
  font-weight:800;
}

#sub{
  margin-top:2px;
  color:#c9d4d8;
  font-size:11px;
}

#status{
  margin-top:7px;
  color:#ffd54a;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}

#topButtons{
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.uiBtn{
  min-width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:13px;
  background:rgba(10,16,20,.75);
  color:white;
  font-weight:800;
  cursor:pointer;
  backdrop-filter:blur(12px);
}

.uiBtn:active{
  transform:scale(.95);
}

#backBtn{
  position:fixed;
  left:14px;
  bottom:14px;
  z-index:30;
  height:48px;
  padding:0 17px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(10,16,20,.78);
  color:white;
  font-weight:800;
}

#customizeBtn{
  position:fixed;
  right:14px;
  bottom:14px;
  z-index:30;
  height:48px;
  padding:0 17px;
  border:0;
  border-radius:15px;
  background:#f3c53f;
  color:#171717;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

#joystick{
  position:fixed;
  left:18px;
  bottom:82px;
  width:126px;
  height:126px;
  border-radius:50%;
  background:rgba(10,16,20,.22);
  border:1px solid rgba(255,255,255,.18);
  z-index:25;
  display:none;
}

#stick{
  position:absolute;
  width:54px;
  height:54px;
  left:36px;
  top:36px;
  border-radius:50%;
  background:rgba(255,255,255,.86);
  box-shadow:0 5px 18px rgba(0,0,0,.2);
}

#runBtn{
  position:fixed;
  right:18px;
  bottom:82px;
  width:76px;
  height:76px;
  border-radius:50%;
  z-index:25;
  display:none;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(10,16,20,.68);
  color:white;
  font-weight:900;
}

#runBtn.active{
  background:#f3c53f;
  color:#171717;
}

#customizer{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  background:rgba(8,12,15,.96);
  border-top:1px solid rgba(255,255,255,.1);
  box-shadow:0 -20px 50px rgba(0,0,0,.35);
  transform:translateY(105%);
  transition:transform .3s cubic-bezier(.22,.8,.25,1);
  padding:14px;
  max-height:76vh;
  overflow:auto;
  overscroll-behavior:contain;
}

#customizer.open{
  transform:translateY(0);
}

.sheetHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.sheetTitle{
  font-size:17px;
  font-weight:900;
}

.close{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:#151c20;
  color:#fff;
}

.section{
  margin-top:15px;
}

.sectionTitle{
  font-size:11px;
  color:#9eabb0;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:900;
  margin-bottom:8px;
}

.options{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
}

.option{
  flex:0 0 auto;
  min-width:82px;
  min-height:56px;
  padding:9px 11px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.1);
  background:#151c20;
  color:#e9edef;
  font-size:11px;
  font-weight:800;
}

.option.selected{
  border-color:#f3c53f;
  background:#332d17;
  color:#ffd84e;
}

#saveConfig{
  width:100%;
  height:50px;
  margin-top:17px;
  border:0;
  border-radius:15px;
  background:#f3c53f;
  color:#151515;
  font-weight:950;
  font-size:14px;
}

#jsonOutput{
  display:none;
  width:100%;
  min-height:110px;
  margin-top:10px;
  resize:none;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:10px;
  background:#090d0f;
  color:#b9e7d4;
  font:11px monospace;
}

#loading{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#10191d;
  transition:opacity .35s ease;
}

#loading.hidden{
  opacity:0;
  pointer-events:none;
}

.loader{
  width:42px;
  height:42px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.15);
  border-top-color:#f3c53f;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.loadingText{
  margin-top:13px;
  color:#d9e0e2;
  font-size:12px;
  font-weight:700;
}

@media (pointer:coarse){
  #joystick,
  #runBtn{
    display:block;
  }
}

@media (min-width:800px){
  #customizer{
    left:auto;
    right:18px;
    bottom:18px;
    width:390px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    transform:translateX(110%);
    max-height:80vh;
  }

  #customizer.open{
    transform:translateX(0);
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="info" class="panel">
    <div id="name">Naija Hustle</div>
    <div id="sub">Avatar</div>
    <div id="status">Idle</div>
  </div>

  <div id="topButtons">
    <button class="uiBtn" id="cameraBtn">C</button>
  </div>
</div>

<button id="backBtn">← Back</button>
<button id="customizeBtn">Customize</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="runBtn">RUN</button>

<div id="customizer">
  <div class="sheetHead">
    <div class="sheetTitle">Customize Avatar</div>
    <button class="close" id="closeCustomizer">×</button>
  </div>

  <div class="section">
    <div class="sectionTitle">Skin tone</div>
    <div class="options" id="skinOptions"></div>
  </div>

  <div class="section">
    <div class="sectionTitle">Hairstyle</div>
    <div class="options" id="hairOptions"></div>
  </div>

  <div class="section">
    <div class="sectionTitle">Hair colour</div>
    <div class="options" id="hairColorOptions"></div>
  </div>

  <div class="section">
    <div class="sectionTitle">Outfit</div>
    <div class="options" id="outfitOptions"></div>
  </div>

  <div class="section">
    <div class="sectionTitle">Accessory</div>
    <div class="options" id="accessoryOptions"></div>
  </div>

  <button id="saveConfig">SAVE AVATAR</button>
  <textarea id="jsonOutput" readonly></textarea>
</div>

<div id="loading">
  <div class="loader"></div>
  <div class="loadingText">Loading Naija Hustle...</div>
</div>

<script type="module">

/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

  movement:{
    walkSpeed:4.1,
    runSpeed:6.6,
    acceleration:12,
    deceleration:16,
    rotationSpeed:10
  },

  world:{
    size:110,
    roadWidth:14
  },

  camera:{
    distance:7.2,
    height:4.0,
    smoothing:7
  },

  avatar:{
    height:3.15
  }

};


/* =========================================================
   CUSTOMIZATION DATA
   Add new options here.
========================================================= */

const OPTIONS = {

  skinTone:{
    light:"#f3c39e",
    honey:"#d99b6c",
    brown:"#a96842",
    deep:"#70412f",
    dark:"#4c2d25"
  },

  hairstyle:{
    low_cut:"Low Cut",
    fade:"Fade",
    afro:"Afro",
    twists:"Twists",
    braids:"Braids",
    locs:"Locs",
    headwrap:"Headwrap"
  },

  hairColor:{
    black:"#171311",
    brown:"#3a2419",
    darkBrown:"#211712",
    burgundy:"#3b171d"
  },

  outfit:{
    hoodie:{
      name:"Hoodie",
      shirt:"#263747",
      pants:"#171b20"
    },

    jersey:{
      name:"Jersey",
      shirt:"#147a73",
      pants:"#20252b"
    },

    kaftan:{
      name:"Kaftan",
      shirt:"#d7d0bc",
      pants:"#3b3b38"
    },

    agbada:{
      name:"Agbada",
      shirt:"#f0e6c9",
      pants:"#4b4232"
    },

    ankara:{
      name:"Ankara",
      shirt:"#d8a22b",
      pants:"#222d39"
    },

    suit:{
      name:"Suit",
      shirt:"#20252e",
      pants:"#17191e"
    }
  },

  accessory:{
    none:"None",
    cap:"Cap",
    glasses:"Glasses",
    chain:"Chain",
    headphones:"Headphones"
  }

};


/* =========================================================
   GLOBAL STATE
========================================================= */

const state = {

  config:{
    skinTone:"brown",
    hairstyle:"fade",
    hairColor:"black",
    outfit:"hoodie",
    accessory:"none"
  },

  keys:{
    up:false,
    down:false,
    left:false,
    right:false,
    run:false
  },

  joystick:{
    active:false,
    x:0,
    y:0
  },

  running:false,
  cameraMode:0,

  velocity:new THREE.Vector3(),

  cameraYaw:0,

  cameraPitch:.18

};


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color("#8fcbd6");

scene.fog = new THREE.Fog(
  "#8fcbd6",
  28,
  105
);


const camera = new THREE.PerspectiveCamera(
  48,
  innerWidth / innerHeight,
  .05,
  180
);

camera.position.set(
  0,
  4,
  7
);


const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

renderer.toneMapping=
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.05;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
  new THREE.HemisphereLight(
    "#e7fbff",
    "#3f5547",
    2.1
  );

scene.add(hemi);


const key =
  new THREE.DirectionalLight(
    "#fff2d1",
    3.0
  );

key.position.set(
  -8,
  14,
  8
);

key.castShadow=true;

key.shadow.mapSize.set(
  1024,
  1024
);

key.shadow.camera.left=-20;
key.shadow.camera.right=20;
key.shadow.camera.top=20;
key.shadow.camera.bottom=-20;

key.shadow.bias=-.0005;

scene.add(key);


const rim =
  new THREE.DirectionalLight(
    "#77d9d0",
    1.1
  );

rim.position.set(
  8,
  7,
  -8
);

scene.add(rim);


/* =========================================================
   MATERIAL CACHE
========================================================= */

const materialCache = new Map();


function material(
  color,
  roughness=.72,
  metalness=0
){

  const key =
    `${color}_${roughness}_${metalness}`;

  if(materialCache.has(key)){
    return materialCache.get(key);
  }

  const m =
    new THREE.MeshStandardMaterial({
      color,
      roughness,
      metalness
    });

  materialCache.set(key,m);

  return m;
}


/* =========================================================
   GEOMETRY CACHE
========================================================= */

const geometryCache = {};


function sphereGeometry(
  radius,
  width=24,
  height=16
){

  const key=
    `sphere_${radius}_${width}_${height}`;

  if(!geometryCache[key]){
    geometryCache[key]=
      new THREE.SphereGeometry(
        radius,
        width,
        height
      );
  }

  return geometryCache[key];
}


function capsuleGeometry(
  radius,
  length,
  capSegments=6,
  radialSegments=12
){

  const key=
    `capsule_${radius}_${length}_${capSegments}_${radialSegments}`;

  if(!geometryCache[key]){

    geometryCache[key]=
      new THREE.CapsuleGeometry(
        radius,
        length,
        capSegments,
        radialSegments
      );

  }

  return geometryCache[key];
}


/* =========================================================
   MESH HELPERS
========================================================= */

function makeSphere(
  radius,
  color
){

  const mesh =
    new THREE.Mesh(
      sphereGeometry(radius),
      material(color)
    );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  return mesh;
}


function makeCapsule(
  radius,
  length,
  color
){

  const mesh =
    new THREE.Mesh(
      capsuleGeometry(radius,length),
      material(color)
    );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  return mesh;
}


function makeBox(
  x,
  y,
  z,
  color,
  radius=.08
){

  const geometry =
    new THREE.BoxGeometry(
      x,y,z
    );

  const mesh =
    new THREE.Mesh(
      geometry,
      material(color)
    );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  return mesh;
}


/* =========================================================
   WORLD
========================================================= */

function createWorld(){

  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        CONFIG.world.size,
        CONFIG.world.size
      ),
      material("#4d7755")
    );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);


  /* Road */

  const road =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        CONFIG.world.roadWidth,
        CONFIG.world.size
      ),
      material("#303437",.92)
    );

  road.rotation.x=-Math.PI/2;
  road.position.y=.008;

  scene.add(road);


  /* Lane markings */

  for(
    let z=-50;
    z<55;
    z+=8
  ){

    const marker =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          .16,
          4
        ),
        material("#eee9cf")
      );

    marker.rotation.x=-Math.PI/2;

    marker.position.set(
      0,
      .015,
      z
    );

    scene.add(marker);
  }


  /* Pavements */

  for(const x of [-9,9]){

    const pavement =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          3,
          .16,
          CONFIG.world.size
        ),
        material("#8a8980")
      );

    pavement.position.set(
      x,
      .08,
      0
    );

    pavement.receiveShadow=true;

    scene.add(pavement);
  }


  createBuildings();
  createStreetLights();
  createTrees();
  createDanfo();


  /* Distant Lagos skyline */

  const skyline =
    new THREE.Group();

  for(
    let i=0;
    i<22;
    i++
  ){

    const width=
      2+Math.random()*4;

    const height=
      5+Math.random()*13;

    const building=
      makeBox(
        width,
        height,
        2+Math.random()*3,
        i%3===0
          ? "#6d8b91"
          : "#526c73"
      );

    building.position.set(
      -52+i*5,
      height/2,
      -38-Math.random()*8
    );

    skyline.add(building);
  }

  scene.add(skyline);
}


function createBuildings(){

  for(
    let z=-45;
    z<=45;
    z+=12
  ){

    for(
      const x of [-16,16]
    ){

      const width=
        5+Math.random()*3;

      const depth=
        6+Math.random()*3;

      const height=
        5+Math.random()*8;

      const building=
        makeBox(
          width,
          height,
          depth,
          Math.random()>.5
            ? "#c1a783"
            : "#a8b4ae"
        );

      building.position.set(
        x,
        height/2,
        z
      );

      scene.add(building);


      /* windows */

      for(
        let y=1.7;
        y<height-1;
        y+=1.7
      ){

        const windows=
          makeBox(
            width*.62,
            .65,
            .04,
            "#273b40"
          );

        windows.position.set(
          x,
          y,
          z-depth/2-.025
        );

        scene.add(windows);
      }
    }
  }
}


function createStreetLights(){

  for(
    let z=-48;
    z<=48;
    z+=12
  ){

    for(
      const x of [-10.5,10.5]
    ){

      const pole=
        makeCapsule(
          .055,
          3.2,
          "#35383a"
        );

      pole.position.set(
        x,
        1.7,
        z
      );

      scene.add(pole);


      const lamp=
        makeSphere(
          .18,
          "#ffd76b"
        );

      lamp.position.set(
        x,
        3.4,
        z
      );

      scene.add(lamp);
    }
  }
}


function createTrees(){

  for(
    let i=0;
    i<18;
    i++
  ){

    const x=
      (Math.random()>.5?1:-1)
      *(12+Math.random()*7);

    const z=
      -50+Math.random()*100;


    const trunk=
      makeCapsule(
        .16,
        1.8,
        "#684a32"
      );

    trunk.position.set(
      x,
      .9,
      z
    );

    scene.add(trunk);


    const crown=
      makeSphere(
        .85+Math.random()*.35,
        "#2d6b45"
      );

    crown.position.set(
      x,
      2.25,
      z
    );

    scene.add(crown);
  }
}


function createDanfo(){

  const bus=
    new THREE.Group();

  const body=
    makeBox(
      2.25,
      1.15,
      4.2,
      "#e7b928"
    );

  body.position.y=.9;

  bus.add(body);


  const lower=
    makeBox(
      2.28,
      .25,
      4.22,
      "#26282b"
    );

  lower.position.y=.38;

  bus.add(lower);


  for(
    const z of [-1.3,0,1.3]
  ){

    const window=
      makeBox(
        2.3,
        .48,
        .7,
        "#28464c"
      );

    window.position.set(
      0,
      1.22,
      z
    );

    bus.add(window);
  }


  bus.position.set(
    13,
    1,
    -12
  );

  bus.rotation.y=
    Math.PI/2;

  scene.add(bus);
}


/* =========================================================
   AVATAR
========================================================= */

const avatar =
  new THREE.Group();

avatar.position.set(
  0,
  0,
  0
);

scene.add(avatar);


const rig =
  new THREE.Group();

avatar.add(rig);


const hips =
  new THREE.Group();

hips.position.y=.98;

rig.add(hips);


const torso =
  new THREE.Group();

torso.position.y=1.25;

rig.add(torso);


const head =
  new THREE.Group();

head.position.y=2.55;

rig.add(head);


/* Body parts */

let bodyParts={};

let hairParts=[];
let accessoryParts=[];


function clearGroup(group){

  while(group.children.length){

    const child=
      group.children.pop();

    child.traverse(obj=>{

      if(obj.geometry &&
         !Object.values(geometryCache)
          .includes(obj.geometry)){

        obj.geometry.dispose();
      }

      if(obj.material &&
         !materialCache.has(
           [...materialCache.entries()]
             .find(
               ([,m])=>m===obj.material
             )?.[0]
         )){

        obj.material.dispose();
      }

    });
  }
}


/* =========================================================
   BUILD AVATAR
========================================================= */

function buildAvatar(){

  while(rig.children.length){
    rig.remove(rig.children[0]);
  }

  bodyParts={};
  hairParts=[];
  accessoryParts=[];


  const skin =
    OPTIONS.skinTone[state.config.skinTone]
      || OPTIONS.skinTone.brown;

  const hair =
    OPTIONS.hairColor[state.config.hairColor]
      || OPTIONS.hairColor.black;

  const outfit =
    OPTIONS.outfit[state.config.outfit]
      || OPTIONS.outfit.hoodie;


  /* -------------------------
     HIPS
  ------------------------- */

  const pelvis=
    makeCapsule(
      .30,
      .28,
      skin
    );

  pelvis.scale.set(
    1.15,
    .72,
    .82
  );

  hips.add(pelvis);


  /* -------------------------
     LEGS
  ------------------------- */

function buildHair(
  style,
  color
){

  const hairMaterial=material(color);


  if(style==="headwrap"){

    const wrap=
      makeSphere(
        .59,
        "#c8942f"
      );

    wrap.scale.set(
      1,
      .72,
      1
    );

    wrap.position.y=.20;

    head.add(wrap);

    hairParts.push(wrap);

    return;
  }


  /* base hair cap */

  const cap=
    makeSphere(
      .56,
      color
    );

  cap.scale.set(
    1,
    .66,
    1
  );

  cap.position.y=.28;

  head.add(cap);

  hairParts.push(cap);


  if(style==="fade"){

    const top=
      makeSphere(
        .42,
        color
      );

    top.scale.set(
      1,
      .32,
      .95
    );

    top.position.y=.52;

    head.add(top);

    hairParts.push(top);
  }


  if(style==="low_cut"){

    const top=
      makeSphere(
        .45,
        color
      );

    top.scale.set(
      1,
      .28,
      .94
    );

    top.position.y=.47;

    head.add(top);

    hairParts.push(top);
  }


  if(style==="afro"){

    for(
      let i=0;
      i<19;
      i++
    ){

      const angle=
        Math.random()*Math.PI*2;

      const radius=
        .44+Math.random()*.12;

      const puff=
        makeSphere(
          .16+Math.random()*.06,
          color
        );

      puff.position.set(
        Math.cos(angle)*radius,
        .35+Math.random()*.28,
        Math.sin(angle)*radius*.75
      );

      head.add(puff);

      hairParts.push(puff);
    }
  }


  if(
    style==="twists" ||
    style==="braids" ||
    style==="locs"
  ){

    const count=
      style==="locs"
        ? 15
        : 13;

    for(
      let i=0;
      i<count;
      i++
    ){

      const angle=
        (i/count)*Math.PI*2;

      const strand=
        makeCapsule(
          style==="locs"
            ? .065
            : .045,
          .30+
            Math.random()*.35,
          color
        );

      strand.position.set(
        Math.cos(angle)*.48,
        .20+
          Math.random()*.12,
        Math.sin(angle)*.42
      );

      strand.rotation.x=
        Math.cos(angle)*.35;

      strand.rotation.z=
        Math.sin(angle)*.35;

      head.add(strand);

      hairParts.push(strand);
    }
  }
}

    ){

      const button=

      button.className="option";

      button.dataset.type=type;
      button.dataset.value=key;

      if(
        typeof OPTIONS[type][key]==="object"

        label=

      else{

        label=
          key
            .replaceAll("_"," ")
            .replace(/\b\w/g,c=>c.toUpperCase());

        "click",

          state.config[type]=key;

      container.appendChild(button);

  updateSelectedButtons();
}

/* =========================================================
   MOVEMENT
========================================================= */

const clock=
  new THREE.Clock();

let previousTime=
  performance.now();


function getInput(){

  let x=0;
  let z=0;


  if(state.keys.left) x-=1;
  if(state.keys.right) x+=1;
  if(state.keys.up) z-=1;
  if(state.keys.down) z+=1;


  if(
    state.joystick.active
  ){

    x=state.joystick.x;
    z=state.joystick.y;
  }


  const length=
    Math.hypot(x,z);

  if(length>1){

    x/=length;
    z/=length;
  }


  return {x,z};
}


function smoothDamp(
  current,
  target,
  smoothing,
  delta
){

  const t=
    1-Math.exp(
      -smoothing*delta
    );

  return THREE.MathUtils.lerp(
    current,
    target,
    t
  );
}


function moveAvatar(delta){

  const input=
    getInput();

  const hasInput=
    Math.hypot(
      input.x,
      input.z
    )>.08;


  const speed=
    state.running
      ? CONFIG.movement.runSpeed
      : CONFIG.movement.walkSpeed;


  const targetVelocity=
    new THREE.Vector3(
      input.x*speed,
      0,
      input.z*speed
    );


  const acceleration=
    hasInput
      ? CONFIG.movement.acceleration
      : CONFIG.movement.deceleration;


  const blend=
    1-Math.exp(
      -acceleration*delta
    );


  state.velocity.lerp(
    targetVelocity,
    blend
  );


  /* Camera-relative movement */

  const cameraForward=
    new THREE.Vector3();

  camera.getWorldDirection(
    cameraForward
  );

  cameraForward.y=0;
  cameraForward.normalize();


  const cameraRight=
    new THREE.Vector3(
      cameraForward.z,
      0,
      -cameraForward.x
  );


  const movement=
    new THREE.Vector3();

  movement.addScaledVector(
    cameraRight,
    state.velocity.x*delta
  );

  movement.addScaledVector(
    cameraForward,
    -state.velocity.z*delta
  );


  avatar.position.add(
    movement
  );


  /* World boundary */

  const limit=
    CONFIG.world.size/2-4;

  avatar.position.x=
    THREE.MathUtils.clamp(
      avatar.position.x,
      -limit,
      limit
    );

  avatar.position.z=
    THREE.MathUtils.clamp(
      avatar.position.z,
      -limit,
      limit
    );


  /* Smooth character rotation */

  if(hasInput){

    const targetAngle=
      Math.atan2(
        movement.x,
        movement.z
      );


    let difference=
      targetAngle-avatar.rotation.y;


    difference=
      Math.atan2(
        Math.sin(difference),
        Math.cos(difference)
      );


    avatar.rotation.y +=
      difference*
      Math.min(
        1,
        CONFIG.movement.rotationSpeed*
        delta
      );
  }


  const currentSpeed=
    Math.hypot(
      state.velocity.x,
      state.velocity.z
    );


  const moving=
    currentSpeed>.15;


  if(
    state.running &&
    moving
  ){

    document
      .getElementById("status")
      .textContent="Running";

  }
  else if(moving){

    document
      .getElementById("status")
      .textContent="Walking";

  }
  else{

    document
      .getElementById("status")
      .textContent="Idle";
  }


  return {
    moving,
    speed:currentSpeed
  };
}


/* =========================================================
   CHARACTER ANIMATION
========================================================= */

let animationTime=0;


function animateCharacter(
  delta,
  movement
){

  animationTime +=
    delta*
    (movement.moving
      ? movement.speed*1.75
      : .75);


  const moving=
    movement.moving;

  const running=
    state.running &&
    moving;


  const intensity=
    running
      ? 1.12
      : .72;


  const cycle=
    animationTime;


  /* Legs */

  if(bodyParts.leftUpperLeg){

    const swing=
      Math.sin(cycle)*
      (moving ? .58*intensity : .025);

    bodyParts.leftUpperLeg.rotation.x=
      swing;

    bodyParts.rightUpperLeg.rotation.x=
      -swing;

    bodyParts.leftLowerLeg.rotation.x=
      Math.max(
        0,
        -swing*.75
      );

    bodyParts.rightLowerLeg.rotation.x=
      Math.max(
        0,
        swing*.75
      );
  }


  /* Arms */

  if(bodyParts.leftArm){

    const swing=
      Math.sin(cycle)*
      (moving ? .48*intensity : .025);

    bodyParts.leftArm.rotation.x=
      -swing;

    bodyParts.rightArm.rotation.x=
      swing;
  }


  /* Breathing */

  const breathing=
    moving
      ? 0
      : Math.sin(
          performance.now()*.0015
        )*.018;


  torso.scale.y=
    1+breathing;

  head.position.y=
    2.55+
    (
      moving
        ? Math.abs(Math.sin(cycle*2))*.035
        : breathing*.45
    );


  /* Gentle torso movement */

  if(moving){

    torso.rotation.z=
      Math.sin(cycle)*
      .025;

    torso.rotation.x=
      Math.cos(cycle*2)*
      .018;

  }
  else{

    torso.rotation.z=
      smoothDamp(
        torso.rotation.z,
        0,
        7,
        delta
      );

    torso.rotation.x=
      smoothDamp(
        torso.rotation.x,
        0,
        7,
        delta
      );
  }


  updateBlink();
}


/* =========================================================
   BLINK
========================================================= */

let blinkTimer=
  3.8+Math.random()*1.2;

let blinkProgress=0;


function updateBlink(){

  const delta=
    clock.getDelta();

  blinkTimer-=delta;


  if(
    blinkTimer<=0 &&
    blinkProgress===0
  ){

    blinkProgress=.001;

    blinkTimer=
      3+
      Math.random()*2;
  }


  if(blinkProgress>0){

    blinkProgress+=delta*7;

    const amount=
      Math.sin(
        Math.min(
          blinkProgress,
          Math.PI
        )
      );


    head.traverse(
      object=>{

        if(
          object.geometry &&
          object.geometry.type===
            "SphereGeometry"
        ){

          /*
            Deliberately subtle.
            The eyes are found by position.
          */

          if(
            object.position.z<-.5 &&
            Math.abs(object.position.x)<.3 &&
            object.position.y>.02 &&
            object.position.y<.15
          ){

            object.scale.y=
              Math.max(
                .08,
                1-amount*.9
              );
          }
        }
      }
    );


    if(
      blinkProgress>=Math.PI
    ){

      blinkProgress=0;

      head.traverse(
        object=>{

          if(
            object.geometry &&
            object.geometry.type===
              "SphereGeometry" &&
            object.position.z<-.5 &&
            Math.abs(object.position.x)<.3 &&
            object.position.y>.02 &&
            object.position.y<.15
          ){

            object.scale.y=1;
          }
        }
      );
    }
  }
}


/* =========================================================
   CAMERA
========================================================= */

const cameraTarget=
  new THREE.Vector3();


let cameraDistance=
  CONFIG.camera.distance;

let cameraDragging=false;

let lastPointerX=0;
let lastPointerY=0;


function updateCamera(delta){

  const target=
    avatar.position.clone();

  target.y+=1.45;


  let desiredDistance=
    cameraDistance;

  let yaw=
    state.cameraYaw;

  let pitch=
    state.cameraPitch;


  if(state.cameraMode===1){

    desiredDistance=5.0;

    pitch=.10;

  }


  const offset=
    new THREE.Vector3(
      Math.sin(yaw)*
        desiredDistance,
      CONFIG.camera.height+
        pitch*2,
      Math.cos(yaw)*
        desiredDistance
    );


  const desired=
    target.clone().add(offset);


  camera.position.lerp(
    desired,
    1-Math.exp(
      -CONFIG.camera.smoothing*
      delta
    )
  );


  cameraTarget.lerp(
    target,
    1-Math.exp(
      -9*delta
    )
  );


  camera.lookAt(
    cameraTarget
  );
}


/* =========================================================
   CAMERA DRAG
========================================================= */

renderer.domElement.addEventListener(
  "pointerdown",
  event=>{

    cameraDragging=true;

    lastPointerX=
      event.clientX;

    lastPointerY=
      event.clientY;
  }
);


renderer.domElement.addEventListener(
  "pointermove",
  event=>{

    if(!cameraDragging)return;


    const dx=
      event.clientX-lastPointerX;

    const dy=
      event.clientY-lastPointerY;


    lastPointerX=
      event.clientX;

    lastPointerY=
      event.clientY;


    state.cameraYaw-=
      dx*.008;

    state.cameraPitch=
      THREE.MathUtils.clamp(
        state.cameraPitch+
        dy*.003,
        -.25,
        .65
      );
  }
);


window.addEventListener(
  "pointerup",
  ()=>{
    cameraDragging=false;
  }
);


/* =========================================================
   CAMERA BUTTON
========================================================= */

document
  .getElementById("cameraBtn")
  .addEventListener(
    "click",
    ()=>{
      state.cameraMode=
        state.cameraMode===0
          ? 1
          : 0;
    }
  );


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  event=>{

    const key=
      event.key.toLowerCase();


    if(
      ["w","a","s","d",
       "arrowup","arrowdown",
       "arrowleft","arrowright",
       "shift"," "]
       .includes(key)
    ){

      event.preventDefault();
    }


    if(key==="w" || key==="arrowup")
      state.keys.up=true;

    if(key==="s" || key==="arrowdown")
      state.keys.down=true;

    if(key==="a" || key==="arrowleft")
      state.keys.left=true;

    if(key==="d" || key==="arrowright")
      state.keys.right=true;

    if(key==="shift")
      state.keys.run=true;
  }
);


window.addEventListener(
  "keyup",
  event=>{

    const key=
      event.key.toLowerCase();


    if(key==="w" || key==="arrowup")
      state.keys.up=false;

    if(key==="s" || key==="arrowdown")
      state.keys.down=false;

    if(key==="a" || key==="arrowleft")
      state.keys.left=false;

    if(key==="d" || key==="arrowright")
      state.keys.right=false;

    if(key==="shift")
      state.keys.run=false;
  }
);


/* =========================================================
   RUN BUTTON
========================================================= */

function setRun(value){

  state.running=value;

  runButton.classList.toggle(
    "active",
    value
  );
}


runButton.addEventListener(
  "pointerdown",
  event=>{
    event.preventDefault();

  }
);


runButton.addEventListener(

    setRun(false);
  }
);


runButton.addEventListener(
  "pointercancel",

    setRun(false);
  }
);


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick=
  document.getElementById(
    "joystick"
  );

const stick=
  document.getElementById(
    "stick"
  );


let joystickPointer=null;


function updateJoystick(
  clientX,
  clientY
){

  const rect=
    joystick.getBoundingClientRect();

  const centerX=
    rect.left+rect.width/2;

  const centerY=
    rect.top+rect.height/2;


  let x=
    clientX-centerX;

  let y=
    clientY-centerY;


  const radius=
    rect.width*.34;

  const distance=
    Math.hypot(x,y);


  if(distance>radius){

    x=
      x/distance*radius;

    y=
      y/distance*radius;
  }


  state.joystick.x=
    x/radius;

  state.joystick.y=
    y/radius;


  stick.style.transform=
    `translate(${x}px,${y}px)`;
}


joystick.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    joystickPointer=
      event.pointerId;

    joystick.setPointerCapture(
      event.pointerId
    );

    state.joystick.active=true;

    updateJoystick(
      event.clientX,
      event.clientY
    );
  }
);


joystick.addEventListener(
  "pointermove",
  event=>{

    if(
      event.pointerId!==joystickPointer
    )return;

    updateJoystick(
      event.clientX,
      event.clientY
    );
  }
);


function resetJoystick(){

  joystickPointer=null;

  state.joystick.active=false;

  state.joystick.x=0;
  state.joystick.y=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        2
      )
    );
  }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const now=
    performance.now();

  const delta=
    Math.min(
      .033,
      (now-previousTime)/1000
    );

  previousTime=now;


  state.running=
    state.keys.run ||
    (
      state.running &&
      state.joystick.active
    );


  const movement=
    moveAvatar(delta);


  animateCharacter(
    delta,
    movement
  );


  updateCamera(
    delta
  );


  renderer.render(
    scene,
    camera
  );
}


createWorld();

updateCamera(.016);

animate();


/* =========================================================
   LOADING SCREEN
========================================================= */

requestAnimationFrame(
  ()=>{
    setTimeout(
      ()=>{
        document
          .getElementById("loading")
          .classList.add("hidden");
      },
      450
    );
  }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    renderer.dispose();

    for(
      const geometry of Object.values(
        geometryCache
      )
    ){

      geometry.dispose();
    }

    for(
      const material of materialCache.values()
    ){

      material.dispose();
    }
  }
);
