function mesh(
  geometry,
  material
){

  const m =
    new THREE.Mesh(
      geometry,
      material
    );

  m.castShadow = true;
  m.receiveShadow = true;

  return m;
}

function capsule(
  radius,
  length,
  material
){

  return mesh(
    new THREE.CapsuleGeometry(
      radius,
      length,
      8,
      16
    ),
    material
  );
}

function sphere(
  radius,
  material,
  segments=24
){

  return mesh(
    new THREE.SphereGeometry(
      radius,
      segments,
      segments
    ),
    material
  );
}

function box(
  x,
  y,
  z,
  material,
  bevel=.03
){

  const geometry =
    new THREE.BoxGeometry(
      x,
      y,
      z
    );

  const object =
    mesh(
      geometry,
      material
    );

  return object;
}

function normalize(value){

  return String(
    value || ""
  )
  .trim()
  .toLowerCase()
  .replace(/[\s-]+/g,"_");
}

/* =========================================================
   HAIR HELPERS
========================================================= */

function clearHairExtras(){

  while(
    hairExtras.children.length
  ){

    const child =
      hairExtras.children.pop();

    child.traverse(
      obj=>{
        if(obj.geometry)
          obj.geometry.dispose();
      }
    );
  }
}


function hairPiece(
  x,
  y,
  z,
  sx,
  sy,
  sz
){

  const p =
    sphere(
      .13,
      hairMaterial,
      14
    );

  p.position.set(
    x,
    y,
    z
  );

  p.scale.set(
    sx,
    sy,
    sz
  );

  hairExtras.add(p);

  return p;
}


function applyHairstyle(value){

  const style =
    normalize(value);

  clearHairExtras();

  hair.visible=true;

  hair.scale.set(
    1,
    .75,
    1
  );


  if(style==="low_cut" ||
     style==="lowcut"){

    hair.scale.set(
      1,
      .45,
      1
    );

    return;
  }


  if(style==="fade"){

    hair.scale.set(
      1,
      .58,
      1
    );

    hairPiece(
      0,
      .42,
      -.01,
      .7,
      .25,
      .7
    );

    return;
  }


  if(style==="afro"){

    hair.scale.set(
      1.35,
      1.25,
      1.3
    );

    return;
  }


  if(style==="braids"){

    hair.scale.set(
      1.03,
      .82,
      1.03
    );

    for(
      let i=-3;
      i<=3;
      i++
    ){

      hairPiece(
        i*.105,
        -.02,
        -.03,
        .34,
        1.9,
        .34
      );
    }

    return;
  }


  if(style==="dreads"){

    hair.scale.set(
      1.08,
      .9,
      1.08
    );

    for(
      let i=-3;
      i<=3;
      i++
    ){

      hairPiece(
        i*.12,
        -.18,
        0,
        .38,
        2.1,
        .38
      );
    }

    return;
  }


  if(style==="natural"){

    hair.scale.set(
      1.15,
      1,
      1.15
    );

    return;
  }


  if(style==="long"){

    hair.scale.set(
      1.08,
      1.1,
      1.08
    );

    hairPiece(
      -.31,
      -.22,
      0,
      .32,
      1.7,
      .4
    );

    hairPiece(
      .31,
      -.22,
      0,
      .32,
      1.7,
      .4
    );

    return;
  }


  if(style==="short"){

    hair.scale.set(
      1,
      .7,
      1
    );

    return;
  }
}

    Math.PI;

  chain.position.set(
    0,
    1.73,
    -.37
  );

  accessoryGroup.add(
    chain
  );


  const pendant =
    new THREE.Mesh(
      new THREE.OctahedronGeometry(
        .07
      ),
      goldMaterial
    );

  pendant.position.set(
    0,
    1.57,
    -.4
  );

  accessoryGroup.add(
    pendant
  );
}


function createWatch(){

  const watch =
    box(
      .15,
      .18,
      .07,
      goldMaterial
    );

  watch.position.set(
    .63,
    1.22,
    -.05
  );

  accessoryGroup.add(
    watch
  );
}


function createEarrings(){

  for(
    const side of [-1,1]
  ){

    const earring =
      new THREE.Mesh(
        new THREE.TorusGeometry(
          .06,
          .015,
          8,
          16
        ),
        goldMaterial
      );

    earring.position.set(
      side*.43,
      2.59,
      0
    );

    accessoryGroup.add(
      earring
    );
  }
}


function createHeadphones(){

  const material =
    new THREE.MeshStandardMaterial({
      color:0x111111,
      roughness:.55
    });

  const band =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .46,
        .04,
        8,
        32,
        Math.PI
      ),
      material
    );

  band.rotation.x=
    Math.PI/2;

  band.position.set(
    0,
    2.83,
    0
  );

  accessoryGroup.add(
    band
  );


  for(
    const side of [-1,1]
  ){

    const ear =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .105,
          .105,
          .13,
          16
        ),
        material
      );

    ear.rotation.z=
      Math.PI/2;

    ear.position.set(
      side*.44,
      2.61,
      0
    );

    accessoryGroup.add(ear);
  }
}


function applyAccessory(value){

  clearAccessories();

  const accessory =
    normalize(value);

  if(
    !accessory ||
    accessory==="none"
  ) return;

  if(accessory==="cap"){
    createCap();
    return;
  }

  if(accessory==="glasses"){
    createGlasses();
    return;
  }

  if(accessory==="chain"){
    createChain();
    return;
  }

  if(accessory==="watch"){
    createWatch();
    return;
  }

  if(accessory==="earrings"){
    createEarrings();
    return;
  }

  if(accessory==="headphones"){
    createHeadphones();
    return;
  }
}


/* =========================================================
   SKIN
========================================================= */

  const colors={
    light:0xc68662,
    medium:0x9f6948,
    deep:0x6b3f24,
    dark:0x542f1c,
    brown:0x8d5524
  };

    colors[

    ] ||

  skinDarkMaterial.color.set(

/* =========================================================
   COMPLETE APPEARANCE
========================================================= */

function applyCharacterAppearance(character){

  applySkinTone(
    character.skin_tone
  );

  applyHairColor(
    character.hair_color
  );

  applyHairstyle(
    character.hairstyle
  );

  applyOutfit(
    character.outfit
  );

  applyAccessory(
    character.accessory
  );
}


/* =========================================================
   LOAD CHARACTER
========================================================= */

let currentCharacter=null;

async function loadCharacter(){

  try{

    const {
      data:sessionData,
      error:sessionError
    } =
      await db.auth.getSession();

    if(sessionError)
      throw sessionError;

    const session =
      sessionData?.session;

    if(!session){

      throw new Error(
        "You are not logged in."
      );
    }


    const {
      data,
      error
    } =
      await db.rpc(
        "get_my_character"
      );

    if(error)
      throw error;

    if(!data)
      throw new Error(
        "No Naija Hustle character was found."
      );

    currentCharacter =
      Array.isArray(data)
        ? data[0]
        : data;

    if(!currentCharacter)
      throw new Error(
        "Character data is empty."
      );


    applyCharacterAppearance(
      currentCharacter
    );


    document
      .getElementById("playerName")
      .textContent =
        currentCharacter.name ||
        "Player";


    const district =
      currentCharacter.district ||
      currentCharacter.current_district ||
      "";


    const level =
      currentCharacter.level;


    const details=[];

    if(district)
      details.push(district);

    if(
      level!==undefined &&
      level!==null
    )
      details.push(
        `Level ${level}`
      );


    document
      .getElementById(
        "playerDetails"
      )
      .textContent =
        details.join(" • ");


    document
      .getElementById("status")
      .textContent="Idle";


    document
      .getElementById("loading")
      .style.display="none";


    return true;

  }catch(error){

    console.error(
      "3D character load error:",
      error
    );

    document
      .getElementById("loading")
      .innerHTML=`
        <div>Unable to load your character.</div>
        <small>${escapeHtml(
          error?.message ||
          "Unknown error"
        )}</small>
      `;

    return false;
  }
}


function escapeHtml(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
  document.getElementById(
    "controls"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickX=0;
let joystickY=0;
let dragging=false;


function updateJoystick(
  clientX,
  clientY
){

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left+
    rect.width/2;

  const centerY =
    rect.top+
    rect.height/2;

  let dx =
    clientX-centerX;

  let dy =
    clientY-centerY;

  const maxDistance=43;

  const distance =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(distance>maxDistance){

    dx=
      dx/distance*
      maxDistance;

    dy=
      dy/distance*
      maxDistance;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  joystickX=
    dx/maxDistance;

  joystickY=
    dy/maxDistance;
}


joystick.addEventListener(
  "pointerdown",
  e=>{

    dragging=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(
      e.clientX,
      e.clientY
    );
  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(!dragging)return;

    updateJoystick(
      e.clientX,
      e.clientY
    );
  }
);


function resetJoystick(){

  dragging=false;

  joystickX=0;
  joystickY=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
   MOVEMENT
========================================================= */

const clock =
  new THREE.Clock();

const status =
  document.getElementById(
    "status"
  );


function updateMovement(delta){

  let x=0;
  let z=0;

  if(
    keys["w"] ||
    keys["arrowup"]
  ) z-=1;

  if(
    keys["s"] ||
    keys["arrowdown"]
  ) z+=1;

  if(
    keys["a"] ||
    keys["arrowleft"]
  ) x-=1;

  if(
    keys["d"] ||
    keys["arrowright"]
  ) x+=1;

  x+=joystickX;
  z+=joystickY;


  const moving =
    Math.abs(x)>.05 ||
    Math.abs(z)>.05;


  if(moving){

    const length =
      Math.sqrt(
        x*x+
        z*z
      );

    if(length>0){

      x/=length;
      z/=length;
    }


    const speed=
      4*delta;

    avatar.position.x+=
      x*speed;

    avatar.position.z+=
      z*speed;


    const targetRotation=
      Math.atan2(
        x,
        z
      );

    avatar.rotation.y=
      THREE.MathUtils.lerp(
        avatar.rotation.y,
        targetRotation,
        .15
      );


    status.textContent=
      "Walking";


    const time=
      performance.now()*.009;


    const swing=
      Math.sin(time)*.65;


    /* legs */

    leftLeg.root.rotation.x=
      swing;

    rightLeg.root.rotation.x=
      -swing;


    /* arms */

    leftArm.shoulder.rotation.x=
      -swing*.65;

    rightArm.shoulder.rotation.x=
      swing*.65;


    /* slight body bounce */

    bodyRoot.position.y=
      Math.abs(
        Math.sin(time)
      )*.025;


  }else{

    status.textContent=
      "Idle";


    leftLeg.root.rotation.x=
      THREE.MathUtils.lerp(
        leftLeg.root.rotation.x,
        0,
        .15
      );

    rightLeg.root.rotation.x=
      THREE.MathUtils.lerp(
        rightLeg.root.rotation.x,
        0,
        .15
      );

    leftArm.shoulder.rotation.x=
      THREE.MathUtils.lerp(
        leftArm.shoulder.rotation.x,
        0,
        .15
      );

    rightArm.shoulder.rotation.x=
      THREE.MathUtils.lerp(
        rightArm.shoulder.rotation.x,
        0,
        .15
      );


    bodyRoot.position.y=
      THREE.MathUtils.lerp(
        bodyRoot.position.y,
        0,
        .15
      );
  }


  avatar.position.x=
    THREE.MathUtils.clamp(
      avatar.position.x,
      -5,
      5
    );

  avatar.position.z=
    THREE.MathUtils.clamp(
      avatar.position.z,
      -95,
      95
    );
}


/* =========================================================
   CAMERA
========================================================= */

const cameraTarget =
  new THREE.Vector3();

const cameraDesired =
  new THREE.Vector3();


function updateCamera(){

  cameraTarget.set(
    avatar.position.x,
    avatar.position.y+1.45,
    avatar.position.z
  );


  cameraDesired.set(
    avatar.position.x,
    avatar.position.y+3.65,
    avatar.position.z+6.7
  );


  camera.position.lerp(
    cameraDesired,
    .075
  );


  camera.lookAt(
    cameraTarget
  );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);


/* =========================================================
   BACK
========================================================= */

document
  .getElementById("backButton")
  .addEventListener(
    "click",
    ()=>{

      if(
        window.history.length>1
      ){

        window.history.back();

      }else{

        window.location.href=
          "index.html";
      }
    }
  );


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  updateMovement(delta);

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   START
========================================================= */

const characterLoaded=
  await loadCharacter();

if(characterLoaded)
  animate();

</script>
